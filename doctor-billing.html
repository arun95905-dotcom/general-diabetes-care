/* =========================================================
   SUPABASE
   ========================================================= */

const SUPABASE_URL =
  "https://twdmvdqqckcpwoccvtkj.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
  "sb_publishable_qDvT0t7pC5l5kbKl9QirMg_JbBrvUyI";


const supabaseClient =
  supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
  );


/* =========================================================
   HELPERS
   ========================================================= */

function escapeHTML(value) {

  if (
    value === null ||
    value === undefined
  ) {

    return "";

  }

  return String(value)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");

}


/* =========================================================
   LOGIN CHECK
   ========================================================= */

async function checkDoctorLogin() {

  const {
    data: {
      session
    }
  } =
    await supabaseClient.auth.getSession();


  if (!session) {

    window.location.href =
      "doctor-login.html";

    return false;

  }

  return true;

}


checkDoctorLogin();


/* =========================================================
   TODAY'S DATE
   ========================================================= */

function setToday() {

  const today =
    new Date();

  const year =
    today.getFullYear();

  const month =
    String(
      today.getMonth() + 1
    ).padStart(
      2,
      "0"
    );

  const day =
    String(
      today.getDate()
    ).padStart(
      2,
      "0"
    );


  document
    .getElementById(
      "billDate"
    )
    .value =
      `${year}-${month}-${day}`;

}


setToday();


/* =========================================================
   CALCULATE TOTAL
   ========================================================= */

function calculateTotal() {

  const consultationFee =
    Number(
      document
        .getElementById(
          "consultationFee"
        )
        .value
    ) || 0;


  const medicineCharges =
    Number(
      document
        .getElementById(
          "medicineCharges"
        )
        .value
    ) || 0;


  const procedureCharges =
    Number(
      document
        .getElementById(
          "procedureCharges"
        )
        .value
    ) || 0;


  const discount =
    Number(
      document
        .getElementById(
          "discount"
        )
        .value
    ) || 0;


  const total =
    consultationFee +
    medicineCharges +
    procedureCharges -
    discount;


  document
    .getElementById(
      "totalAmount"
    )
    .textContent =
      Math.max(
        0,
        total
      ).toFixed(2);

}


/* =========================================================
   TOTAL EVENT LISTENERS
   ========================================================= */

[
  "consultationFee",
  "medicineCharges",
  "procedureCharges",
  "discount"
].forEach(
  function(id) {

    document
      .getElementById(id)
      .addEventListener(
        "input",
        calculateTotal
      );

  }
);


/* =========================================================
   SEARCH PATIENT
   ========================================================= */

async function searchBillingPatients() {

  const search =
    document
      .getElementById(
        "billingPatientSearch"
      )
      .value
      .trim();


  const resultsContainer =
    document.getElementById(
      "billingPatientResults"
    );


  if (!search) {

    resultsContainer.innerHTML =
      "<p>Please enter Patient ID, name or phone number.</p>";

    return;

  }


  resultsContainer.innerHTML =
    "<p>Searching...</p>";


  let query =
    supabaseClient
      .from("patients")
      .select("*");


  if (/^\d+$/.test(search)) {

    query =
      query.or(
        `id.eq.${search},patient_phone.ilike.%${search}%,patient_name.ilike.%${search}%`
      );

  }

  else {

    query =
      query.or(
        `patient_name.ilike.%${search}%,patient_phone.ilike.%${search}%`
      );

  }


  const {
    data,
    error
  } =
    await query
      .order(
        "patient_name",
        {
          ascending: true
        }
      );


  if (error) {

    console.error(
      error
    );

    resultsContainer.innerHTML =
      "<p>Unable to search patients.</p>";

    return;

  }


  if (
    !data ||
    data.length === 0
  ) {

    resultsContainer.innerHTML =
      "<p>No patients found.</p>";

    return;

  }

  resultsContainer.innerHTML =
    "";


  data.forEach(
    async function(patient) {

      const card =
        document.createElement(
          "div"
        );


      card.className =
        "appointment-card";

card.dataset.patientId =
  patient.id;

card.dataset.patientName =
  patient.patient_name || "";

card.dataset.patientPhone =
  patient.patient_phone || "";
      card.innerHTML = `

        <strong>
          👤 ${escapeHTML(
            patient.patient_name || "-"
          )}
        </strong>

        <span>
          🆔 Patient ID:
          ${escapeHTML(
            patient.id
          )}
        </span>

        <span>
          📞 Contact:
          ${escapeHTML(
            patient.patient_phone || "-"
          )}
        </span>


        <button
          type="button"
          class="doctor-login-button"
          onclick="selectPatientForBilling(
            ${patient.id}
          )">

          💰 Create Bill

        </button>


        <div
          id="billing-history-${patient.id}"
          style="margin-top:15px;">

          <p>
            🧾 Loading previous bills...
          </p>

        </div>

      `;


      resultsContainer.appendChild(
        card
      );


      /*
         Immediately load previous bills
         after patient search.
      */

      await loadBillingHistory(
        patient.id
      );

    }
  );

}


/* =========================================================
   SELECT PATIENT
   ========================================================= */

let selectedPatient =
  null;


function selectPatientForBilling(
  patientId
) {

  /*
     Find the patient from the
     currently displayed search results.
  */

  const patient =
    document.querySelector(
      `[data-patient-id="${patientId}"]`
    );


  if (!patient) {

    console.error(
      "Patient element not found."
    );

    return;

  }


  selectedPatient =
    {
      id:
        patientId,

      patient_name:
        patient.dataset.patientName,

      patient_phone:
        patient.dataset.patientPhone
    };


  document
    .getElementById(
      "billingPatientName"
    )
    .textContent =
      selectedPatient.patient_name ||
      "-";


  document
    .getElementById(
      "billingPatientId"
    )
    .textContent =
      selectedPatient.id;


  document
    .getElementById(
      "billingPatientPhone"
    )
    .textContent =
      selectedPatient.patient_phone ||
      "-";


  document
    .getElementById(
      "billingFormContainer"
    )
    .style.display =
      "block";


  /*
     Scroll to billing form.
  */

  document
    .getElementById(
      "billingFormContainer"
    )
    .scrollIntoView({
      behavior:
        "smooth",
      block:
        "start"
    });

}


/* =========================================================
   SAVE BILL
   ========================================================= */

async function saveBill() {

  if (!selectedPatient) {

    alert(
      "Please select a patient first."
    );

    return;

  }


  const consultationFee =
    Number(
      document
        .getElementById(
          "consultationFee"
        )
        .value
    ) || 0;


  const medicineCharges =
    Number(
      document
        .getElementById(
          "medicineCharges"
        )
        .value
    ) || 0;


  const procedureCharges =
    Number(
      document
        .getElementById(
          "procedureCharges"
        )
        .value
    ) || 0;


  const discount =
    Number(
      document
        .getElementById(
          "discount"
        )
        .value
    ) || 0;


  const total =
    Math.max(
      0,
      consultationFee +
      medicineCharges +
      procedureCharges -
      discount
    );


  const billDate =
    document
      .getElementById(
        "billDate"
      )
      .value;


  const paymentStatus =
    document
      .getElementById(
        "paymentStatus"
      )
      .value;


  const paymentMethod =
    document
      .getElementById(
        "paymentMethod"
      )
      .value;


  const receiptNumber =
    document
      .getElementById(
        "receiptNumber"
      )
      .value
      .trim();


  const notes =
    document
      .getElementById(
        "billingNotes"
      )
      .value
      .trim();


  const {
    error
  } =
    await supabaseClient
      .from("billing")
      .insert({

        patient_id:
          selectedPatient.id,

        bill_date:
          billDate,

        consultation_fee:
          consultationFee,

        medicine_charges:
          medicineCharges,

        procedure_charges:
          procedureCharges,

        discount:
          discount,

        total_amount:
          total,

        payment_status:
          paymentStatus,

        payment_method:
          paymentMethod ||
          null,

        receipt_number:
          receiptNumber ||
          null,

        notes:
          notes ||
          null

      });


  if (error) {

    console.error(
      "Billing save error:",
      error
    );

    alert(
      "Unable to save bill: " +
      error.message
    );

    return;

  }


  alert(
    "Bill saved successfully."
  );


  clearBillingForm();


  loadBillingHistory(
    selectedPatient.id
  );

}

   CLEAR FORM

  document

  calculateTotal();

/* =========================================================
   TOGGLE FULL BILL
   ========================================================= */

function toggleFullBill(
  billId
) {

  const bill =
    document.getElementById(
      "full-bill-" + billId
    );


  if (!bill) {

    return;

  }


  const button =
    bill
      .previousElementSibling;


  if (
    bill.style.display ===
    "none"
  ) {

    bill.style.display =
      "block";


    if (button) {

      button.textContent =
        "🔽 Hide Full Bill";

    }

  }

  else {

    bill.style.display =
      "none";


    if (button) {

      button.textContent =
        "▶️ View Full Bill";

    }

  }

}


/* =========================================================
   DELETE BILL
   ========================================================= */

async function deleteBill(
  billId,
  patientId
) {

  const confirmed =
    confirm(
      "Are you sure you want to permanently delete Bill #" +
      billId +
      "?"
    );


  if (!confirmed) {

    return;

  }


  const {
    error
  } =
    await supabaseClient
      .from("billing")
      .delete()
      .eq(
        "id",
        billId
      );


  if (error) {

    console.error(
      "Billing deletion error:",
      error
    );


    alert(
      "Unable to delete bill: " +
      error.message
    );


    return;

  }


  alert(
    "Bill deleted successfully."
  );


  /*
     Refresh the patient's
     billing history.
  */

  await loadBillingHistory(
    patientId
  );

  }

async function loadBillingHistory(
  patientId
) {

  const container =
    document.getElementById(
      "billing-history-" + patientId
    );


  if (!container) {

    return;

  }


  container.innerHTML =
    "<p>🧾 Loading previous bills...</p>";


  const {
    data,
    error
  } =
    await supabaseClient
      .from("billing")
      .select("*")
      .eq(
        "patient_id",
        patientId
      )
      .order(
        "bill_date",
        {
          ascending: false
        }
      )
      .order(
        "id",
        {
          ascending: false
        }
      );


  if (error) {

    console.error(
      "Billing history error:",
      error
    );

    container.innerHTML =
      "<p>Unable to load billing history.</p>";

    return;

  }


  if (
    !data ||
    data.length === 0
  ) {

    container.innerHTML = `

      <div class="patient-profile-section">

        <h3>
          🧾 Previous Bills
        </h3>

        <p>
          No previous bills found.
        </p>

      </div>

    `;

    return;

  }


  let html = `

    <div class="patient-profile-section">

      <h3>
        🧾 Previous Bills
        (${data.length})
      </h3>

  `;


  data.forEach(
    function(bill) {

      html += `

            ▶️ View Full Bill

            style="display:none; margin-top:10px;"
          >

            <hr>


            <p>
              <strong>
                Bill Number:
              </strong>
              ${escapeHTML(
                bill.id
              )}
            </p>


            <p>
              <strong>
                Bill Date:
              </strong>
              ${escapeHTML(
                bill.bill_date || "-"
              )}
            </p>


            <p>
              <strong>
                Consultation Fee:
              </strong>
              ₹${Number(
                bill.consultation_fee || 0
              ).toFixed(2)}
            </p>


            <p>
              <strong>
                Medicine Charges:
              </strong>
              ₹${Number(

            </p>


            <p>
              <strong>

              ₹${Number(

            </p>


            <p>

            <p>

            </p>


            <p>
