  supabase.createClient(

/* =========================================================
   GLOBAL VARIABLES
   ========================================================= */

let selectedPatient = null;

let selectedConsultationId = null;


/* =========================================================
   ESCAPE HTML
   ========================================================= */

function escapeHTML(value) {

  if (
    value === null ||
    value === undefined
  ) {

    return "";

  }

  return String(value)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");

}


/* =========================================================
   PROFESSIONAL BILL NUMBER
   =========================================================

   The existing billing table ID is used.

   Example:

   Database ID = 1
   GDC-2026-0001

   Database ID = 25
   GDC-2026-0025

   No new database column is required.
   ========================================================= */

function getProfessionalBillNumber(
  billId,
  billDate
) {

  let year =
    new Date().getFullYear();


  if (billDate) {

    const parsedDate =
      new Date(
        billDate + "T00:00:00"
      );


    if (
      !isNaN(
        parsedDate.getTime()
      )
    ) {

      year =
        parsedDate.getFullYear();

    }

  }


  return (
    "GDC-" +
    year +
    "-" +
    String(
      billId
    ).padStart(
      4,
      "0"
    )
  );

}


/* =========================================================
   TODAY'S DATE
   ========================================================= */

function getTodayString() {

  const today =
    new Date();


  const year =
    today.getFullYear();


  const month =
    String(
      today.getMonth() + 1
    ).padStart(
      2,
      "0"
    );


  const day =
    String(
      today.getDate()
    ).padStart(
      2,
      "0"
    );


  return (
    year +
    "-" +
    month +
    "-" +
    day
  );

}


/* =========================================================
   SET TODAY
   ========================================================= */

function setToday() {

  const billDate =
    document.getElementById(
      "billDate"
    );


  if (billDate) {

    billDate.value =
      getTodayString();

  }

}


setToday();


/* =========================================================
   LOGIN CHECK
   ========================================================= */

async function checkDoctorLogin() {

  const {
    data: {
      session
    }
  } =
    await supabaseClient.auth.getSession();


  if (!session) {

    window.location.href =
      "doctor-login.html";

    return false;

  }


  return true;

}


/* =========================================================
   CALCULATE TOTAL
   ========================================================= */

function calculateTotal() {

  const consultationFee =
    Number(
      document
        .getElementById(
          "consultationFee"
        )
        .value
    ) || 0;


  const medicineCharges =
    Number(
      document
        .getElementById(
          "medicineCharges"
        )
        .value
    ) || 0;


  const procedureCharges =
    Number(
      document
        .getElementById(
          "procedureCharges"
        )
        .value
    ) || 0;


  const total =
    Math.max(
      0,
      consultationFee +
      medicineCharges +
      procedureCharges
    );


  document
    .getElementById(
      "totalAmount"
    )
    .textContent =
      total.toFixed(2);


  return total;

}


/* =========================================================
   TOTAL EVENT LISTENERS
   ========================================================= */

[
  "consultationFee",
  "medicineCharges",
  "procedureCharges"
].forEach(
  function(id) {

    document
      .getElementById(id)
      .addEventListener(
        "input",
        calculateTotal
      );

  }
);


/* =========================================================
   SEARCH PATIENT
   ========================================================= */

async function searchBillingPatients() {

  const search =
    document
      .getElementById(
        "billingPatientSearch"
      )
      .value
      .trim();


  const resultsContainer =
    document.getElementById(
      "billingPatientResults"
    );


  if (!search) {

    resultsContainer.innerHTML =
      "<p>Please enter Patient ID, name or phone number.</p>";

    return;

  }


  resultsContainer.innerHTML =
    "<p>🔎 Searching patients...</p>";


  let query =
    supabaseClient
      .from("patients")
      .select("*");


  /*
     Numeric search:
     Patient ID OR phone OR name
  */

  if (
    /^\d+$/.test(search)
  ) {

    query =
      query.or(
        "id.eq." +
        search +
        ",patient_phone.ilike.%" +
        search +
        "%,patient_name.ilike.%" +
        search +
        "%"
      );

  }

  /*
     Name / phone search
  */

  else {

    query =
      query.or(
        "patient_name.ilike.%" +
        search +
        "%,patient_phone.ilike.%" +
        search +
        "%"
      );

  }


  const {
    data,
    error
  } =
    await query
      .order(
        "patient_name",
        {
          ascending: true
        }
      );


  if (error) {

    console.error(
      "Patient search error:",
      error
    );


    resultsContainer.innerHTML =
      "<p>Unable to search patients.</p>";

    return;

  }


  if (
    !data ||
    data.length === 0
  ) {

    resultsContainer.innerHTML =
      "<p>No patients found.</p>";

    return;

  }


  resultsContainer.innerHTML =
    "";


  data.forEach(
    function(patient) {

      const card =
        document.createElement(
          "div"
        );


      card.className =
        "appointment-card";


      card.dataset.patientId =
        patient.id;


      card.dataset.patientName =
        patient.patient_name || "";


      card.dataset.patientPhone =
        patient.patient_phone || "";


      card.innerHTML = `

        <strong>
          👤 ${escapeHTML(
            patient.patient_name || "-"
          )}
        </strong>

        <span>
          🆔 Patient ID:
          ${escapeHTML(
            patient.id
          )}
        </span>

        <span>
          📞 Contact:
          ${escapeHTML(
            patient.patient_phone || "-"
          )}
        </span>

        <button
          type="button"
          class="doctor-login-button"
          onclick="selectPatientForBilling(
            ${Number(patient.id)}
          )">

          💰 Create Bill

        </button>


        <div
          id="billing-history-${patient.id}"
          style="margin-top:15px;">

          <p>
            🧾 Loading previous bills...
          </p>

        </div>

      `;


      resultsContainer.appendChild(
        card
      );


      loadBillingHistory(
        patient.id
      );

    }
  );

}


/* =========================================================
   SELECT PATIENT
   ========================================================= */

function selectPatientForBilling(
  patientId
) {

  const patientElement =
    document.querySelector(
      `[data-patient-id="${patientId}"]`
    );


  if (!patientElement) {

    console.error(
      "Patient element not found."
    );

    return;

  }


  selectedPatient = {

    id:
      patientId,

    patient_name:
      patientElement.dataset.patientName,

    patient_phone:
      patientElement.dataset.patientPhone

  };


  document
    .getElementById(
      "billingPatientName"
    )
    .textContent =
      selectedPatient.patient_name ||
      "-";


  document
    .getElementById(
      "billingPatientId"
    )
    .textContent =
      selectedPatient.id;


  document
    .getElementById(
      "billingPatientPhone"
    )
    .textContent =
      selectedPatient.patient_phone ||
      "-";


  document
    .getElementById(
      "billingFormContainer"
    )
    .style.display =
      "block";


  /*
     Bill number is generated
     automatically when the bill
     receives its database ID.
  */

  document
    .getElementById(
      "billNumberDisplay"
    )
    .value =
      "Automatically generated after saving";


  document
    .getElementById(
      "billingFormContainer"
    )
    .scrollIntoView({
      behavior: "smooth",
      block: "start"
    });

}


/* =========================================================
   SAVE BILL
   ========================================================= */

async function saveBill() {

  if (!selectedPatient) {

    alert(
      "Please select a patient first."
    );

    return;

  }


  const saveButton =
    document.getElementById(
      "saveBillButton"
    );


  saveButton.disabled =
    true;


  saveButton.textContent =
    "💾 Saving Bill...";


  try {

    const consultationFee =
      Number(
        document
          .getElementById(
            "consultationFee"
          )
          .value
      ) || 0;


    const medicineCharges =
      Number(
        document
          .getElementById(
            "medicineCharges"
          )
          .value
      ) || 0;


    const procedureCharges =
      Number(
        document
          .getElementById(
            "procedureCharges"
          )
          .value
      ) || 0;


    const total =
      Math.max(
        0,
        consultationFee +
        medicineCharges +
        procedureCharges
      );


    const billDate =
      document
        .getElementById(
          "billDate"
        )
        .value;


    const paymentStatus =
      document
        .getElementById(
          "paymentStatus"
        )
        .value;


    const paymentMethod =
      document
        .getElementById(
          "paymentMethod"
        )
        .value;


    const notes =
      document
        .getElementById(
          "billingNotes"
        )
        .value
        .trim();


    /*
       IMPORTANT:

       receipt_number is deliberately NOT
       inserted.

       The professional Bill Number is
       generated from billing.id after
       the bill is saved.
    */

    const {
      data: insertedBill,
      error
    } =
      await supabaseClient
        .from("billing")
        .insert({

          patient_id:
            selectedPatient.id,

          consultation_id:
            selectedConsultationId ||
            null,

          bill_date:
            billDate,

          consultation_fee:
            consultationFee,

          medicine_charges:
            medicineCharges,

          procedure_charges:
            procedureCharges,

          total_amount:
            total,

          payment_status:
            paymentStatus,

          payment_method:
            paymentMethod ||
            null,

          notes:
            notes ||
            null

        })
        .select("*")
        .single();


    if (error) {

      console.error(
        "Billing save error:",
        error
      );


      alert(
        "Unable to save bill: " +
        error.message
      );


      return;

    }


    const professionalBillNumber =
      getProfessionalBillNumber(
        insertedBill.id,
        insertedBill.bill_date
      );


    document
      .getElementById(
        "billNumberDisplay"
      )
      .value =
        professionalBillNumber;


    alert(
      "Bill saved successfully.\n\nBill Number: " +
      professionalBillNumber
    );


    clearBillingForm();


    /*
       Keep selected patient displayed.
    */

    document
      .getElementById(
        "billingFormContainer"
      )
      .style.display =
        "none";


    /*
       Refresh patient history.
    */

    await loadBillingHistory(
      selectedPatient.id
    );


    /*
       Refresh today's bills.
    */

    await loadTodayBills();


    /*
       Clear consultation ID after
       successful save so a new bill
       does not accidentally reuse it.
    */

    selectedConsultationId =
      null;

  }

  finally {

    saveButton.disabled =
      false;

    saveButton.textContent =
      "💾 Save Bill";

  }

}


/* =========================================================
   CLEAR BILLING FORM
   ========================================================= */

function clearBillingForm() {

  document
    .getElementById(
      "consultationFee"
    )
    .value = "";


  document
    .getElementById(
      "medicineCharges"
    )
    .value = "";


  document
    .getElementById(
      "procedureCharges"
    )
    .value = "";


  document
    .getElementById(
      "paymentStatus"
    )
    .value =
      "Pending";


  document
    .getElementById(
      "paymentMethod"
    )
    .value =
      "";


  document
    .getElementById(
      "billingNotes"
    )
    .value = "";


  document
    .getElementById(
      "billNumberDisplay"
    )
    .value =
      "Automatically generated after saving";


  setToday();


  calculateTotal();

}


/* =========================================================
   TOGGLE FULL BILL
   ========================================================= */

function toggleFullBill(
  billId
) {

  const bill =
    document.getElementById(
      "full-bill-" + billId
    );


  if (!bill) {

    return;

  }


  const button =
    bill.previousElementSibling;


  if (
    bill.style.display ===
    "none"
  ) {

    bill.style.display =
      "block";


    if (button) {

      button.textContent =
        "🔽 Hide Full Bill";

    }

  }

  else {

    bill.style.display =
      "none";


    if (button) {

      button.textContent =
        "▶️ View Full Bill";

    }

  }

}


/* =========================================================
   GET PATIENT DETAILS
   ========================================================= */

async function getPatientById(
  patientId
) {

  const {
    data,
    error
  } =
    await supabaseClient
      .from("patients")
      .select("*")
      .eq(
        "id",
        patientId
      )
      .single();


  if (error) {

    console.error(
      "Patient loading error:",

    );

    return null;

  }

}


/* =========================================================
   DELETE BILL
   ========================================================= */

async function deleteBill(
  billId,
  patientId
) {

  const professionalBillNumber =
    getProfessionalBillNumber(
      billId
    );


  const confirmed =
    confirm(
      "Are you sure you want to permanently delete Bill " +
      professionalBillNumber +
      "?"
    );


  if (!confirmed) {

    return;

  }


  const {
    error
  } =
    await supabaseClient
      .from("billing")
      .delete()
      .eq(
        "id",
        billId
      );


  if (error) {

    console.error(
      "Billing deletion error:",
      error
    );


    alert(
      "Unable to delete bill: " +
      error.message
    );


    return;

  }


  alert(
    "Bill deleted successfully."
  );


  await loadBillingHistory(
    patientId
  );


  await loadTodayBills();

}

/* =========================================================
   PRINT BILL
   ========================================================= */

async function printBill(
  billId,
  patientId
) {

  const {
    data: bill,
    error: billError
  } =
    await supabaseClient
      .from("billing")
      .select("*")
      .eq(
        "id",
        billId
      )
      .single();


  if (
    billError ||
    !bill
  ) {

    console.error(
      "Print bill error:",
      billError
    );


    alert(
      "Unable to load bill."
    );


    return;

  }


  const patient =
    await getPatientById(
      patientId
    );


  if (!patient) {

    alert(
      "Unable to load patient details."
    );


    return;

  }


  const receiptWindow =
    window.open(
      "",
      "_blank",
      "width=850,height=950"
    );


  if (!receiptWindow) {

    alert(
      "Please allow pop-ups to print the bill."
    );


    return;

  }


  const billHTML =
    createBillHTML(
      bill,
      patient
    );


  receiptWindow.document.open();

  receiptWindow.document.write(
    billHTML
  );

  receiptWindow.document.close();


  receiptWindow.onload =
    function() {

      receiptWindow.focus();

      receiptWindow.print();

    };

}


/* =========================================================
   DOWNLOAD BILL
   ========================================================= */

async function downloadBill(
  billId,
  patientId
) {

  const {
    data: bill,
    error: billError
  } =
    await supabaseClient
      .from("billing")
      .select("*")
      .eq(
        "id",
        billId
      )
      .single();


  if (
    billError ||
    !bill
  ) {

    console.error(
      "Download bill error:",
      billError
    );


    alert(
      "Unable to load bill."
    );


    return;

  }


  const patient =
    await getPatientById(
      patientId
    );


  if (!patient) {

    alert(
      "Unable to load patient details."
    );


    return;

  }


  const billHTML =
    createBillHTML(
      bill,
      patient
    );


  const blob =
    new Blob(
      [
        billHTML
      ],
      {
        type:
          "text/html;charset=utf-8"
      }
    );


  const url =
    URL.createObjectURL(
      blob
    );


  const billNumber =
    getProfessionalBillNumber(
      bill.id,
      bill.bill_date
    );


  const link =
    document.createElement(
      "a"
    );


  link.href =
    url;


  link.download =
    billNumber +
    ".html";


  document
    .body
    .appendChild(
      link
    );


  link.click();


  document
    .body
    .removeChild(
      link
    );


  URL.revokeObjectURL(
    url
  );

}

/* =========================================================

async function loadBillingHistory(
  patientId
) {

  const container =
    document.getElementById(
      "billing-history-" +
      patientId
    );


  if (!container) {

    return;

  }


  container.innerHTML =
    "<p>🧾 Loading previous bills...</p>";


  const {
    data,
    error
  } =
    await supabaseClient
      .from("billing")
      .select("*")
      .eq(
        "patient_id",
        patientId
      )
      .order(
        "bill_date",
        {
          ascending: false
        }
      )
      .order(
        "id",
        {
          ascending: false
        }
      );


  if (error) {

    console.error(
      "Billing history error:",
      error
    );


    container.innerHTML =
      "<p>Unable to load billing history.</p>";

    return;

  }


  if (
    !data ||
    data.length === 0
  ) {

    container.innerHTML = `

      <div class="patient-profile-section">

        <h3>
          🧾 Previous Bills
        </h3>

        <p>
          No previous bills found.
        </p>

      </div>

    `;

    return;

  }


  let html = `

    <div class="patient-profile-section">

      <h3>

        🧾 Previous Bills
        (${data.length})

      </h3>

  `;


  data.forEach(
    function(bill) {

      html +=
        createBillCardHTML(
          bill,
          {
            id:
              patientId,

            patient_name:
              selectedPatient &&
              String(
                selectedPatient.id
              ) ===
              String(patientId)
                ?
                selectedPatient.patient_name
                :
                "-",

            patient_phone:
              selectedPatient &&
              String(
                selectedPatient.id
              ) ===
              String(patientId)
                ?
                selectedPatient.patient_phone
                :
                "-"
          }
        );

    }
  );


  html += `
    </div>
  `;


  container.innerHTML =
    html;

}

/* =========================================================
   SEARCH BILLS
   ========================================================= */

async function searchBills() {

  const search =
    document
      .getElementById(
        "billSearchInput"
      )
      .value
      .trim();


  const resultsContainer =
    document.getElementById(
      "billSearchResults"
    );


  if (!search) {

    resultsContainer.innerHTML =
      "<p>Please enter Patient ID, name, phone or Bill Number.</p>";

    return;

  }


  resultsContainer.innerHTML =
    "<p>🔎 Searching bills...</p>";


  /*
     First check whether this looks like
     a professional bill number.

     Example:
     GDC-2026-0015
  */

  const billNumberMatch =
    search.match(
      /^GDC-\d{4}-(\d+)$/i
    );


  let bills =
    null;


  let billError =
    null;


  if (billNumberMatch) {

    const billId =
      Number(
        billNumberMatch[1]
      );


    const result =
      await supabaseClient
        .from("billing")
        .select("*")
        .eq(
          "id",
          billId
        );


    bills =
      result.data;


    billError =
      result.error;

  }


  else {

    /*
       Search patients first.
    */

    let patientQuery =
      supabaseClient
        .from("patients")
        .select("*");


    if (
      /^\d+$/.test(search)
    ) {

      patientQuery =
        patientQuery.or(
          "id.eq." +
          search +
          ",patient_phone.ilike.%" +
          search +
          "%,patient_name.ilike.%" +
          search +
          "%"
        );

    }

    else {

      patientQuery =
        patientQuery.or(
          "patient_name.ilike.%" +
          search +
          "%,patient_phone.ilike.%" +
          search +
          "%"
        );

    }


    const {
      data: patients,
      error: patientSearchError
    } =
      await patientQuery;


    if (patientSearchError) {

      console.error(
        "Bill patient search error:",
        patientSearchError
      );


      resultsContainer.innerHTML =
        "<p>Unable to search patients.</p>";

      return;

    }


    const patientIds =
      (
        patients || []
      ).map(
        function(patient) {

          return patient.id;

        }
      );


    if (
      patientIds.length === 0
    ) {

      resultsContainer.innerHTML =
        "<p>No patients or bills found.</p>";

      return;

    }


    const result =
      await supabaseClient
        .from("billing")
        .select("*")
        .in(
          "patient_id",
          patientIds
        )
        .order(
          "bill_date",
          {
            ascending: false
          }
        )
        .order(
          "id",
          {
            ascending: false
          }
        );


    bills =
      result.data;


    billError =
      result.error;

  }


  if (billError) {

    console.error(
      "Bill search error:",
      billError
    );


    resultsContainer.innerHTML =
      "<p>Unable to search bills.</p>";

    return;

  }


  if (
    !bills ||
    bills.length === 0
  ) {

    resultsContainer.innerHTML =
      "<p>No bills found.</p>";

    return;

  }


  /*
     Load patients for bills.
  */

  const patientIds =
    [
      ...new Set(
        bills.map(
          function(bill) {

            return bill.patient_id;

          }
        )
      )
    ];


  const {
    data: patients
  } =
    await supabaseClient
      .from("patients")
      .select("*")
      .in(
        "id",
        patientIds
      );


  const patientMap =
    new Map();


  (
    patients || []
  ).forEach(
    function(patient) {

      patientMap.set(
        String(patient.id),
        patient
      );

    }
  );


  let html = `

    <div class="patient-profile-section">

      <h2>

        🔎 Bill Search Results
        (${bills.length})

      </h2>

  `;


  bills.forEach(
    function(bill) {

      const patient =
        patientMap.get(
          String(
            bill.patient_id
          )
        ) || {

          id:
            bill.patient_id,

          patient_name:
            "-",

          patient_phone:
            "-"

        };


      html +=
        createBillCardHTML(
          bill,
          patient
        );

    }
  );


  html += `
    </div>
  `;


  resultsContainer.innerHTML =
    html;

}
