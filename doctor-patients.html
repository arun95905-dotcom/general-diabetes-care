/* =========================================================
   GENERAL
   ========================================================= */

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #f5f7fb;
  color: #172033;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",

    sans-serif;
}

button,
input,
select,
textarea {
  font-family: inherit;
}

.doctor-dashboard {
  min-height: 100vh;
  padding: 16px 10px 45px;
}

.patient-page {
  width: 100%;
  max-width: 1000px;
  margin: 0 auto;
}


/* =========================================================
   HEADER
   ========================================================= */

.portal-header {
  margin-bottom: 18px;
}

.section-label {
  margin: 0;
  color: #2563eb;
  font-size: 12px;
  font-weight: 850;
  letter-spacing: 1.3px;
}

.portal-header h1 {
  margin: 4px 0;
  font-size: 28px;
}

.portal-subtitle {
  margin: 0;
  color: #697386;
  font-size: 14px;
}


/* =========================================================
   VIEWS
   ========================================================= */

.portal-view {
  display: none;
}

.portal-view.active {
  display: block;
}


/* =========================================================
   CARDS
   ========================================================= */

.portal-card {
  margin-bottom: 14px;
  padding: 18px;
  background: #ffffff;
  border: 1px solid #e4e9f0;
  border-radius: 18px;
  box-shadow:
    0 5px 20px rgba(20,31,56,.06);
}

.portal-card h2,
.portal-card h3 {
  margin-top: 0;
}


/* =========================================================
   HOME
   ========================================================= */

.home-grid {
  display: grid;
  grid-template-columns:
    repeat(2,minmax(0,1fr));
  gap: 12px;
}

.home-button {
  width: 100%;

  padding: 20px;

  background:
    linear-gradient(
      145deg,
      #ffffff,
      #f8fafc
    );
  border: 1px solid #dfe6ef;
  border-radius: 17px;
  cursor: pointer;
  transition:
    transform .15s ease,
    box-shadow .15s ease;
}

.home-button:hover {
  transform: translateY(-2px);
  box-shadow:
    0 8px 22px rgba(20,31,56,.08);
}

.home-icon {
  display: block;
  margin-bottom: 8px;
  font-size: 31px;
}

.home-title {
  display: block;
  font-size: 17px;
  font-weight: 850;
}

.home-description {
  display: block;
  margin-top: 5px;
  color: #6b7280;
  font-size: 13px;
}

.today-button {
  min-height: auto;
  margin-top: 12px;
}

.today-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
}

.patient-count {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 36px;
  min-height: 28px;
  padding: 3px 10px;
  color: #ffffff;
  background: #2563eb;
  border-radius: 999px;
  font-size: 13px;
  font-weight: 850;
}


/* =========================================================
   BUTTONS
   ========================================================= */

.action-row {

  flex-wrap: wrap;

}

.portal-button {

  padding: 10px 14px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  border: none;
  border-radius: 11px;
  cursor: pointer;
  text-decoration: none;
  font-size: 14px;
  font-weight: 750;
}

.primary-button {
  background: #2563eb;
  color: #ffffff;
}

.success-button {
  background: #15803d;
  color: #ffffff;
}

.warning-button {

}

.purple-button {

}

.danger-button {

  color: #ffffff;
}

.secondary-button {

  color: #ffffff;
}

.light-button {

  border: 1px solid #dce3ec;
}

.small-button {

/* =========================================================
   HEADER ROW
   ========================================================= */

.view-header {

/* =========================================================
   SEARCH

.form-group.full-width {

/* =========================================================
   SUPABASE
   ========================================================= */

const SUPABASE_URL =
  "https://twdmvdqqckcpwoccvtkj.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
  "sb_publishable_qDvT0t7pC5l5kbKl9QirMg_JbBrvUyI";

const supabaseClient =
  supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
  );


/* =========================================================
   STATE
   ========================================================= */

let currentPatientId =
  null;

let currentConsultationId =
  null;


/* =========================================================
   HELPERS
   ========================================================= */

function escapeHTML(value) {

  if (
    value === null ||
    value === undefined
  ) {
    return "";
  }

  return String(value)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


function showView(
  viewId
) {

  document
    .querySelectorAll(
      ".portal-view"
    )
    .forEach(
      function(view) {

        view.classList.remove(
          "active"
        );

      }
    );


  const view =
    document.getElementById(
      viewId
    );


  if (view) {

    view.classList.add(
      "active"
    );

  }


  window.scrollTo({
    top: 0,
    behavior: "smooth"
  });

}


function showHomeView() {

  showView(
    "homeView"
  );

  loadTodayPatientCount();

}


function getTodayString() {

  const date =
    new Date();

  return (
    date.getFullYear() +
    "-" +
    String(
      date.getMonth() + 1
    ).padStart(
      2,
      "0"
    ) +
    "-" +
    String(
      date.getDate()
    ).padStart(
      2,
      "0"
    )
  );

}


function getTomorrowISO(
  dateString
) {

  const date =
    new Date(
      dateString +
      "T00:00:00"
    );

  date.setDate(
    date.getDate() + 1
  );

  return date.toISOString();

}


function formatDate(value) {

  if (!value) {
    return "-";
  }


  const date =
    new Date(
      String(value).length === 10
        ? value + "T00:00:00"
        : value
    );


  if (
    Number.isNaN(
      date.getTime()
    )
  ) {
    return value;
  }


  return date.toLocaleDateString(
    "en-IN",
    {
      day: "2-digit",
      month: "short",
      year: "numeric"
    }
  );

}


function formatDateTime(value) {

  if (!value) {
    return "-";
  }


  const date =
    new Date(value);


  if (
    Number.isNaN(
      date.getTime()
    )
  ) {
    return "-";
  }


  return date.toLocaleString(
    "en-IN",
    {
      day: "2-digit",
      month: "short",
      year: "numeric",
      hour: "numeric",
      minute: "2-digit"
    }
  );

}


function calculateAge(
  patient
) {

  if (
    patient.age !== null &&
    patient.age !== undefined &&
    patient.age !== ""
  ) {

    return patient.age;

  }


  if (!patient.date_of_birth) {
    return "-";
  }


  const dob =
    new Date(
      patient.date_of_birth +
      "T00:00:00"
    );


  const today =
    new Date();


  let age =
    today.getFullYear() -
    dob.getFullYear();


  const monthDifference =
    today.getMonth() -
    dob.getMonth();


  if (
    monthDifference < 0 ||
    (
      monthDifference === 0 &&
      today.getDate() <
      dob.getDate()
    )
  ) {

    age--;

  }


  return age;

}

/* =========================================================
   GET PATIENT
   ========================================================= */

async function getPatient(
  patientId
) {

  const {
    data,
    error
  } =
    await supabaseClient
      .from("patients")
      .select("*")
      .eq(
        "id",
        patientId
      )
      .single();


  if (
    error ||
    !data
  ) {

    console.error(
      "Patient load error:",
      error
    );

    alert(
      "Unable to load patient."
    );

    return null;

  }


  return data;

}

/* =========================================================
   SEARCH PATIENT
   ========================================================= */

async function searchPatients() {

  const search =
    document
      .getElementById(
        "patientSearch"
      )
      .value
      .trim();


  const container =
    document.getElementById(
      "patientSearchResults"
    );


  if (!search) {

    container.innerHTML = `

      <div class="portal-message">
        Enter Patient ID, name or phone number.
      </div>

    `;

    return;

  }


  container.innerHTML = `

    <div class="portal-message">
      🔎 Searching...
    </div>

  `;


  let query =
    supabaseClient
      .from("patients")
      .select("*");


  if (
    /^\d+$/.test(
      search
    )
  ) {

    query =
      query.or(
        "id.eq." +
        search +
        ",patient_name.ilike.%" +
        search +
        "%,patient_phone.ilike.%" +
        search +
        "%"
      );

  } else {

    query =
      query.or(
        "patient_name.ilike.%" +
        search +
        "%,patient_phone.ilike.%" +
        search +
        "%"
      );

  }


  const {
    data,
    error
  } =
    await query
      .order(
        "patient_name",
        {
          ascending: true
        }
      );


  if (error) {

    console.error(
      error
    );

    container.innerHTML = `

      <div class="portal-message">
        Unable to search patients.
      </div>

    `;

    return;

  }


  if (
    !data ||
    data.length === 0
  ) {

    container.innerHTML = `

      <div class="portal-message">
        No patients found.
      </div>

    `;

    return;

  }


  container.innerHTML =
    data
      .map(
        renderPatientResultCard
      )
      .join("");

}

/* =========================================================
   BUILD VITALS
   ========================================================= */

function buildVitals() {

  const parts =
    [];


  const bp =
    getValue(
      "consultBP"
    );


  const pulse =
    getValue(
      "consultPulse"
    );


  const spo2 =
    getValue(
      "consultSpO2"
    );


  const temperature =
    getValue(
      "consultTemperature"
    );


  const weight =
    getValue(
      "consultWeight"
    );


  const height =
    getValue(
      "consultHeight"
    );


  if (bp) {
    parts.push(
      "BP: " +
      bp
    );
  }


  if (pulse) {
    parts.push(
      "Pulse: " +
      pulse
    );
  }


  if (spo2) {
    parts.push(
      "SpO₂: " +
      spo2 +
      "%"
    );
  }


  if (temperature) {
    parts.push(
      "Temperature: " +
      temperature +
      " °F"
    );
  }


  if (weight) {
    parts.push(
      "Weight: " +
      weight +
      " kg"
    );
  }


  if (height) {
    parts.push(
      "Height: " +
      height +
      " cm"
    );
  }


  return parts.join(
    " | "
  );

}


function getValue(id) {

  const element =
    document.getElementById(
      id
    );


  return element
    ? element.value.trim()
    : "";

}


/* =========================================================
   SAVE CONSULTATION
   ========================================================= */

async function saveConsultation(
  patientId
) {

  const button =
    document.getElementById(
      "saveConsultationButton"
    );


  button.disabled =
    true;


  button.textContent =
    "⏳ Saving...";


  const consultation = {

    patient_id:
      patientId,

    chief_complaints:
      getValue(
        "consultChiefComplaints"
      ),

    vitals:
      buildVitals(),

    examination:
      getValue(
        "consultExamination"
      ),

    diagnosis:
      getValue(
        "consultDiagnosis"
      ),

    investigations:
      getValue(
        "consultInvestigations"
      ),

    prescription:
      getValue(
        "consultPrescription"
      ),

    advice:
      getValue(
        "consultAdvice"
      ),

    follow_up_date:
      document
        .getElementById(
          "consultFollowUp"
        )
        .value ||
      null

  };


  const {
    data,
    error
  } =
    await supabaseClient
      .from("consultations")
      .insert(
        consultation
      )
      .select()
      .single();


  if (error) {

    button.disabled =
      false;


    button.textContent =
      "💾 Save Consultation";


    alert(
      "Unable to save consultation:\n\n" +
      error.message
    );


    return;

  }


  try {

    const prescriptionFiles =
      Array.from(
        document
          .getElementById(
            "consultPrescriptionFiles"
          )
          .files ||
        []
      );


    await uploadPrescriptionFiles(
      patientId,
      data.id,
      prescriptionFiles
    );


    const labFiles =
      Array.from(
        document
          .getElementById(
            "consultLabFiles"
          )
          .files ||
        []
      );


    await uploadLabFiles(
      patientId,
      data.id,
      labFiles,
      document
        .getElementById(
          "consultLabType"
        )
        .value
    );


  } catch (uploadError) {

    console.error(
      uploadError
    );


    alert(
      "Consultation saved, but one or more files could not be uploaded:\n\n" +
      uploadError.message
    );

  }


  button.disabled =
    false;


  button.textContent =
    "💾 Save Consultation";


  alert(
    "Consultation saved successfully."
  );


  openSavedConsultation(
    patientId,
    data.id,
    true
  );

}


/* =========================================================
   PRESCRIPTION UPLOAD
   ========================================================= */

async function uploadPrescriptionFiles(
  patientId,
  consultationId,
  files
) {

  for (
    let i = 0;
    i < files.length;
    i++
  ) {

    const file =
      files[i];


    if (
      !file.type.startsWith(
        "image/"
      )
    ) {
      continue;
    }


    const safeName =
      file.name.replace(
        /[^a-zA-Z0-9._-]/g,
        "_"
      );


    const path =
      "patient-" +
      patientId +
      "/" +
      consultationId +
      "/" +
      Date.now() +
      "-" +
      i +
      "-" +
      safeName;


    const {
      error:
        uploadError
    } =
      await supabaseClient
        .storage
        .from(
          "prescriptions"
        )
        .upload(
          path,
          file,
          {
            upsert: false,
            contentType:
              file.type
          }
        );


    if (uploadError) {

      throw uploadError;

    }


    const {
      data:
        publicData
    } =
      supabaseClient
        .storage
        .from(
          "prescriptions"
        )
        .getPublicUrl(
          path
        );


    const {
      error:
        insertError
    } =
      await supabaseClient
        .from(
          "consultation_images"
        )
        .insert({

          consultation_id:
            consultationId,

          image_url:
            publicData.publicUrl

        });


    if (insertError) {

      throw insertError;

    }


    /*
       Keep first image in legacy column too.
       This helps older parts of portal remain compatible.
    */

    if (
      i === 0
    ) {

      const {
        data:
          consultation
      } =
        await supabaseClient
          .from(
            "consultations"
          )
          .select(
            "prescription_image_url"
          )
          .eq(
            "id",
            consultationId
          )
          .single();


      if (
        consultation &&
        !consultation.prescription_image_url
      ) {

        await supabaseClient
          .from(
            "consultations"
          )
          .update({

            prescription_image_url:
              publicData.publicUrl

          })
          .eq(
            "id",
            consultationId
          );

      }

    }

  }

}


/* =========================================================
   LAB UPLOAD
   ========================================================= */

async function uploadLabFiles(
  patientId,
  consultationId,
  files,
  reportType
) {

  const allowedTypes = [

    "image/jpeg",
    "image/png",
    "image/webp",
    "application/pdf"

  ];


  for (
    let i = 0;
    i < files.length;
    i++
  ) {

    const file =
      files[i];


    if (
      !allowedTypes.includes(
        file.type
      )
    ) {

      continue;

    }


    const safeName =
      file.name.replace(
        /[^a-zA-Z0-9._-]/g,
        "_"
      );


    const path =
      "patient-" +
      patientId +
      "/" +
      getTodayString() +
      "/" +
      consultationId +
      "-" +
      Date.now() +
      "-" +
      i +
      "-" +
      safeName;


    const {
      error:
        uploadError
    } =
      await supabaseClient
        .storage
        .from(
          "investigation-reports"
        )
        .upload(
          path,
          file,
          {
            upsert: false,
            contentType:
              file.type
          }
        );


    if (uploadError) {

      throw uploadError;

    }


    const {
      error:
        insertError
    } =
      await supabaseClient
        .from(
          "investigation_reports"
        )
        .insert({

          patient_id:
            patientId,

          consultation_id:
            consultationId,

          report_date:
            getTodayString(),

          report_type:
            reportType ||
            "Laboratory Report",

          file_name:
            file.name,

          file_path:
            path,

          file_type:
            file.type,

          file_size:
            file.size

        });


    if (insertError) {

      await supabaseClient
        .storage
        .from(
          "investigation-reports"
        )
        .remove([
          path
        ]);


      throw insertError;

    }

  }

}


/* =========================================================
   PRESCRIPTION IMAGES
   INCLUDES LEGACY prescription_image_url
   ========================================================= */

async function getConsultationPrescriptionImages(
  consultationId
) {

  const [
    imageResult,
    consultationResult
  ] =
    await Promise.all([

      supabaseClient
        .from(
          "consultation_images"
        )
        .select("*")
        .eq(
          "consultation_id",
          consultationId
        )
        .order(
          "id",
          {
            ascending: true
          }
        ),

      supabaseClient
        .from(
          "consultations"
        )
        .select(
          "prescription_image_url"
        )
        .eq(
          "id",
          consultationId
        )
        .single()

    ]);


  const images =
    (
      imageResult.data ||
      []
    )
    .map(
      function(image) {

        return {

          id:
            image.id,

          image_url:
            image.image_url,

          legacy:
            false

        };

      }
    );


  const legacyURL =
    consultationResult.data
      ? consultationResult
          .data
          .prescription_image_url
      : null;


  if (
    legacyURL &&
    !images.some(
      function(image) {

        return image.image_url ===
          legacyURL;

      }
    )
  ) {

    images.unshift({

      id:
        null,

      image_url:
        legacyURL,

      legacy:
        true

    });

  }


  return images;

}

async function toggleFullConsultation(
  consultationId
) {

  const box =
    document.getElementById(
      "fullConsultation"
    );


  const button =
    document.getElementById(
      "fullConsultationButton"
    );


  if (!box) {
    return;
  }


  if (
    box.classList.contains(
      "open"
    )
  ) {

    box.classList.remove(
      "open"
    );


    button.textContent =
      "▶ View Full Consultation";


    return;

  }


  box.classList.add(
    "open"
  );


  button.textContent =
    "▲ Hide Full Consultation";


  await loadFullConsultation(
    consultationId
  );

}

/* =========================================================
   ADD PRESCRIPTION IMAGE
   ========================================================= */

function uploadMorePrescription(
  patientId,
  consultationId
) {

  const input =
    document.createElement(
      "input"
    );


  input.type =
    "file";


  input.accept =
    "image/jpeg,image/png,image/webp";


  input.multiple =
    true;


  input.onchange =
    async function() {

      const files =
        Array.from(
          input.files ||
          []
        );


      if (
        files.length === 0
      ) {
        return;
      }


      try {

        await uploadPrescriptionFiles(
          patientId,
          consultationId,
          files
        );


        alert(
          files.length +
          " prescription image(s) uploaded successfully."
        );


        await openEditConsultation(
          consultationId
        );


      } catch (error) {

        console.error(
          error
        );


        alert(
          "Unable to upload prescription image:\n\n" +
          error.message
        );

      }

    };


  input.click();

}

/* =========================================================
   STORAGE PATH
   ========================================================= */

function getPrescriptionStoragePath(
  imageURL
) {

  if (!imageURL) {
    return null;
  }


  try {

    const url =
      new URL(
        imageURL
      );


    const markers = [

      "/storage/v1/object/public/prescriptions/",
      "/storage/v1/object/sign/prescriptions/"

    ];


    for (
      const marker of markers
    ) {

      const index =
        url.pathname.indexOf(
          marker
        );


      if (
        index !== -1
      ) {

        return decodeURIComponent(
          url.pathname.substring(
            index +
            marker.length
          )
        );

      }

    }


  } catch (error) {

    console.warn(
      error
    );

  }


  return null;

}


/* =========================================================
   DELETE PRESCRIPTION IMAGE
   SUPPORTS LEGACY
   ========================================================= */

async function deletePrescriptionImage(
  imageId,
  encodedURL,
  consultationId,
  isLegacy
) {

  const confirmed =
    confirm(
      "Delete this prescription image permanently?"
    );


  if (!confirmed) {
    return;
  }


  const imageURL =
    decodeURIComponent(
      encodedURL
    );


  /*
     Delete consultation_images record
  */

  if (
    imageId !== null &&
    imageId !== undefined
  ) {

    const {
      error
    } =
      await supabaseClient
        .from(
          "consultation_images"
        )
        .delete()
        .eq(
          "id",
          imageId
        );


    if (error) {

      alert(
        "Unable to delete prescription image:\n\n" +
        error.message
      );

      return;

    }

  }


  /*
     Clear legacy main URL
  */

  const {
    data:
      consultation
  } =
    await supabaseClient
      .from(
        "consultations"
      )
      .select(
        "prescription_image_url"
      )
      .eq(
        "id",
        consultationId
      )
      .single();


  if (
    isLegacy ||
    (
      consultation &&
      consultation.prescription_image_url ===
      imageURL
    )
  ) {

    const {
      data:
        remaining
    } =
      await supabaseClient
        .from(
          "consultation_images"
        )
        .select("*")
        .eq(
          "consultation_id",
          consultationId
        )
        .order(
          "id",
          {
            ascending: true
          }
        );


    const nextImage =
      remaining &&
      remaining.length > 0
        ? remaining[0]
            .image_url
        : null;


    await supabaseClient
      .from(
        "consultations"
      )
      .update({

        prescription_image_url:
          nextImage

      })
      .eq(
        "id",
        consultationId
      );

  }


  /*
     Delete storage file
  */

  const storagePath =
    getPrescriptionStoragePath(
      imageURL
    );


  if (storagePath) {

    await supabaseClient
      .storage
      .from(
        "prescriptions"
      )
      .remove([
        storagePath
      ]);

  }


  alert(
    "Prescription image deleted."
  );


  if (
    document
      .getElementById(
        "editConsultationView"
      )
      .classList
      .contains(
        "active"
      )
  ) {

    await openEditConsultation(
      consultationId
    );

  } else {

    await loadFullConsultation(
      consultationId
    );

  }

}


/* =========================================================
   LAB REPORT
   ========================================================= */

async function getLabReport(
  reportId
) {

  const {
    data,
    error
  } =
    await supabaseClient
      .from(
        "investigation_reports"
      )
      .select("*")
      .eq(
        "id",
        reportId
      )
      .single();


  if (
    error ||
    !data
  ) {

    alert(
      "Unable to load lab report."
    );

    return null;

  }


  return data;

}


async function getLabSignedURL(
  report
) {

  const {
    data,
    error
  } =
    await supabaseClient
      .storage
      .from(
        "investigation-reports"
      )
      .createSignedUrl(
        report.file_path,
        3600
      );


  if (
    error ||
    !data
  ) {

    alert(
      "Unable to open lab report."
    );

    return null;

  }


  return data.signedUrl;

}


async function viewLabReport(
  reportId
) {

  const report =
    await getLabReport(
      reportId
    );


  if (!report) {
    return;
  }


  const signedURL =
    await getLabSignedURL(
      report
    );


  if (!signedURL) {
    return;
  }


  const isPDF =
    report.file_type ===
      "application/pdf" ||
    (
      report.file_name ||
      ""
    )
    .toLowerCase()
    .endsWith(
      ".pdf"
    );


  if (isPDF) {

    openPDFModal(
      signedURL,
      report.report_type ||
      "Lab Report"
    );

  } else {

    openImageModal(
      signedURL,
      report.report_type ||
      "Lab Report"
    );

  }

}


/* =========================================================
   DELETE LAB REPORT
   ========================================================= */

async function deleteLabReport(
  reportId
) {

  const confirmed =
    confirm(
      "Delete this lab report permanently?"
    );


  if (!confirmed) {
    return;
  }


  const report =
    await getLabReport(
      reportId
    );


  if (!report) {
    return;
  }


  await supabaseClient
    .storage
    .from(
      "investigation-reports"
    )
    .remove([
      report.file_path
    ]);


  const {
    error
  } =
    await supabaseClient
      .from(
        "investigation_reports"
      )
      .delete()
      .eq(
        "id",
        reportId
      );


  if (error) {

    alert(
      "Unable to delete lab report:\n\n" +
      error.message
    );

    return;

  }


  alert(
    "Lab report deleted."
  );


  if (
    currentConsultationId
  ) {

    if (
      document
        .getElementById(
          "editConsultationView"
        )
        .classList
        .contains(
          "active"
        )
    ) {

      await openEditConsultation(
        currentConsultationId
      );

    } else {

      await loadFullConsultation(
        currentConsultationId
      );

    }

  }

}

/* =========================================================
   RETURN FROM BILLING
   ========================================================= */

async function handleURLParameters() {

  const params =
    new URLSearchParams(
      window.location.search
    );


  const view =
    params.get(
      "view"
    );


  const patientId =
    params.get(
      "patient_id"
    );


  const consultationId =
    params.get(
      "consultation_id"
    );


  if (
    view ===
      "consultation" &&
    patientId &&
    consultationId
  ) {

    await openSavedConsultation(
      Number(
        patientId
      ),
      Number(
        consultationId
      ),
      false
    );


    return true;

  }


  return false;

}
