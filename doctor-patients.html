<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

  <title>Patients | General & Diabetes Care</title>

  <link rel="stylesheet" href="styles.css">

</head>

<body>

  <section class="doctor-dashboard">

    <div class="dashboard-card">

      <p class="section-label">
        GENERAL &amp; DIABETES CARE
      </p>

      <h1>
        Patient Management
      </h1>

      <p class="dashboard-welcome">
        Manage patient records
      </p>

<div class="appointment-form">

  <h2>➕ Add New Patient</h2>

  <button
    type="button"
    class="doctor-login-button"
    id="addPatientButton">

    ➕ Register New Patient

  </button>

</div>
      <div
  id="patientFormContainer"
  class="appointment-form"
  style="display:none;">

  <h2>👤 New Patient Registration</h2>

  <input
    type="text"
    id="newPatientName"
    placeholder="Patient Name"
    required>

  <input
    type="tel"
    id="newPatientPhone"
    placeholder="Phone Number"
    required>

  <label>Date of Birth</label>

  <input
    type="date"
    id="newPatientDOB">

  <select id="newPatientGender">

    <option value="">
      Select Gender
    </option>

    <option value="Male">
      Male
    </option>

    <option value="Female">
      Female
    </option>

    <option value="Other">
      Other
    </option>

  </select>

  <input
    type="text"
    id="newPatientAddress"
    placeholder="Address">

  <input
    type="text"
    id="newPatientBloodGroup"
    placeholder="Blood Group">


  <h3>🩺 Current Visit</h3>

  <textarea
    id="newPatientChiefComplaints"
    placeholder="Present Symptoms / Chief Complaints"></textarea>

  <input
    type="text"
    id="newPatientPulse"
    placeholder="Pulse (bpm)">

  <input
    type="text"
    id="newPatientBP"
    placeholder="Blood Pressure (mmHg)">

  <input
    type="text"
    id="newPatientSpO2"
    placeholder="SpO₂ (%)">

  <input
    type="number"
    step="0.1"
    id="newPatientWeight"
    placeholder="Weight (kg)">

  <input
    type="number"
    step="0.1"
    id="newPatientHeight"
    placeholder="Height (cm)">


  <h3>📋 Medical History</h3>

  <textarea
    id="newPatientMedicalHistory"
    placeholder="Past Medical History"></textarea>

  <textarea
    id="newPatientSurgicalHistory"
    placeholder="Surgical History"></textarea>

  <textarea
    id="newPatientAllergies"
    placeholder="Allergy History"></textarea>

  <textarea
    id="newPatientCurrentMedication"
    placeholder="Current Medications"></textarea>


  <h3>🩺 Assessment & Treatment</h3>

  <textarea
    id="newPatientDiagnosis"
    placeholder="Diagnosis"></textarea>

  <textarea
    id="newPatientLabReports"
    placeholder="Lab Reports / Investigations"></textarea>

  <textarea
    id="newPatientTreatment"
    placeholder="Treatment / Prescription"></textarea>

  <textarea
    id="newPatientAdvice"
    placeholder="Advice"></textarea>

  <label>Follow-up Date</label>

  <input
    type="date"
    id="newPatientFollowUp">


  <button
    type="button"
    class="doctor-login-button"
    id="saveNewPatientButton">

    💾 Save Patient

  </button>

  <button
    type="button"
    class="doctor-login-button"
    id="cancelNewPatientButton">

    ↩️ Cancel

  </button>

      </div>
      <!-- Search Patients -->

      <div class="appointment-form">

        <h2>🔎 Search Patients</h2>

        <input
          type="text"
          id="patientSearch"
          placeholder="Search by Patient ID, Name or Phone Number">

        <button
          type="button"
          class="doctor-login-button"
          id="searchPatientButton">

          🔎 Search

        </button>

      </div>


      <!-- Patient Results -->

      <div class="appointments-list">

        <h2>👥 Patients</h2>

        <div id="patientsContainer">

          <p>
            Search for a patient to view records.
          </p>

        </div>

      </div>


      <br>


      <a
        href="doctor-dashboard.html"
        class="doctor-login-button">

        ← Back to Dashboard

      </a>


      <button
        type="button"
        class="doctor-login-button"
        id="patientsLogoutButton">

        🔒 Logout

      </button>

    </div>

  </section>


  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>

    const SUPABASE_URL =
      "https://twdmvdqqckcpwoccvtkj.supabase.co";

    const SUPABASE_PUBLISHABLE_KEY =
      "sb_publishable_qDvT0t7pC5l5kbKl9QirMg_JbBrvUyI";

    const supabaseClient =
      supabase.createClient(
        SUPABASE_URL,
        SUPABASE_PUBLISHABLE_KEY
      );


    async function checkDoctorLogin() {

      const { data: { session } } =
        await supabaseClient.auth.getSession();

      if (!session) {

        window.location.href =
          "doctor-login.html";

        return;

      }

    }


    checkDoctorLogin();


    document
      .getElementById("patientsLogoutButton")
      .addEventListener("click", async function () {

        await supabaseClient.auth.signOut();

        window.location.href =
          "doctor-login.html";

      });

document
  .getElementById("addPatientButton")
  .addEventListener("click", function () {

    document.getElementById(
      "patientFormContainer"
    ).style.display = "block";

    document.getElementById(
      "addPatientButton"
    ).style.display = "none";

  });


document
  .getElementById("cancelNewPatientButton")
  .addEventListener("click", function () {

    document.getElementById(
      "patientFormContainer"
    ).style.display = "none";

    document.getElementById(
      "addPatientButton"
    ).style.display = "block";

  });
    document
  .getElementById("saveNewPatientButton")
  .addEventListener("click", async function () {

    const patientName =
      document.getElementById("newPatientName").value.trim();

    const patientPhone =
      document.getElementById("newPatientPhone").value.trim();

    if (!patientName || !patientPhone) {

      alert(
        "Patient name and phone number are required."
      );

      return;

    }


    const newPatient = {

      patient_name:
        patientName,

      patient_phone:
        patientPhone,

      dob:
        document.getElementById("newPatientDOB").value || null,

      gender:
        document.getElementById("newPatientGender").value || null,

      address:
        document.getElementById("newPatientAddress").value.trim(),

      blood_group:
        document.getElementById("newPatientBloodGroup").value.trim(),

      chief_complaints:
        document.getElementById("newPatientChiefComplaints").value.trim(),

      pulse:
        document.getElementById("newPatientPulse").value.trim(),

      blood_pressure:
        document.getElementById("newPatientBP").value.trim(),

      spo2:
        document.getElementById("newPatientSpO2").value.trim(),

      weight:
        document.getElementById("newPatientWeight").value || null,

      height:
        document.getElementById("newPatientHeight").value || null,

      medical_history:
        document.getElementById("newPatientMedicalHistory").value.trim(),

      surgical_history:
        document.getElementById("newPatientSurgicalHistory").value.trim(),

      allergies:
        document.getElementById("newPatientAllergies").value.trim(),

      current_medication:
        document.getElementById("newPatientCurrentMedication").value.trim(),

      diagnosis:
        document.getElementById("newPatientDiagnosis").value.trim(),

      lab_reports:
        document.getElementById("newPatientLabReports").value.trim(),

      treatment:
        document.getElementById("newPatientTreatment").value.trim(),

      advice:
        document.getElementById("newPatientAdvice").value.trim(),

      follow_up_date:
        document.getElementById("newPatientFollowUp").value || null

    };


    const {
      data,
      error
    } =
      await supabaseClient
        .from("patients")
        .insert([newPatient])
        .select()
        .single();


    if (error) {

      console.error(
        "Error saving patient:",
        error
      );

      alert(
        "Unable to save patient: " +
        error.message
      );

      return;

    }


    


    alert(
  "Patient registered successfully."
);

console.log(
  "New patient:",
  data
);

document
  .getElementById("patientFormContainer")
  .style.display = "none";

document
  .getElementById("addPatientButton")
  .style.display = "block";

  });
  </script>

</body>

</html>
