   async function searchPatients() {

  const search =
    document
      .getElementById("patientSearch")
      .value
      .trim();

  const container =
    document.getElementById("patientsContainer");


  if (!search) {

    container.innerHTML =
      "<p>Please enter Patient ID, name or phone number.</p>";

    return;
  }


  let query =
    supabaseClient
      .from("patients")
      .select("*");


  // If search is a number, search Patient ID,
  // phone number, and name
  if (/^\d+$/.test(search)) {

    query = query.or(
      `patient_phone.ilike.%${search}%,patient_name.ilike.%${search}%,id.eq.${search}`
    );

  } else {

    // For text, search only name and phone
    query = query.or(
      `patient_name.ilike.%${search}%,patient_phone.ilike.%${search}%`
    );

  }


  const { data, error } =
    await query.order(
      "patient_name",
      {
        ascending: true
      }
    );


  if (error) {

    console.error(
      "Patient search error:",
      error
    );

    container.innerHTML =
      "<p>Unable to search patients.</p>";

    return;
  }


  if (!data || data.length === 0) {

    container.innerHTML =
      "<p>No patients found.</p>";

    return;
  }


  container.innerHTML = "";


  data.forEach(function (patient) {

    const card =
      document.createElement("div");

    card.className =
      "appointment-card";


    card.innerHTML = `

      <strong>
        👤 ${patient.patient_name || "-"}
      </strong>

      <span>
        🆔 Patient ID: ${patient.id}
      </span>

      <span>
        📞 ${patient.patient_phone || "-"}
      </span>

      <span>
        🎂 ${patient.date_of_birth || "-"}
      </span>

      <span>
        ⚧ ${patient.gender || "-"}
      </span>

    `;


    const viewButton =
      document.createElement("button");

    viewButton.type =
      "button";

    viewButton.className =
      "doctor-login-button";

    viewButton.textContent =
      "👁️ View Patient";


    viewButton.onclick =
      function () {

        viewPatient(patient.id);

      };


    card.appendChild(
      viewButton
    );


    container.appendChild(
      card
    );

  });

   }

      async function savePatientChanges(patientId) {

  const updatedPatient = {

    patient_name:
      document.getElementById("editPatientName").value.trim(),

    patient_phone:
      document.getElementById("editPatientPhone").value.trim(),

    date_of_birth:
      document.getElementById("editPatientDOB").value || null,

    gender:
      document.getElementById("editPatientGender").value || null,

    address:
      document.getElementById("editPatientAddress").value.trim(),

    blood_group:
      document.getElementById("editPatientBloodGroup").value.trim(),

    chief_complaints:
      document.getElementById("editPatientChiefComplaints").value.trim(),

    Pulse:
      document.getElementById("editPatientPulse").value.trim(),

    blood_pressure:
      document.getElementById("editPatientBP").value.trim(),

    spo2:
      document.getElementById("editPatientSpO2").value.trim(),

    weight:
      document.getElementById("editPatientWeight").value || null,

    height:
      document.getElementById("editPatientHeight").value || null,

    medical_history:
      document.getElementById("editPatientMedicalHistory").value.trim(),

    surgical_history:
      document.getElementById("editPatientSurgicalHistory").value.trim(),

    allergies:
      document.getElementById("editPatientAllergies").value.trim(),

    current_medications:
      document.getElementById("editPatientMedications").value.trim(),

    diagnosis:
      document.getElementById("editPatientDiagnosis").value.trim(),

    lab_reports:
      document.getElementById("editPatientLabReports").value.trim(),

    treatment:
      document.getElementById("editPatientTreatment").value.trim(),

    advice:
      document.getElementById("editPatientAdvice").value.trim(),

    follow_up_date:
      document.getElementById("editPatientFollowUp").value || null

  };


  const { data, error } =
    await supabaseClient
      .from("patients")
      .update(updatedPatient)
      .eq("id", patientId)
      .select()
      .single();


  if (error) {

    console.error(
      "Error updating patient:",
      error
    );

    alert(
      "Unable to save changes: " +
      error.message
    );

    return;
  }


  alert(
    "Patient details updated successfully."
  );


  viewPatient(patientId);

      }
  document
    .getElementById(
      "backToPatientSearchButton"
    )
    .onclick = function () {

      location.reload();

    };

      }
    document
  .getElementById("searchPatientButton")
  .addEventListener(
    "click",
    searchPatients
  );
  </script>
