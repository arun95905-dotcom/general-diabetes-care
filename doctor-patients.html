<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Patients | General & Diabetes Care</title>
<link rel="stylesheet" href="styles.css">

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
}

.doctor-dashboard{
  min-height:100vh;
  padding:18px 10px 50px;
}

.dashboard-card{
  width:100%;
  max-width:1050px;
  margin:auto;
}

.section-label{
  font-size:12px;
  font-weight:800;
  letter-spacing:1.4px;
  margin:4px 0;
}

h1{
  margin:0;
  font-size:27px;
}

.welcome{
  margin:5px 0 18px;
  opacity:.65;
}

.panel{
  background:#fff;
  border:1px solid #e5e7eb;
  border-radius:18px;
  padding:16px;
  margin:14px 0;
  box-shadow:0 5px 18px rgba(15,23,42,.06);
}

.main-actions{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:12px;
}

.main-action{
  border:1px solid #e2e8f0;
  background:#f8fafc;
  border-radius:16px;
  padding:18px;
  text-align:left;
  cursor:pointer;
  min-height:105px;
}

.main-action:hover{
  transform:translateY(-1px);
  box-shadow:0 6px 18px rgba(15,23,42,.08);
}

.main-action .icon{
  font-size:28px;
  margin-bottom:8px;
}

.main-action strong{
  display:block;
  font-size:16px;
}

.main-action span{
  display:block;
  margin-top:5px;
  font-size:13px;
  opacity:.62;
}

.today-button{
  width:100%;
  border:1px solid #dbeafe;
  background:linear-gradient(135deg,#eff6ff,#f8fafc);
  border-radius:16px;
  padding:17px;
  text-align:left;
  cursor:pointer;
}

.today-button-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
}

.today-button-title{
  font-weight:800;
  font-size:17px;
}

.count{
  background:#2563eb;
  color:#fff;
  border-radius:999px;
  padding:5px 11px;
  font-weight:800;
  font-size:13px;
}

.today-note{
  font-size:13px;
  color:#64748b;
  margin-top:5px;
}

.section-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
}

.section-head h2{
  margin:0;
  font-size:19px;
}

.search-box{
  display:flex;
  gap:9px;
  margin-top:12px;
}

.search-box input{
  flex:1;
}

input,
select,
textarea{
  width:100%;
  border:1px solid #cbd5e1;
  border-radius:11px;
  padding:11px 12px;
  font:inherit;
  background:#fff;
  outline:none;
}

input:focus,
select:focus,
textarea:focus{
  border-color:#2563eb;
  box-shadow:0 0 0 3px rgba(37,99,235,.08);
}

textarea{
  min-height:95px;
  resize:vertical;
}

.form-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:12px;
}

.one{
  grid-template-columns:1fr;
}

.full{
  grid-column:1/-1;
}

label{
  display:block;
  font-size:13px;
  font-weight:750;
  margin-bottom:6px;
}

.form-section{
  background:#f8fafc;
  border:1px solid #e5e7eb;
  border-radius:14px;
  padding:14px;
  margin:12px 0;
}

.form-section h3{
  margin:0 0 12px;
  font-size:16px;
}

.btn{
  border:0;
  border-radius:11px;
  padding:10px 14px;
  min-height:42px;
  font-size:14px;
  font-weight:750;
  cursor:pointer;
}

.btn-primary{
  background:#2563eb;
  color:#fff;
}

.btn-success{
  background:#16a34a;
  color:#fff;
}

.btn-purple{
  background:#7c3aed;
  color:#fff;
}

.btn-warning{
  background:#f59e0b;
  color:#fff;
}

.btn-danger{
  background:#dc2626;
  color:#fff;
}

.btn-secondary{
  background:#64748b;
  color:#fff;
}

.btn-light{
  background:#f1f5f9;
  color:#0f172a;
  border:1px solid #dbe2ea;
}

.btn-small{
  min-height:37px;
  padding:8px 11px;
  font-size:13px;
}

.actions{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  margin-top:12px;
}

.results{
  margin-top:14px;
}

.patient-card,
.consult-card,
.file-card{
  border:1px solid #e2e8f0;
  border-radius:15px;
  padding:14px;
  margin:10px 0;
  background:#fff;
}

.patient-name{
  font-size:17px;
  font-weight:800;
}

.meta{
  font-size:13px;
  color:#64748b;
  line-height:1.7;
  margin-top:4px;
}

.profile-header{
  background:linear-gradient(135deg,#eff6ff,#f8fafc);
  border:1px solid #dbeafe;
  border-radius:16px;
  padding:16px;
}

.profile-name{
  font-size:23px;
  font-weight:850;
}

.profile-id{
  font-size:13px;
  color:#475569;
  margin-top:4px;
}

.profile-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:10px;
  margin-top:12px;
}

.profile-item{
  border:1px solid #e2e8f0;
  border-radius:11px;
  padding:11px;
  background:#fff;
}

.profile-label{
  display:block;
  font-size:11px;
  text-transform:uppercase;
  font-weight:800;
  color:#64748b;
  margin-bottom:4px;
}

.profile-value{
  white-space:pre-wrap;
}

.detail{
  background:#f8fafc;
  border:1px solid #e5e7eb;
  border-radius:13px;
  padding:13px;
  margin:11px 0;
}

.detail h3,
.detail h4{
  margin:0 0 8px;
}

.pre{
  white-space:pre-wrap;
  line-height:1.55;
  font-size:14px;
}

.consult-top{
  display:flex;
  justify-content:space-between;
  gap:10px;
  align-items:flex-start;
}

.consult-date{
  font-weight:800;
}

.consult-summary{
  font-size:14px;
  color:#475569;
  margin-top:7px;
}

.consult-details{
  display:none;
  border-top:1px solid #e2e8f0;
  margin-top:12px;
  padding-top:10px;
}

.file-preview{
  display:none;
  margin-top:9px;
}

.file-preview img{
  width:100%;
  max-width:560px;
  max-height:650px;
  object-fit:contain;
  border:1px solid #dbe4ec;
  border-radius:10px;
}

.file-title{
  font-weight:800;
  font-size:14px;
}

.file-meta{
  font-size:12px;
  color:#64748b;
  margin-top:4px;
}

.upload-box{
  border:1px dashed #94a3b8;
  background:#f8fafc;
  border-radius:13px;
  padding:13px;
}

.note{
  font-size:12px;
  color:#64748b;
  margin-top:6px;
}

.empty,
.loading{
  text-align:center;
  padding:18px;
  color:#64748b;
  background:#f8fafc;
  border-radius:12px;
}

.hidden{
  display:none!important;
}

.modal{
  position:fixed;
  inset:0;
  background:rgba(15,23,42,.72);
  z-index:9999;
  display:none;
  align-items:center;
  justify-content:center;
  padding:12px;
}

.modal-box{
  background:#fff;
  border-radius:16px;
  width:100%;
  max-width:900px;
  max-height:92vh;
  overflow:auto;
  padding:14px;
}

.modal-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:10px;
}

.modal-box img{
  width:100%;
  max-height:80vh;
  object-fit:contain;
}

@media(max-width:700px){

  .main-actions,
  .form-grid,
  .profile-grid{
    grid-template-columns:1fr;
  }

  .full{
    grid-column:auto;
  }

  .search-box{
    flex-direction:column;
  }

  .consult-top{
    flex-direction:column;
  }

  .btn{
    min-height:44px;
  }

  .panel{
    padding:13px;
  }
}
</style>
</head>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
"https://twdmvdqqckcpwoccvtkj.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
"sb_publishable_qDvT0t7pC5l5kbKl9QirMg_JbBrvUyI";

const supabaseClient =
supabase.createClient(
SUPABASE_URL,
SUPABASE_PUBLISHABLE_KEY
);


let currentPatient = null;


const $ = id =>
document.getElementById(id);


const esc = value =>
value == null
? ""
: String(value)
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");


const dateTime = value =>
value
? new Date(value).toLocaleString("en-IN")
: "-";


const dateOnly = value =>
value
? new Date(value).toLocaleDateString("en-IN")
: "-";


function todayString(){

const d = new Date();

return d.getFullYear()
+"-"
+String(d.getMonth()+1).padStart(2,"0")
+"-"
+String(d.getDate()).padStart(2,"0");

}


function hidePanel(id){

$(id)?.classList.add("hidden");

}


function showPanel(id){

$(id)?.classList.remove("hidden");

}


function clearResults(){

$("mainResults").innerHTML = "";

$("mainResults")
.classList.add("hidden");

$("searchResults").innerHTML = "";

$("searchResults")
.classList.add("hidden");

}


async function checkLogin(){

const {
data:{
session
}
} =
await supabaseClient.auth.getSession();

if(!session){

location.href =
"doctor-login.html";

return false;

}

return true;

}


async function logoutDoctor(){

await supabaseClient.auth.signOut();

location.href =
"doctor-login.html";

}


function openSearch(){

showPanel("searchSection");

hidePanel("patientFormContainer");

$("patientSearch").focus();

$("searchSection").scrollIntoView({
behavior:"smooth",
block:"start"
});

}


function openRegistration(){

showPanel("patientFormContainer");

hidePanel("searchSection");

$("patientFormContainer").scrollIntoView({
behavior:"smooth",
block:"start"
});

}


/* =========================
   REGISTER PATIENT
========================= */

async function saveNewPatient(){

const patient = {

patient_name:
$("newPatientName").value.trim(),

patient_phone:
$("newPatientPhone").value.trim(),

date_of_birth:
$("newPatientDOB").value || null,

gender:
$("newPatientGender").value || null,

blood_group:
$("newPatientBloodGroup").value.trim(),

address:
$("newPatientAddress").value.trim(),

medical_history:
$("newPatientMedicalHistory").value.trim(),

surgical_history:
$("newPatientSurgicalHistory").value.trim(),

allergies:
$("newPatientAllergies").value.trim(),

current_medications:
$("newPatientCurrentMedication").value.trim()

};


if(
!patient.patient_name ||
!patient.patient_phone
){

alert(
"Patient name and phone number are required."
);

return;

}


const {
data,
error
} =
await supabaseClient
.from("patients")
.insert(patient)
.select()
.single();


if(error){

alert(
"Unable to register patient:\n\n"
+ error.message
);

return;

}


hidePanel("patientFormContainer");


$("newPatientActions")
.classList.remove("hidden");


$("newPatientActions").innerHTML = `

<div class="profile-header">

<div class="profile-name">
✅ Patient Registered Successfully
</div>

<div class="profile-id">

Patient:
<strong>
${esc(data.patient_name)}
</strong>

<br>

Patient ID:
<strong>
${esc(data.id)}
</strong>

<br>

Phone:
<strong>
${esc(data.patient_phone)}
</strong>

</div>

</div>


<div class="actions">

<button
class="btn btn-primary"
onclick="startConsultation(${Number(data.id)})"
>
🩺 New Consultation
</button>


<button
class="btn btn-success"
onclick="openBilling(${Number(data.id)})"
>
💰 Create Bill
</button>


<button
class="btn btn-purple"
onclick="uploadPrescriptionForPatient(${Number(data.id)})"
>
📷 Upload Prescription
</button>


<button
class="btn btn-primary"
onclick="uploadLabForPatient(${Number(data.id)})"
>
🧪 Upload Lab Report
</button>


<button
class="btn btn-warning"
onclick="editPatient(${Number(data.id)})"
>
✏️ Edit Patient
</button>

</div>

`;


await loadTodayCount();

}


/* =========================
   TODAY PATIENTS
========================= */

async function loadTodayCount(){

const start =
todayString()+"T00:00:00";

const end =
todayString()+"T23:59:59";


const {
data,
error
} =
await supabaseClient
.from("patients")
.select("id")
.gte("created_at",start)
.lte("created_at",end);


$("todayCount").textContent =
error
? "-"
: (data?.length || 0);

}


async function toggleTodayPatients(){

const c =
$("todayPatientsContainer");


if(
!c.classList.contains("hidden")
){

c.classList.add("hidden");

return;

}


c.classList.remove("hidden");

c.innerHTML = `
<div class="loading">
Loading today's patients...
</div>
`;


const start =
todayString()+"T00:00:00";

const end =
todayString()+"T23:59:59";


const {
data,
error
} =
await supabaseClient
.from("patients")
.select("*")
.gte("created_at",start)
.lte("created_at",end)
.order("created_at",{ascending:false});


if(error){

c.innerHTML = `
<div class="empty">
Unable to load today's patients.
</div>
`;

return;

}


if(!data?.length){

c.innerHTML = `
<div class="empty">
No patients registered today.
</div>
`;

return;

}


c.innerHTML =
data.map(p => `

<div class="patient-card">

<div class="patient-name">
👤 ${esc(p.patient_name)}
</div>

<div class="meta">

🆔 Patient ID:
${esc(p.id)}

<br>

📞
${esc(p.patient_phone || "-")}

<br>

🕒
${dateTime(p.created_at)}

</div>


<div class="actions">

<button
class="btn btn-primary btn-small"
onclick="viewPatient(${Number(p.id)})"
>
👁️ View
</button>


<button
class="btn btn-light btn-small"
onclick="startConsultation(${Number(p.id)})"
>
🩺 Consultation
</button>

</div>

</div>

`).join("");

}


/* =========================
   SEARCH PATIENTS
========================= */

async function searchPatients(){

const q =
$("patientSearch").value.trim();

const box =
$("searchResults");


box.classList.remove("hidden");


if(!q){

box.innerHTML = `
<div class="empty">
Enter Patient ID, name or phone number.
</div>
`;

return;

}


box.innerHTML = `
<div class="loading">
🔎 Searching...
</div>
`;


let query =
supabaseClient
.from("patients")
.select("*");


if(/^\d+$/.test(q)){

query =
query.or(
`id.eq.${q},patient_phone.ilike.%${q}%,patient_name.ilike.%${q}%`
);

}
else{

query =
query.or(
`patient_name.ilike.%${q}%,patient_phone.ilike.%${q}%`
);

}


const {
data,
error
} =
await query
.order(
"patient_name",
{
ascending:true
}
);


if(error){

box.innerHTML = `
<div class="empty">
Unable to search patients.
</div>
`;

return;

}


if(!data?.length){

box.innerHTML = `
<div class="empty">
No patients found.
</div>
`;

return;

}


box.innerHTML =
data.map(p => `

<div class="patient-card">

<div class="patient-name">
👤 ${esc(p.patient_name)}
</div>


<div class="meta">

🆔 Patient ID:
${esc(p.id)}

<br>

📞
${esc(p.patient_phone || "-")}

<br>

🎂
${esc(p.date_of_birth || "-")}

&nbsp;

⚧
${esc(p.gender || "-")}

</div>


<div class="actions">

<button
class="btn btn-primary btn-small"
onclick="viewPatient(${Number(p.id)})"
>
👁️ View Patient
</button>


<button
class="btn btn-warning btn-small"
onclick="editPatient(${Number(p.id)})"
>
✏️ Edit
</button>

</div>

</div>

`).join("");

}


/* =========================
   GET PATIENT
========================= */

async function getPatient(id){

const {
data,
error
} =
await supabaseClient
.from("patients")
.select("*")
.eq("id",id)
.single();


if(error){

alert(
"Unable to load patient."
);

return null;

}


return data;

async function uploadPrescriptionForPatient(
patientId
){

const {
data:latest
} =
await supabaseClient
.from("consultations")
.select("id")
.eq("patient_id",patientId)
.order(
"created_at",
{
ascending:false
}
)
.limit(1)
.maybeSingle();


if(!latest){

alert(
"Please create a consultation first so the prescription can be linked to a visit."
);

return;

}


uploadPrescriptionForConsultation(
latest.id,
patientId
);

}


function uploadPrescriptionForConsultation(
consultationId,
patientId
){

const input =
document.createElement("input");


input.type =
"file";

input.accept =
"image/jpeg,image/png,image/webp";

input.multiple =
true;


input.onchange =
async () => {

const files =
[...input.files];


for(
let i=0;
i<files.length;
i++
){

const f =
files[i];


const safe =
f.name.replace(
/[^a-zA-Z0-9._-]/g,
"_"
);


const path =
`patient-${patientId}/${consultationId}/${Date.now()}-${i}-${safe}`;


const up =
await supabaseClient
.storage
.from("prescriptions")
.upload(
path,
f,
{
upsert:false,
contentType:f.type
}
);


if(up.error){

alert(
up.error.message
);

continue;

}


const url =
supabaseClient
.storage
.from("prescriptions")
.getPublicUrl(path)
.data
.publicUrl;


const {
error
} =
await supabaseClient
.from("consultation_images")
.insert({

consultation_id:
consultationId,

image_url:
url,

patient_id:
patientId

});


if(error){

alert(
error.message
);

}

}


alert(
"Prescription image(s) uploaded."
);


viewPatient(patientId);

};


input.click();

}

async function uploadLabForPatient(
patientId
){

const {

} =

function uploadLabForConsultation(
consultationId,
patientId
){

const input =
document.createElement("input");


input.type =
"file";

input.accept =
"image/jpeg,image/png,image/webp,application/pdf";

input.multiple =
true;


input.onchange =
async () => {

const files =
[...input.files];


const type =
prompt(
"Enter lab report type:",
"Laboratory Report"
);


if(!type)
return;


let ok = 0;


for(
let i=0;
i<files.length;
i++
){

const f =
files[i];


if(
f.size >
20 * 1024 * 1024
){

continue;

}


const safe =
f.name.replace(
/[^a-zA-Z0-9._-]/g,
"_"
);


const path =
`patient-${patientId}/${todayString()}/${consultationId}-${Date.now()}-${i}-${safe}`;


const up =
await supabaseClient
.storage
.from("investigation-reports")
.upload(
path,
f,
{
upsert:false,
contentType:f.type
}
);


if(up.error){

alert(
up.error.message
);

continue;

}


const {
error
} =
await supabaseClient
.from("investigation_reports")
.insert({

patient_id:
patientId,

consultation_id:
consultationId,

report_date:
todayString(),

report_type:
type,

file_name:
f.name,

file_path:
path,

file_type:
f.type,

file_size:
f.size

});


if(error){

await supabaseClient
.storage
.from("investigation-reports")
.remove([path]);


alert(
"Lab report database error:\n\n"
+ error.message
);

continue;

}


ok++;

}


alert(
ok +
" lab report(s) uploaded successfully."
);


viewPatient(patientId);

};


input.click();

}

/* =========================
   SAVE LAB FILES
========================= */

async function uploadSelectedLabFiles(
cid,
pid,
list,
type
){

for(
let i=0;
i<list.length;
i++
){

const f =
list[i];


if(
f.size >
20*1024*1024
){

continue;

}


const safe =
f.name.replace(
/[^a-zA-Z0-9._-]/g,
"_"
);


const path =
`patient-${pid}/${todayString()}/${cid}-${Date.now()}-${i}-${safe}`;


const up =
await supabaseClient
.storage
.from("investigation-reports")
.upload(
path,
f,
{
upsert:false,
contentType:f.type
}
);


if(up.error)
continue;


const {
error
} =
await supabaseClient
.from("investigation_reports")
.insert({

patient_id:
pid,

consultation_id:
cid,

report_date:
todayString(),

report_type:
type,

file_name:
f.name,

file_path:
path,

file_type:
f.type,

file_size:
f.size

});


if(error){

await supabaseClient
.storage
.from("investigation-reports")
.remove(
[path]
);

}

}

}

/* =========================
   STORAGE PATH
========================= */

function getStoragePath(
url,
bucket
){

try{

const u =
new URL(url);


const marker =
"/storage/v1/object/public/"
+
bucket
+
"/";


const i =
u.pathname.indexOf(marker);


if(i < 0)
return null;


return decodeURIComponent(
u.pathname.slice(
i + marker.length
)
);

}
catch{

return null;

}

}

========================= */

function downloadFile(
encoded,
name
){

const a =
document.createElement("a");


a.href =
decodeURIComponent(encoded);


a.download =
name;


a.target =
"_blank";


document.body.appendChild(a);

a.click();

a.remove();

}
