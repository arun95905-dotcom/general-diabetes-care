/* =========================================================
   BASIC HELPERS
   ========================================================= */

function escapeHTML(value) {

  if (value === null || value === undefined) {
    return "";
  }

  return String(value)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}


function formatDate(dateValue) {

  if (!dateValue) {
    return "-";
  }

  const date = new Date(dateValue);

  if (Number.isNaN(date.getTime())) {
    return escapeHTML(dateValue);
  }

  return date.toLocaleDateString("en-IN");
}


function formatDateTime(dateValue) {

  if (!dateValue) {
    return "-";
  }

  const date = new Date(dateValue);

  if (Number.isNaN(date.getTime())) {
    return escapeHTML(dateValue);
  }

  return date.toLocaleString("en-IN");
}


function getStoragePathFromUrl(imageUrl) {

  if (!imageUrl) {
    return null;
  }

  try {

    const url = new URL(imageUrl);

    const marker =
      "/storage/v1/object/public/prescriptions/";

    const index =
      url.pathname.indexOf(marker);

    if (index === -1) {
      return null;
    }

    return decodeURIComponent(
      url.pathname.substring(
        index + marker.length
      )
    );

  } catch (error) {

    console.warn(
      "Unable to determine storage path:",
      error
    );

    return null;
  }
}


async function deleteStorageFile(imageUrl) {

  const storagePath =
    getStoragePathFromUrl(imageUrl);

  if (!storagePath) {
    return;
  }

  const {
    error
  } =
    await supabaseClient
      .storage
      .from("prescriptions")
      .remove([storagePath]);

  if (error) {

    console.warn(
      "Storage file could not be deleted:",
      error
    );

  }
}
async function downloadPrescriptionImage(
  imageUrl,
  imageNumber
) {

  try {

    const response =
      await fetch(imageUrl);

    if (!response.ok) {

      throw new Error(
        "Unable to download image."
      );
    }


    const blob =
      await response.blob();


    const blobUrl =
      URL.createObjectURL(blob);


    const link =
      document.createElement("a");


    link.href =
      blobUrl;


    link.download =
      "Prescription_Image_" +
      imageNumber +
      "_" +
      Date.now() +
      ".jpg";


    document.body.appendChild(
      link
    );


    link.click();


    document.body.removeChild(
      link
    );


    URL.revokeObjectURL(
      blobUrl
    );

  } catch (error) {

    console.error(
      "Prescription image download error:",
      error
    );


    window.open(
      imageUrl,
      "_blank"
    );

  }
}

/* =========================================================

async function searchPatients() {

  const search =
    document
      .getElementById("patientSearch")
      .value
      .trim();

  const container =
    document.getElementById(
      "patientsContainer"
    );


  if (!search) {

    container.innerHTML =
      "<p>Please enter Patient ID, name or phone number.</p>";

    return;
  }


  let query =
    supabaseClient
      .from("patients")
      .select("*");


  if (/^\d+$/.test(search)) {

    query =
      query.or(
        `patient_phone.ilike.%${search}%,patient_name.ilike.%${search}%,id.eq.${search}`
      );

  } else {

    query =
      query.or(
        `patient_name.ilike.%${search}%,patient_phone.ilike.%${search}%`
      );
  }


  const {
    data,
    error
  } =
    await query
      .order(
        "patient_name",
        {
          ascending: true
        }
      );


  if (error) {

    console.error(
      "Patient search error:",
      error
    );

    container.innerHTML =
      "<p>Unable to search patients.</p>";

    return;
  }


  if (!data || data.length === 0) {

    container.innerHTML =
      "<p>No patients found.</p>";

    return;
  }


  container.innerHTML = "";


  data.forEach(function (patient) {

    const card =
      document.createElement("div");

    card.className =
      "appointment-card";


    card.innerHTML = `

      <strong>
        👤 ${escapeHTML(patient.patient_name || "-")}
      </strong>

      <span>
        🆔 Patient ID: ${escapeHTML(patient.id)}

        📞 ${escapeHTML(patient.patient_phone || "-")}

      <span>
        🎂 ${escapeHTML(patient.date_of_birth || "-")}
      </span>

      <span>
        ⚧ ${escapeHTML(patient.gender || "-")}
      </span>

    `;


    const viewButton =
      document.createElement("button");

    viewButton.type =
      "button";

    viewButton.className =
      "doctor-login-button";

    viewButton.textContent =
      "👁️ View Patient";

    viewButton.onclick =
      function () {

        viewPatient(patient.id);

      };


    card.appendChild(
      viewButton
    );

    container.appendChild(
      card
    );

  });
}


/* =========================================================
   LOAD PATIENT
   ========================================================= */

async function getPatient(patientId) {

  const {
    data,
    error
  } =
    await supabaseClient
      .from("patients")
      .select("*")
      .eq("id", patientId)
      .single();


  if (error) {

    console.error(
      "Patient loading error:",
      error
    );

    return null;
  }

  return data;
}


/* =========================================================
   LOAD CONSULTATIONS
   ========================================================= */

async function getConsultations(patientId) {

  const {
    data,
    error
  } =
    await supabaseClient
      .from("consultations")
      .select("*")
      .eq("patient_id", patientId)
      .order(
        "created_at",
        {
          ascending: false
        }
      );


  if (error) {

    console.error(
      "Consultation loading error:",
      error
    );

    return [];
  }


  return data || [];
}


/* =========================================================
   LOAD CONSULTATION IMAGES
   ========================================================= */

async function getConsultationImages(
  consultationIds
) {

  if (
    !consultationIds ||
    consultationIds.length === 0
  ) {

    return [];
  }


  const {
    data,
    error
  } =
    await supabaseClient
      .from("consultation_images")
      .select("*")
      .in(
        "consultation_id",
        consultationIds
      );


  if (error) {

    console.error(
      "Consultation image loading error:",
      error
    );

    return [];
  }


  return data || [];
}

/* =========================================================
   GET ALL IMAGES FOR ONE CONSULTATION
   ========================================================= */

function getImagesForConsultation(
  consultation,
  consultationImages
) {

  const images = [];

  const mainUrl =
    consultation.prescription_image_url;


  /*
     First load images from consultation_images.
     These records have real database IDs.
  */

  consultationImages
    .filter(function (image) {

      return String(
        image.consultation_id
      ) === String(
        consultation.id
      );

    })
    .forEach(function (image) {

      images.push({

        id:
          image.id,

        image_url:
          image.image_url,

        isMain:
          mainUrl &&
          image.image_url === mainUrl

      });

    });


  /*
     Legacy compatibility:
     If prescription_image_url exists but
     there is no matching consultation_images
     record, display it as a legacy image.
  */

  if (
    mainUrl &&
    !images.some(function (image) {

      return image.image_url === mainUrl;

    })
  ) {

    images.unshift({

      id: null,

      image_url:
        mainUrl,

      isMain: true

    });

  }


  return images;
}

   RENDER PRESCRIPTION IMAGES

function renderPrescriptionImages(

  const imageHTML =
    images.map(function (image, index) {

      return `

        <div
          style="
            margin-bottom:20px;
            padding:10px;
            border:1px solid #ddd;
            border-radius:10px;
          "
        >

          <p>
            <strong>
              📷 Prescription Image ${index + 1}
            </strong>
          </p>


          <img
            src="${escapeHTML(image.image_url)}"
            alt="Prescription Image ${index + 1}"
            style="
              max-width:100%;

              border-radius:10px;
              border:1px solid #ddd;
              display:block;
            "
          >


          <br>

            onclick="downloadPrescriptionImage(
              '${escapeHTML(image.image_url)}',

            )"
          >

          <button

            onclick="deleteConsultationImage(

              '${escapeHTML(image.image_url)}',
              ${image.isMain ? "true" : "false"}
            )"
          >
            🗑️ Delete This Image
          </button>

        </div>

      `;

    }).join("");


  return `

    <div>

      <p>
        <strong>
          📷 Prescription Images
        </strong>
      </p>

      ${imageHTML}

    </div>

  `;
}

/* =========================================================
   UPLOAD PRESCRIPTION IMAGES 
   ========================================================= */

async function uploadPrescriptionImages(
  patientId,
  consultationId,
  files
) {

  const uploadedImages = [];


  for (
    let i = 0;
    i < files.length;
    i++
  ) {

    const imageFile =
      files[i];


    if (
      !imageFile.type.startsWith(
        "image/"
      )
    ) {

      continue;
    }


    const originalName =
      imageFile.name;


    const extension =
      originalName
        .split(".")
        .pop()
        .toLowerCase();


    const uniqueName =
      patientId +
      "_" +
      consultationId +
      "_" +
      Date.now() +
      "_" +
      Math.random()
        .toString(36)
        .substring(2, 8) +
      "_" +
      i +
      "." +
      extension;


    const filePath =
      "patient-" +
      patientId +
      "/" +
      uniqueName;


    const {
      error: uploadError
    } =
      await supabaseClient
        .storage
        .from("prescriptions")
        .upload(
          filePath,
          imageFile,
          {
            upsert: false
          }
        );


    if (uploadError) {

      console.error(
        "Prescription upload error:",
        uploadError
      );

      throw new Error(
        "Unable to upload " +
        originalName +
        ": " +
        uploadError.message
      );
    }


    const {
      data: publicUrlData
    } =
      supabaseClient
        .storage
        .from("prescriptions")
        .getPublicUrl(
          filePath
        );
uploadedImages.push({

      image_url:
        publicUrlData.publicUrl,

      file_path:
        filePath

    });

  }


  return uploadedImages;
}

async function saveConsultation(
  patientId
) {

  const imageInput =
    document.getElementById(
      "consultPrescriptionImages"
    );


  const files =
    imageInput
      ? Array.from(
          imageInput.files || []
        )
      : [];


  const consultation = {

    patient_id:
      patientId,

    chief_complaints:
      document
        .getElementById(
          "consultChiefComplaints"
        )
        .value
        .trim(),

    vitals:
      document
        .getElementById(
          "consultVitals"
        )
        .value
        .trim(),

    examination:
      document
        .getElementById(
          "consultExamination"
        )
        .value
        .trim(),

    diagnosis:
      document
        .getElementById(
          "consultDiagnosis"
        )
        .value
        .trim(),

    investigations:
      document
        .getElementById(
          "consultInvestigations"
        )
        .value
        .trim(),

    prescription:
      document
        .getElementById(
          "consultPrescription"
        )
        .value
        .trim(),

    advice:
      document
        .getElementById(
          "consultAdvice"
        )
        .value
        .trim(),

    follow_up_date:
      document
        .getElementById(
          "consultFollowUpDate"
        )
        .value ||
      null,

    prescription_image_url:
      null
  };


  const {
    data,
    error
  } =
    await supabaseClient
      .from("consultations")
      .insert([
        consultation
      ])
      .select()
      .single();


  if (error) {

    console.error(
      "Consultation save error:",
      error
    );

    alert(
      "Unable to save consultation: " +
      error.message
    );

    return;
  }


  let uploadedImages = [];


  try {

    uploadedImages =
      await uploadPrescriptionImages(
        patientId,
        data.id,
        files
      );

  } catch (uploadError) {

    console.error(
      uploadError
    );

    alert(
      "Consultation was saved, but prescription image upload failed:\n\n" +
      uploadError.message
    );

    viewPatient(patientId);

    return;
  }


  if (
    uploadedImages.length > 0
  ) {

    const firstImage =
      uploadedImages[0]
        .image_url;


    const {
      error:
        consultationUpdateError
    } =
      await supabaseClient
        .from("consultations")
        .update({

          prescription_image_url:
            firstImage

        })
        .eq(
          "id",
          data.id
        );


    if (
      consultationUpdateError
    ) {

      console.error(
        consultationUpdateError
      );

      alert(
        "Consultation saved, but the main prescription image could not be linked."
      );
    }


    const imageRecords =
      uploadedImages.map(
        function (image) {

          return {

            consultation_id:
              data.id,

            image_url:
              image.image_url

          };

        }
      );


    const {
      error:
        imageInsertError
    } =
      await supabaseClient
        .from("consultation_images")
        .insert(
          imageRecords
        );


    if (
      imageInsertError
    ) {

      console.error(
        imageInsertError
      );

      alert(
        "Consultation saved, but image records could not be saved:\n\n" +
        imageInsertError.message
      );

      viewPatient(patientId);

      return;
    }
  }


  alert(
    "Consultation saved successfully."
  );


  viewPatient(
    patientId
  );
}

/* =========================================================
   SAVE EDITED CONSULTATION
  ========================================================= */

async function saveEditedConsultation(
  consultationId,
  patientId
) {

  const updatedConsultation = {

    chief_complaints:
      document
        .getElementById(
          "editConsultChiefComplaints"
        )
        .value
        .trim(),

    vitals:
      document
        .getElementById(
          "editConsultVitals"
        )
        .value
        .trim(),

    examination:
      document
        .getElementById(
          "editConsultExamination"
        )
        .value
        .trim(),

    diagnosis:
      document
        .getElementById(
          "editConsultDiagnosis"
        )
        .value
        .trim(),

    investigations:
      document
        .getElementById(
          "editConsultInvestigations"
        )
        .value
        .trim(),

    prescription:
      document
        .getElementById(
          "editConsultPrescription"
        )
        .value
        .trim(),

    advice:
      document
        .getElementById(
          "editConsultAdvice"
        )
        .value
        .trim(),

    follow_up_date:
      document
        .getElementById(
          "editConsultFollowUpDate"
        )
        .value ||
      null
  };


  const {
    error
  } =
    await supabaseClient
      .from("consultations")
      .update(
        updatedConsultation
      )
      .eq(
        "id",
        consultationId
      );


  if (error) {

    console.error(
      "Consultation update error:",
      error
    );

    alert(
      "Unable to save consultation changes: " +
      error.message
    );

    return;
  }


  const imageInput =
    document.getElementById(
      "editConsultPrescriptionImages"
    );


  const files =
    imageInput
      ? Array.from(
          imageInput.files || []
        )
      : [];


  if (files.length > 0) {

    try {

      const uploadedImages =
        await uploadPrescriptionImages(
          patientId,
          consultationId,
          files
        );


      const imageRecords =
        uploadedImages.map(
          function (image) {

            return {

              consultation_id:
                consultationId,

              image_url:
                image.image_url

            };

          }
        );


      const {
        error:
          imageInsertError
      } =
        await supabaseClient
          .from("consultation_images")
          .insert(
            imageRecords
          );


      if (
        imageInsertError
      ) {

        console.error(
          imageInsertError
        );

        alert(
          "Consultation updated, but new image records could not be saved:\n\n" +
          imageInsertError.message
        );

        return;
      }

    } catch (uploadError) {

      console.error(
        uploadError
      );

      alert(
        "Consultation updated, but prescription image upload failed:\n\n" +
        uploadError.message
      );

      return;
    }
  }


  alert(
    "Consultation updated successfully."
  );


  viewPatient(
    patientId
  );
}


/* =========================================================
   DELETE CONSULTATION IMAGE
   ========================================================= */

async function deleteConsultationImage(
  consultationId,
  imageRecordId,
  imageUrl,
  isMainImage
) {

  const confirmed =
    confirm(
      "Are you sure you want to permanently delete this prescription image?"
    );


  if (!confirmed) {
    return;
  }


  /*
     If this image has a consultation_images
     database record, delete that record.
  */

  if (
    imageRecordId !== null &&
    imageRecordId !== undefined
  ) {

    const {
      error
    } =
      await supabaseClient
        .from("consultation_images")
        .delete()
        .eq(
          "id",
          imageRecordId
        );


    if (error) {

      console.error(
        "Image database deletion error:",
        error
      );

      alert(
        "Unable to delete image record: " +
        error.message
      );

      return;
    }
  }


  /*
     If this was the main prescription_image_url,
     remove it from the consultation table.
  */

  if (isMainImage) {

    /*
       Find another remaining image if available.
    */

    const {
      data: remainingImages
    } =
      await supabaseClient
        .from("consultation_images")
        .select("*")
        .eq(
          "consultation_id",
          consultationId
        )
        .order(
          "id",
          {
            ascending: true
          }
        );


    const nextImage =
      remainingImages &&
      remainingImages.length > 0

        ? remainingImages[0]
            .image_url

        : null;


    const {
      error:
        consultationUpdateError
    } =
      await supabaseClient
        .from("consultations")
        .update({

          prescription_image_url:
            nextImage

        })
        .eq(
          "id",
          consultationId
        );


    if (
      consultationUpdateError
    ) {

      console.error(
        consultationUpdateError
      );

      alert(
        "Image record deleted, but consultation image reference could not be updated."
      );

      return;
    }
  }


  /*
     Finally attempt to remove the physical
     image file from Supabase Storage.
  */

  await deleteStorageFile(
    imageUrl
  );


  /*
     Get patient ID so the patient profile
     can be refreshed.
  */

  const {
    data: consultation,
    error:
      consultationError
  } =
    await supabaseClient
      .from("consultations")
      .select(
        "patient_id"
      )
      .eq(
        "id",
        consultationId
      )
      .single();


  if (
    consultationError
  ) {

    console.error(
      consultationError
    );

    alert(
      "Image deleted successfully."
    );

    return;
  }


  alert(
    "Prescription image deleted successfully."
  );


  viewPatient(
    consultation.patient_id
  );
}
