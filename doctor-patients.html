/* =========================================================

const SUPABASE_URL =

const SUPABASE_PUBLISHABLE_KEY =

const supabaseClient =
  supabase.createClient(

    SUPABASE_PUBLISHABLE_KEY
  );


let currentPatientId =

/* =========================================================
   HELPERS
   ========================================================= */

function escapeHTML(value) {

  if (
    value === null ||
    value === undefined
  ) {
    return "";
  }

  return String(value)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


function showView(id) {

  document
    .querySelectorAll(
      ".portal-view"
    )
    .forEach(
      function(view) {

        view.classList.remove(
          "active"
        );

      }
    );

  const view =
    document.getElementById(id);

  if (view) {
    view.classList.add("active");
  }

  window.scrollTo({
    top: 0,
    behavior: "smooth"
  });

}


function showHomeView() {

  showView(
    "homeView"
  );

  loadTodayPatientCount();

}


function getTodayString() {

  const date =
    new Date();

  return (
    date.getFullYear() +
    "-" +
    String(
      date.getMonth() + 1
    ).padStart(2,"0") +
    "-" +
    String(
      date.getDate()
    ).padStart(2,"0")
  );

}


function formatDate(value) {

  if (!value) {
    return "-";
  }

  const date =
    new Date(
      String(value).length === 10
        ? value + "T00:00:00"
        : value
    );

  if (
    Number.isNaN(
      date.getTime()
    )
  ) {
    return value;
  }

  return date.toLocaleDateString(
    "en-IN",
    {
      day: "2-digit",
      month: "short",
      year: "numeric"
    }
  );

}


function formatDateTime(value) {

  if (!value) {
    return "-";
  }

  const date =
    new Date(value);

  if (
    Number.isNaN(
      date.getTime()
    )
  ) {
    return "-";
  }

  return date.toLocaleString(
    "en-IN",
    {
      day: "2-digit",
      month: "short",
      year: "numeric",
      hour: "numeric",
      minute: "2-digit"
    }
  );

}


function calculateAge(patient) {

  if (
    patient.age !== null &&
    patient.age !== undefined &&
    patient.age !== ""
  ) {
    return patient.age;
  }

  if (!patient.date_of_birth) {
    return "-";
  }

  const dob =
    new Date(
      patient.date_of_birth +
      "T00:00:00"
    );

  const today =
    new Date();

  let age =
    today.getFullYear() -
    dob.getFullYear();

  const monthDifference =
    today.getMonth() -
    dob.getMonth();

  if (
    monthDifference < 0 ||
    (
      monthDifference === 0 &&
      today.getDate() <
      dob.getDate()
    )
  ) {
    age--;
  }

  return age;

}


/* =========================================================
   LOGIN
   ========================================================= */

async function checkDoctorLogin() {

  const {
    data: {
      session
    }
  } =
    await supabaseClient
      .auth
      .getSession();

  if (!session) {

    window.location.href =
      "doctor-login.html";

    return false;
  }

  return true;

}


async function logoutDoctor() {

  await supabaseClient
    .auth
    .signOut();

  window.location.href =
    "doctor-login.html";

}


/* =========================================================
   PATIENT FETCH
   ========================================================= */

async function getPatient(
  patientId
) {

  const {
    data,
    error
  } =
    await supabaseClient
      .from("patients")
      .select("*")
      .eq(
        "id",
        patientId
      )
      .single();

  if (
    error ||
    !data
  ) {

    console.error(error);

    alert(
      "Unable to load patient."
    );

    return null;
  }

  return data;

}

  const patientName =

  const patientPhone =

async function loadTodayPatientCount() {

  const today =
    getTodayString();

  const start =
    today +
    "T00:00:00";

  const endDate =
    new Date(
      today +
      "T00:00:00"
    );

  endDate.setDate(
    endDate.getDate() + 1
  );

  const end =
    endDate.toISOString();


  const {
    count,
    error
  } =
    await supabaseClient
      .from("patients")
      .select(
        "*",
        {
          count: "exact",
          head: true
        }
      )
      .gte(
        "created_at",
        start
      )
      .lt(
        "created_at",
        end
      );


  if (error) {

    console.error(error);

    return;
  }


  document
    .getElementById(
      "todayPatientCount"
    )
    .textContent =
      count || 0;

}


async function loadTodayPatients() {

  showView(
    "todayView"
  );


  const container =
    document.getElementById(
      "todayPatientsContainer"
    );


  container.innerHTML = `

    <div class="portal-message">
      Loading today's patients...
    </div>

  `;


  const today =
    getTodayString();


  const start =
    today +
    "T00:00:00";


  const next =
    new Date(
      today +
      "T00:00:00"
    );


  next.setDate(
    next.getDate() + 1
  );


  const {
    data,
    error
  } =
    await supabaseClient
      .from("patients")
      .select("*")
      .gte(
        "created_at",
        start
      )
      .lt(
        "created_at",
        next.toISOString()
      )
      .order(
        "created_at",
        {
          ascending: false
        }
      );


  if (error) {

    container.innerHTML = `

      <div class="portal-message">
        Unable to load today's patients.
      </div>

    `;

    return;
  }


  if (
    !data ||
    data.length === 0
  ) {

    container.innerHTML = `

      <div class="portal-message">
        No patients registered today.
      </div>

    `;

    return;
  }


  container.innerHTML =
    data
      .map(
        function(patient) {

          return renderPatientResultCard(
            patient
          );

        }
      )
      .join("");

}


/* =========================================================
   SEARCH
   ========================================================= */

async function searchPatients() {

  const search =
    document
      .getElementById(
        "patientSearch"
      )
      .value
      .trim();


  const container =
    document.getElementById(
      "patientSearchResults"
    );


  if (!search) {

    container.innerHTML = `

      <div class="portal-message">
        Enter Patient ID, name or phone number.
      </div>

    `;

    return;
  }


  container.innerHTML = `

    <div class="portal-message">
      🔎 Searching...
    </div>

  `;


  let query =
    supabaseClient
      .from("patients")
      .select("*");


  if (
    /^\d+$/.test(
      search
    )
  ) {

    query =
      query.or(
        "id.eq." +
        search +
        ",patient_name.ilike.%" +
        search +
        "%,patient_phone.ilike.%" +
        search +
        "%"
      );

  } else {

    query =
      query.or(
        "patient_name.ilike.%" +
        search +
        "%,patient_phone.ilike.%" +
        search +
        "%"
      );

  }


  const {
    data,
    error
  } =
    await query
      .order(
        "patient_name",
        {
          ascending: true
        }
      );


  if (error) {

    console.error(error);

    container.innerHTML = `

      <div class="portal-message">
        Unable to search patients.
      </div>

    `;

    return;
  }


  if (
    !data ||
    data.length === 0
  ) {

    container.innerHTML = `

      <div class="portal-message">
        No patients found.
      </div>

    `;

    return;
  }


  container.innerHTML =
    data
      .map(
        function(patient) {

          return renderPatientResultCard(
            patient
          );

        }
      )
      .join("");

}

function buildVitals() {

  const parts = [];


  const values = {

    BP:
      document
        .getElementById(
          "consultBP"
        )
        ?.value
        .trim(),

    Pulse:
      document
        .getElementById(
          "consultPulse"
        )
        ?.value
        .trim(),

    SpO2:
      document
        .getElementById(
          "consultSpO2"
        )
        ?.value
        .trim(),

    Temperature:
      document
        .getElementById(
          "consultTemperature"
        )
        ?.value
        .trim(),

    Weight:
      document
        .getElementById(
          "consultWeight"
        )
        ?.value
        .trim(),

    Height:
      document
        .getElementById(
          "consultHeight"
        )
        ?.value
        .trim()

  };


  if (values.BP) {
    parts.push(
      "BP: " +
      values.BP
    );
  }

  if (values.Pulse) {
    parts.push(
      "Pulse: " +
      values.Pulse
    );
  }

  if (values.SpO2) {
    parts.push(
      "SpO₂: " +
      values.SpO2 +
      "%"
    );
  }

  if (values.Temperature) {
    parts.push(
      "Temperature: " +
      values.Temperature +
      " °F"
    );
  }

  if (values.Weight) {
    parts.push(
      "Weight: " +
      values.Weight +
      " kg"
    );
  }

  if (values.Height) {
    parts.push(
      "Height: " +
      values.Height +
      " cm"
    );
  }


  return parts.join(
    " | "
  );

}


/* =========================================================
   SAVE CONSULTATION
   ========================================================= */

async function saveConsultation(
  patientId
) {

  const button =
    document.getElementById(
      "saveConsultationButton"
    );


  button.disabled =
    true;

  button.textContent =
    "⏳ Saving...";


  const consultation = {

    patient_id:
      patientId,

    chief_complaints:
      document
        .getElementById(
          "consultChiefComplaints"
        )
        .value
        .trim(),

    vitals:
      buildVitals(),

    examination:
      document
        .getElementById(
          "consultExamination"
        )
        .value
        .trim(),

    diagnosis:
      document
        .getElementById(
          "consultDiagnosis"
        )
        .value
        .trim(),

    investigations:
      document
        .getElementById(
          "consultInvestigations"
        )
        .value
        .trim(),

    prescription:
      document
        .getElementById(
          "consultPrescription"
        )
        .value
        .trim(),

    advice:
      document
        .getElementById(
          "consultAdvice"
        )
        .value
        .trim(),

    follow_up_date:
      document
        .getElementById(
          "consultFollowUp"
        )
        .value ||
      null

  };


  const {
    data,
    error
  } =
    await supabaseClient
      .from("consultations")
      .insert(consultation)
      .select()
      .single();


  if (error) {

    button.disabled =
      false;

    button.textContent =
      "💾 Save Consultation";

    alert(
      "Unable to save consultation:\n\n" +
      error.message
    );

    return;
  }


  try {

    const prescriptionFiles =
      Array.from(
        document
          .getElementById(
            "consultPrescriptionFiles"
          )
          .files ||
        []
      );


    await uploadPrescriptionFiles(
      patientId,
      data.id,
      prescriptionFiles
    );


    const labFiles =
      Array.from(
        document
          .getElementById(
            "consultLabFiles"
          )
          .files ||
        []
      );


    await uploadLabFiles(
      patientId,
      data.id,
      labFiles,
      document
        .getElementById(
          "consultLabType"
        )
        .value
    );


  } catch (uploadError) {

    console.error(uploadError);

    alert(
      "Consultation was saved, but one or more files could not be uploaded:\n\n" +
      uploadError.message
    );

  }


  button.disabled =
    false;

  button.textContent =
    "💾 Save Consultation";


  alert(
    "Consultation saved successfully."
  );


  openSavedConsultation(
    patientId,
    data.id,
    true
  );

}


/* =========================================================
   PRESCRIPTION UPLOAD
   ========================================================= */

async function uploadPrescriptionFiles(
  patientId,
  consultationId,
  files
) {

  for (
    let index = 0;
    index < files.length;
    index++
  ) {

    const file =
      files[index];


    if (
      !file.type.startsWith(
        "image/"
      )
    ) {
      continue;
    }


    const safeName =
      file.name.replace(
        /[^a-zA-Z0-9._-]/g,
        "_"
      );


    const path =
      "patient-" +
      patientId +
      "/" +
      consultationId +
      "/" +
      Date.now() +
      "-" +
      index +
      "-" +
      safeName;


    const {
      error:
        uploadError
    } =
      await supabaseClient
        .storage
        .from("prescriptions")
        .upload(
          path,
          file,
          {
            upsert: false,
            contentType:
              file.type
          }
        );


    if (uploadError) {
      throw uploadError;
    }


    const {
      data:
        publicData
    } =
      supabaseClient
        .storage
        .from("prescriptions")
        .getPublicUrl(path);


    const {
      error:
        insertError
    } =
      await supabaseClient
        .from(
          "consultation_images"
        )
        .insert({

          consultation_id:
            consultationId,

          image_url:
            publicData.publicUrl

        });


    if (insertError) {
      throw insertError;
    }

  }

}


/* =========================================================
   LAB UPLOAD
   ========================================================= */

async function uploadLabFiles(
  patientId,
  consultationId,
  files,
  reportType
) {

  const allowed = [

    "image/jpeg",
    "image/png",
    "image/webp",
    "application/pdf"

  ];


  for (
    let index = 0;
    index < files.length;
    index++
  ) {

    const file =
      files[index];


    if (
      !allowed.includes(
        file.type
      )
    ) {
      continue;
    }


    const safeName =
      file.name.replace(
        /[^a-zA-Z0-9._-]/g,
        "_"
      );


    const path =
      "patient-" +
      patientId +
      "/" +
      getTodayString() +
      "/" +
      consultationId +
      "-" +
      Date.now() +
      "-" +
      index +
      "-" +
      safeName;


    const {
      error:
        uploadError
    } =
      await supabaseClient
        .storage
        .from(
          "investigation-reports"
        )
        .upload(
          path,
          file,
          {
            upsert: false,
            contentType:
              file.type
          }
        );


    if (uploadError) {
      throw uploadError;
    }


    const {
      error:
        insertError
    } =
      await supabaseClient
        .from(
          "investigation_reports"
        )
        .insert({

          patient_id:
            patientId,

          consultation_id:
            consultationId,

          report_date:
            getTodayString(),

          report_type:
            reportType ||
            "Laboratory Report",

          file_name:
            file.name,

          file_path:
            path,

          file_type:
            file.type,

          file_size:
            file.size

        });


    if (insertError) {

      await supabaseClient
        .storage
        .from(
          "investigation-reports"
        )
        .remove([
          path
        ]);

      throw insertError;
    }

  }

}

async function saveEditedConsultation(
  consultationId,
  patientId
) {

  const updated = {

    chief_complaints:
      document
        .getElementById(
          "editConsultChiefComplaints"
        )
        .value
        .trim(),

    vitals:
      document
        .getElementById(
          "editConsultVitals"
        )
        .value
        .trim(),

    examination:
      document
        .getElementById(
          "editConsultExamination"
        )
        .value
        .trim(),

    diagnosis:
      document
        .getElementById(
          "editConsultDiagnosis"
        )
        .value
        .trim(),

    investigations:
      document
        .getElementById(
          "editConsultInvestigations"
        )
        .value
        .trim(),

    prescription:
      document
        .getElementById(
          "editConsultPrescription"
        )
        .value
        .trim(),

    advice:

        .getElementById(
          "editConsultAdvice"
        )
        .value
        .trim(),

    follow_up_date:
      document
        .getElementById(
          "editConsultFollowUp"
        )
        .value ||

  };

    error

    );

    return;
  }


  alert(
    "Consultation updated successfully."
  );


  openSavedConsultation(
    patientId,
    consultationId,
    false
  );

}

async function downloadPrescriptionImage(
  encodedUrl,
  number
) {

  const url =
    decodeURIComponent(
      encodedUrl
    );


  try {

    const response =
      await fetch(url);


    if (!response.ok) {
      throw new Error();
    }


    const blob =
      await response.blob();


    const blobUrl =
      URL.createObjectURL(
        blob
      );


    const link =
      document.createElement(
        "a"
      );


    link.href =
      blobUrl;


    link.download =
      "Prescription-" +
      number +
      ".jpg";


    document.body.appendChild(
      link
    );


    link.click();

    link.remove();


    setTimeout(
      function() {

        URL.revokeObjectURL(
          blobUrl
        );

      },
      1000
    );


  } catch (error) {

    alert(
      "Unable to download prescription."
    );

  }

}


function getPrescriptionStoragePath(
  imageUrl
) {

  try {

    const url =
      new URL(imageUrl);


    const marker =
      "/storage/v1/object/public/prescriptions/";


    const index =
      url.pathname.indexOf(
        marker
      );


    if (
      index === -1
    ) {
      return null;
    }


    return decodeURIComponent(
      url.pathname.substring(
        index +
        marker.length
      )
    );


  } catch (error) {

    return null;

  }

}


async function deletePrescriptionImage(
  imageId,
  encodedUrl,
  consultationId
) {

  if (
    !confirm(
      "Delete this prescription image permanently?"
    )
  ) {
    return;
  }


  const imageUrl =
    decodeURIComponent(
      encodedUrl
    );


  const {
    error:
      databaseError
  } =
    await supabaseClient
      .from(
        "consultation_images"
      )
      .delete()
      .eq(
        "id",
        imageId
      );


  if (databaseError) {

    alert(
      "Unable to delete prescription image:\n\n" +
      databaseError.message
    );

    return;
  }


  const path =
    getPrescriptionStoragePath(
      imageUrl
    );


  if (path) {

    await supabaseClient
      .storage
      .from(
        "prescriptions"
      )
      .remove([
        path
      ]);

  }


  alert(
    "Prescription image deleted."
  );


  const editView =
    document.getElementById(
      "editConsultationView"
    );


  if (
    editView &&
    editView.classList.contains(
      "active"
    )
  ) {

    await openEditConsultation(
      consultationId
    );

  } else {

    await loadFullConsultation(
      consultationId
    );

  }

}

async function getLabReport(

) {

  const {

  } =
    await supabaseClient
      .from(
        "investigation_reports"
      )
      .select("*")
      .eq(
        "id",

      )
      .single();


  if (
    error ||
    !data
  ) {

    alert(
      "Unable to load lab report."
    );

    return null;
  }


  return data;

}


async function getLabSignedURL(
  report
) {

  const {
    data,
    error
  } =
    await supabaseClient
      .storage
      .from(
        "investigation-reports"
      )
      .createSignedUrl(
        report.file_path,
        60 * 60
      );


  if (
    error ||
    !data
  ) {

    alert(
      "Unable to open lab report."
    );

    return null;
  }


  return data.signedUrl;

}


async function viewLabReport(
  reportId
) {

  const report =
    await getLabReport(
      reportId
    );


  if (!report) {
    return;
  }


  const signedURL =
    await getLabSignedURL(
      report
    );


  if (!signedURL) {
    return;
  }


  const isPDF =
    report.file_type ===
      "application/pdf" ||
    (
      report.file_name ||
      ""
    )
    .toLowerCase()
    .endsWith(
      ".pdf"
    );


  if (isPDF) {

    openPDFModal(
      signedURL,
      report.report_type ||
      "Lab Report"
    );

  } else {

    openImageModal(
      signedURL,
      report.report_type ||
      "Lab Report"
    );

  }

}

  }


  try {

    const response =

    }


    const blob =

    const blobUrl =
      URL.createObjectURL(

      );


    const link =
      document.createElement(

      );


    link.href =

    link.download =

async function deleteLabReport(

) {

async function uploadPrescriptionForPatient(
  patientId
) {

  /*
     Direct prescription uploads are kept
     as prescription-only consultation records
     so they can remain linked to the patient.
  */

  const input =
    document.createElement(
      "input"
    );


  input.type =
    "file";

  input.accept =
    "image/jpeg,image/png,image/webp";

  input.multiple =
    true;


  input.onchange =
    async function() {

      const files =
        Array.from(
          input.files ||
          []
        );


      if (
        files.length === 0
      ) {
        return;
      }


      const {
        data:
          consultation,
        error
      } =
        await supabaseClient
          .from("consultations")
          .insert({

            patient_id:
              patientId,

            chief_complaints:
              "__DIRECT_PRESCRIPTION_UPLOAD__",

            vitals: "",
            examination: "",
            diagnosis: "",
            investigations: "",
            prescription: "",
            advice: "",
            follow_up_date: null

          })
          .select()
          .single();


      if (error) {

        alert(
          "Unable to create prescription record:\n\n" +
          error.message
        );

        return;
      }


      try {

        await uploadPrescriptionFiles(
          patientId,
          consultation.id,
          files
        );


        alert(
          "Prescription uploaded successfully."
        );


      } catch (uploadError) {

        alert(
          "Unable to upload prescription:\n\n" +
          uploadError.message
        );

      }

    };


  input.click();

}

async function handleURLParameters() {

  const params =
    new URLSearchParams(
      window.location.search
    );


  const view =
    params.get(
      "view"
    );


  const patientId =
    params.get(
      "patient_id"
    );


  const consultationId =
    params.get(
      "consultation_id"
    );


  if (
    view ===
      "consultation" &&
    patientId &&
    consultationId
  ) {

    await openSavedConsultation(
      Number(
        patientId
      ),
      Number(
        consultationId
      ),
      false
    );


    return true;
  }


  return false;

}
