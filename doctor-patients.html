   async function searchPatients() {

  const search =
    document
      .getElementById("patientSearch")
      .value
      .trim();

  const container =
    document.getElementById("patientsContainer");


  if (!search) {

    container.innerHTML =
      "<p>Please enter Patient ID, name or phone number.</p>";

    return;
  }


  let query =
    supabaseClient
      .from("patients")
      .select("*");


  // If search is a number, search Patient ID,
  // phone number, and name
  if (/^\d+$/.test(search)) {

    query = query.or(
      `patient_phone.ilike.%${search}%,patient_name.ilike.%${search}%,id.eq.${search}`
    );

  } else {

    // For text, search only name and phone
    query = query.or(
      `patient_name.ilike.%${search}%,patient_phone.ilike.%${search}%`
    );

  }


  const { data, error } =
    await query.order(
      "patient_name",
      {
        ascending: true
      }
    );


  if (error) {

    console.error(
      "Patient search error:",
      error
    );

    container.innerHTML =
      "<p>Unable to search patients.</p>";

    return;
  }


  if (!data || data.length === 0) {

    container.innerHTML =
      "<p>No patients found.</p>";

    return;
  }


  container.innerHTML = "";


  data.forEach(function (patient) {

    const card =
      document.createElement("div");

    card.className =
      "appointment-card";


    card.innerHTML = `

      <strong>
        👤 ${patient.patient_name || "-"}
      </strong>

      <span>
        🆔 Patient ID: ${patient.id}
      </span>

      <span>
        📞 ${patient.patient_phone || "-"}
      </span>

      <span>
        🎂 ${patient.date_of_birth || "-"}
      </span>

      <span>
        ⚧ ${patient.gender || "-"}
      </span>

    `;


    const viewButton =
      document.createElement("button");

    viewButton.type =
      "button";

    viewButton.className =
      "doctor-login-button";

    viewButton.textContent =
      "👁️ View Patient";


    viewButton.onclick =
      function () {

        viewPatient(patient.id);

      };


    card.appendChild(
      viewButton
    );


    container.appendChild(
      card
    );

  });

   }

      async function saveConsultation(patientId) {
    let prescriptionImageUrl = null;

  const prescriptionFiles =
    document
      .getElementById("consultPrescriptionImages")
      .files;

  const uploadedImageUrls = [];


  for (
    let i = 0;
    i < prescriptionFiles.length;
    i++
  ) {

    const imageFile =
      prescriptionFiles[i];

    const fileExtension =
      imageFile.name.split(".").pop();

    const fileName =
      patientId +
      "_" +
      Date.now() +
      "_" +
      i +
      "." +
      fileExtension;

    const filePath =
      "patient-" +
      patientId +
      "/" +
      fileName;


    const { error: uploadError } =
      await supabaseClient
        .storage
        .from("prescriptions")
        .upload(
          filePath,
          imageFile,
          {
            upsert: false
          }
        );


    if (uploadError) {

      console.error(
        "Prescription image upload error:",
        uploadError
      );

      alert(
        "Unable to upload prescription image: " +
        uploadError.message
      );

      return;
    }


    const { data: publicUrlData } =
      supabaseClient
        .storage
        .from("prescriptions")
        .getPublicUrl(filePath);


    uploadedImageUrls.push(
      publicUrlData.publicUrl
    );

  }


  if (uploadedImageUrls.length > 0) {

    prescriptionImageUrl =
      uploadedImageUrls[0];

  }
  const consultation = {

    patient_id: patientId,
    prescription_image_url:
      prescriptionImageUrl,
    chief_complaints:
      document
        .getElementById("consultChiefComplaints")
        .value
        .trim(),

    vitals:
      document
        .getElementById("consultVitals")
        .value
        .trim(),

    examination:
      document
        .getElementById("consultExamination")
        .value
        .trim(),

    diagnosis:
      document
        .getElementById("consultDiagnosis")
        .value
        .trim(),

    investigations:
      document
        .getElementById("consultInvestigations")
        .value
        .trim(),

    prescription:
      document
        .getElementById("consultPrescription")
        .value
        .trim(),

    advice:
      document
        .getElementById("consultAdvice")
        .value
        .trim(),

    follow_up_date:
      document
        .getElementById("consultFollowUpDate")
        .value || null

  };


  const { data, error } =
    await supabaseClient
      .from("consultations")
      .insert([consultation])
      .select()
      .single();


  if (error) {

    console.error(
      "Error saving consultation:",
      error
    );

    alert(
      "Unable to save consultation: " +
      error.message
    );

    return;
  }

  if (uploadedImageUrls.length > 0) {

    const imageRecords =
      uploadedImageUrls.map(function (imageUrl) {

        return {
          consultation_id: data.id,
          image_url: imageUrl
        };

      });


    const {
      error: imageInsertError
    } =
      await supabaseClient
        .from("consultation_images")
        .insert(imageRecords);


    if (imageInsertError) {

      console.error(
        "Error saving consultation images:",
        imageInsertError
      );

      alert(
        "Consultation saved, but prescription images could not be linked: " +

async function saveEditedConsultation(
  consultationId,
  patientId
) {

  const updatedConsultation = {

    chief_complaints:
      document
        .getElementById("editConsultChiefComplaints")
        .value
        .trim(),

    vitals:
      document
        .getElementById("editConsultVitals")
        .value
        .trim(),

    examination:
      document
        .getElementById("editConsultExamination")
        .value
        .trim(),

    diagnosis:
      document
        .getElementById("editConsultDiagnosis")
        .value
        .trim(),

    investigations:
      document
        .getElementById("editConsultInvestigations")
        .value
        .trim(),

    prescription:
      document
        .getElementById("editConsultPrescription")
        .value
        .trim(),

    advice:
      document
        .getElementById("editConsultAdvice")
        .value
        .trim(),

    follow_up_date:
      document
        .getElementById("editConsultFollowUpDate")
        .value || null

  };


  /* =========================
     UPDATE CONSULTATION
     ========================= */

  const {
    data,
    error
  } =
    await supabaseClient
      .from("consultations")
      .update(updatedConsultation)
      .eq("id", consultationId)
      .select()
      .single();


  if (error) {

    console.error(
      "Error updating consultation:",
      error
    );

    alert(
      "Unable to save consultation changes: " +
      error.message
    );

    return;
  }


  /* =========================
     UPLOAD NEW IMAGES
     ========================= */

  const imageInput =
    document.getElementById(
      "editConsultPrescriptionImages"
    );


  const prescriptionFiles =
    imageInput
      ? imageInput.files
      : [];


  for (
    let i = 0;
    i < prescriptionFiles.length;
    i++
  ) {

    const imageFile =
      prescriptionFiles[i];


    const fileExtension =
      imageFile.name
        .split(".")
        .pop();


    const fileName =
      patientId +
      "_" +
      Date.now() +
      "_" +
      i +
      "." +
      fileExtension;


    const filePath =
      "patient-" +
      patientId +
      "/" +
      fileName;


    const {
      error: uploadError
    } =
      await supabaseClient
        .storage
        .from("prescriptions")
        .upload(
          filePath,
          imageFile,
          {
            upsert: false
          }
        );


    if (uploadError) {

      console.error(
        "Prescription image upload error:",
        uploadError
      );

      alert(
        "Consultation updated, but image upload failed: " +
        uploadError.message
      );

      return;
    }


    /* =========================
       GET PUBLIC IMAGE URL
       ========================= */

    const {
      data: publicUrlData
    } =
      supabaseClient
        .storage
        .from("prescriptions")
        .getPublicUrl(
          filePath
        );


    const imageUrl =
      publicUrlData.publicUrl;


    /* =========================
       SAVE IMAGE RECORD
       ========================= */

    const {
      error: imageInsertError
    } =
      await supabaseClient
        .from("consultation_images")
        .insert([

          {
            consultation_id:
              consultationId,

            image_url:
              imageUrl
          }

        ]);


    if (imageInsertError) {

      console.error(
        "Error saving consultation image:",
        imageInsertError
      );

      alert(
        "Consultation updated, but image record could not be saved: " +
        imageInsertError.message
      );

      return;
    }

  }


  /* =========================
     FINISHED
     ========================= */

  alert(
    "Consultation updated successfully."
  );


  viewPatient(
    patientId
  );

      }
