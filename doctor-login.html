<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

  <title>Doctor Login | General & Diabetes Care</title>

  <link rel="stylesheet" href="styles.css">

</head>

<body>

  <section class="doctor-login-section">

    <div class="doctor-login-card">

      <div class="doctor-login-icon">
        🔐
      </div>

      <p class="section-label">
        GENERAL &amp; DIABETES CARE
      </p>

      <h1>
        Doctor Portal
      </h1>

      <p class="login-subtitle">
        Secure access for clinic management
      </p>


      <form id="doctorLoginForm">

        <div class="form-group">

          <label for="doctorEmail">
            Email / Username
          </label>

          <input
            type="text"
            id="doctorEmail"
            placeholder="Enter username"
            autocomplete="username"
            required>

        </div>


        <div class="form-group">

          <label for="doctorPassword">
            Password
          </label>

          <input
            type="password"
            id="doctorPassword"
            placeholder="Enter password"
            autocomplete="current-password"
            required>

        </div>


        <button
          type="submit"
          class="doctor-login-button">

          🔐 Login

        </button>

        <p
          id="loginMessage"
          class="login-message">
        </p>

      </form>


      <a
        href="index.html"
        class="back-home">

        ← Back to Clinic Website

      </a>

    </div>

  </section>

</body>

</html>
