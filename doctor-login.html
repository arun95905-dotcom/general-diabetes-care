<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Doctor Login | General & Diabetes Care</title>

  <link rel="stylesheet" href="styles.css">

</head>

<body>

  <section class="doctor-login-section">

    <div class="doctor-login-card">

      <div class="doctor-login-icon">
        🔐
      </div>

      <p class="section-label">
        GENERAL &amp; DIABETES CARE
      </p>

      <h1>
        Doctor Portal
      </h1>

      <p class="login-subtitle">
        Secure access for clinic management
      </p>


      <form id="doctorLoginForm">

        <div class="form-group">

          <label for="doctorEmail">
            Email / Username
          </label>

          <input
            type="text"
            id="doctorEmail"
            placeholder="Enter username"
            autocomplete="username"
            required>

        </div>


        <div class="form-group">

          <label for="doctorPassword">
            Password
          </label>

          <input
            type="password"
            id="doctorPassword"
            placeholder="Enter password"
            autocomplete="current-password"
            required>

        </div>
<p>
  <a
    href="#"
    id="forgotPassword">
    Forgot Password?
  </a>
</p>

        <button
          type="submit"
          class="doctor-login-button">

          🔐 Login

        </button>

        <p
          id="loginMessage"
          class="login-message">
        </p>

      </form>


      <a
        href="index.html"
        class="back-home">

        ← Back to Clinic Website

      </a>

    </div>

  </section>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>

const SUPABASE_URL = "https://twdmvdqqckcpwoccvtkj.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
  "sb_publishable_qDvT0t7pC5l5kbKl9QirMg_JbBrvUyI";
const supabaseClient = supabase.createClient(
  SUPABASE_URL,
  SUPABASE_PUBLISHABLE_KEY
);


document
  .getElementById("doctorLoginForm")
  .addEventListener("submit", async function(event) {

    event.preventDefault();

    const email =
      document.getElementById("doctorEmail").value.trim();

    const password =
      document.getElementById("doctorPassword").value;

    const message =
      document.getElementById("loginMessage");

    message.textContent = "Signing in...";


    const { data, error } =
      await supabaseClient.auth.signInWithPassword({
        email: email,
        password: password
      });


    if (error) {

      message.textContent =
        "Login failed. Please check your email and password.";

      return;

    }


    message.textContent =
      "Login successful.";

    window.location.href =
      "doctor-dashboard.html";

});
document
  .getElementById("forgotPassword")
  .addEventListener("click", async function(event) {

    event.preventDefault();

    const email =
      document.getElementById("doctorEmail").value.trim();

    const message =
      document.getElementById("loginMessage");

    if (!email) {

      message.textContent =
        "Please enter your email address first.";

      return;

    }

    message.textContent =
      "Sending password recovery email...";

    const { error } =
      await supabaseClient.auth.resetPasswordForEmail(
        email,
        {
          redirectTo:
  "https://generalanddiabetescare.com/reset-password.html"
        }
      );

    if (error) {

      console.error(error);

      message.textContent =
        "Unable to send recovery email. Please try again later.";

      return;

    }

    message.textContent =
      "Password recovery email sent. Please check your inbox.";

});
</script>

</body>

</html>
