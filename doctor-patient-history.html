<script>

/* =========================================================
   SUPABASE
   ========================================================= */

const SUPABASE_URL =
  "https://twdmvdqqckcpwoccvtkj.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
  "sb_publishable_qDvT0t7pC5l5kbKl9QirMg_JbBrvUyI";

const supabaseClient =
  supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
  );


/* =========================================================
   STATE
   ========================================================= */

let currentPatient =
  null;

let currentPatientId =
  null;

let currentConsultationId =
  null;

let historyReturnURL =
  null;

let allConsultations =
  [];

let allPrescriptionImages =
  [];

let allLabReports =
  [];

  let allBills =
  [];

const HISTORY_YEAR_LOOKBACK =
  20;

const HISTORY_MONTH_NAMES = [
  "January",
  "February",
  "March",
  "April",
  "May",
  "June",
  "July",
  "August",
  "September",
  "October",
  "November",
  "December"
];

let activeHistoryCategory =
  null;

let historyDisplayMode =
  "menu";

let selectedHistoryYear =
  new Date().getFullYear();

let selectedHistoryMonth =
  new Date().getMonth() + 1;


/* =========================================================
   HELPERS
   ========================================================= */

function escapeHTML(value) {

  if (
    value === null ||
    value === undefined
  ) {
    return "";
  }

  return String(value)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


function showView(viewId) {

  document
    .querySelectorAll(".portal-view")
    .forEach(
      function(view) {

        view.classList.remove(
          "active"
        );

      }
    );


  const view =
    document.getElementById(
      viewId
    );


  if (view) {

    view.classList.add(
      "active"
    );

  }


  window.scrollTo({
    top: 0,
    behavior: "smooth"
  });

}


function formatDate(value) {

  if (!value) {
    return "-";
  }


  const date =
    new Date(
      String(value).length === 10
        ? value + "T00:00:00"
        : value
    );


  if (
    Number.isNaN(
      date.getTime()
    )
  ) {
    return value;
  }


  return date.toLocaleDateString(
    "en-IN",
    {
      day: "2-digit",
      month: "short",
      year: "numeric"
    }
  );

}


function formatDateTime(value) {

  if (!value) {
    return "-";
  }


  const date =
    new Date(value);


  if (
    Number.isNaN(
      date.getTime()
    )
  ) {
    return "-";
  }


  return date.toLocaleString(
    "en-IN",
    {
      day: "2-digit",
      month: "short",
      year: "numeric",
      hour: "numeric",
      minute: "2-digit"
    }
  );

}


function getTodayString() {

  const date =
    new Date();


  return (
    date.getFullYear() +
    "-" +
    String(
      date.getMonth() + 1
    ).padStart(2,"0") +
    "-" +
    String(
      date.getDate()
    ).padStart(2,"0")
  );

}


function calculateAge(patient) {

  if (
    patient.age !== null &&
    patient.age !== undefined &&
    patient.age !== ""
  ) {

    return patient.age;

  }


  if (!patient.date_of_birth) {
    return "-";
  }


  const dob =
    new Date(
      patient.date_of_birth +
      "T00:00:00"
    );


  const today =
    new Date();


  let age =
    today.getFullYear() -
    dob.getFullYear();


  const difference =
    today.getMonth() -
    dob.getMonth();


  if (
    difference < 0 ||
    (
      difference === 0 &&
      today.getDate() <
      dob.getDate()
    )
  ) {

    age--;

  }


  return age;

}


/* =========================================================
   LOGIN
   ========================================================= */

async function checkDoctorLogin() {

  const {
    data: {
      session
    }
  } =
    await supabaseClient
      .auth
      .getSession();


  if (!session) {

    window.location.href =
      "doctor-login.html";

    return false;

  }


  return true;

}


async function logoutDoctor() {

  await supabaseClient
    .auth
    .signOut();


  window.location.href =
    "doctor-login.html";

}


/* =========================================================
   RETURN NAVIGATION — STEP 2
   ========================================================= */

function readHistoryReturnURL() {

  const params =
    new URLSearchParams(
      window.location.search
    );


  historyReturnURL =
    params.get(
      "return_to"
    );


  const button =
    document.getElementById(
      "historyBackButton"
    );


  if (
    !button ||
    !historyReturnURL
  ) {

    return;

  }


  const returnURL =
    String(
      historyReturnURL
    )
    .toLowerCase();


  if (
    returnURL.includes(
      "doctor-followups.html"
    )
  ) {

    button.textContent =
      "← Back to Follow-ups";

    return;

  }


  if (
    returnURL.includes(
      "doctor-appointments.html"
    )
  ) {

    button.textContent =
      "← Back to Appointments";

    return;

  }


  if (
    returnURL.includes(
      "doctor-patients.html?view=today"
    ) ||
    returnURL.includes(
      "view=today"
    )
  ) {

    button.textContent =
      "← Back to Today's Registered Patients";

    return;

  }


  if (
    returnURL.includes(
      "view=search"
    )
  ) {

    button.textContent =
      "← Back to Patient Search";

    return;

  }


  button.textContent =
    "← Back";

}


function goBackFromHistory() {

  if (
    historyReturnURL
  ) {

    window.location.href =
      historyReturnURL;

    return;

  }


  const params =
    new URLSearchParams(
      window.location.search
    );

  const search =
    params.get(
      "search"
    );


  if (
    search
  ) {

    window.location.href =
      "doctor-patients.html" +
      "?view=search" +
      "&search=" +
      encodeURIComponent(
        search
      );

    return;

  }


  window.location.href =
    "doctor-patients.html";
}

/* =========================================================
   PATIENT ID
   ========================================================= */

function getPatientIdFromURL() {

  const params =
    new URLSearchParams(
      window.location.search
    );


  const patientId =
    params.get(
      "patient_id"
    );


  if (!patientId) {
    return null;
  }


  return Number(
    patientId
  );

}


/* =========================================================
   LOAD PATIENT
   ========================================================= */

async function loadPatient() {

  const {
    data,

/* =========================================================
   LOAD PRESCRIPTIONS
   ========================================================= */

async function loadPrescriptionImages() {

  const {
    data:
      consultations
  } =
    await supabaseClient
      .from("consultations")
      .select(
        "id,created_at,prescription_image_url"
      )
      .eq(
        "patient_id",
        currentPatientId
      );


  const rows =
    consultations ||
    [];


  const consultationIds =
    rows.map(
      function(item) {
        return item.id;
      }
    );


  let imageRows =
    [];


  if (
    consultationIds.length
  ) {

    const {
      data
    } =
      await supabaseClient
        .from("consultation_images")
        .select("*")
        .in(
          "consultation_id",
          consultationIds
        );


    imageRows =
      data ||
      [];

  }


  const images =
    [];


  rows.forEach(
    function(consultation) {

      const matched =
        imageRows.filter(
          function(image) {

            return (
              Number(
                image.consultation_id
              ) ===
              Number(
                consultation.id
              )
            );

          }
        );


      matched.forEach(
        function(image) {

          images.push({

            id:
              image.id,

            consultation_id:
              consultation.id,

            image_url:
              image.image_url,

            created_at:
              consultation.created_at,

            legacy:
              false

          });

        }
      );


      const legacy =
        consultation
          .prescription_image_url;


      if (
        legacy &&
        !matched.some(
          function(image) {

            return (
              image.image_url ===
              legacy
            );

          }
        )
      ) {

        images.push({

          id:
            null,

          consultation_id:
            consultation.id,

          image_url:
            legacy,

          created_at:
            consultation.created_at,

          legacy:
            true

        });

      }

    }
  );


  images.sort(
    function(a,b) {

      return (
        new Date(
          b.created_at
        ) -
        new Date(
          a.created_at
        )
      );

    }
  );


  allPrescriptionImages =
    images;

}

    },

      singular: "prescription",
      plural: "prescriptions",

    },

    lab: {

      singular: "lab report",
      plural: "lab reports",

    },

function getHistoryItems(
  category
) {

  if (category === "consultation") {
    return allConsultations;
  }

  if (category === "prescription") {
    return allPrescriptionImages;
  }

  if (category === "lab") {
    return allLabReports;
  }

  if (category === "bill") {
    return allBills;
  }


  return [];

}


function getHistoryItemDate(
  category,
  item
) {

  if (!item) {
    return null;
  }


  if (
    category === "consultation" ||
    category === "prescription"
  ) {

    return item.created_at ||
      null;

  }


  if (category === "lab") {

    return (
      item.report_date ||
      item.created_at ||
      null
    );

  }


  if (category === "bill") {

    return (
      item.bill_date ||
      item.created_at ||
      null
    );

  }


  return null;

}


function getHistoryDateParts(
  value
) {

  if (!value) {
    return null;
  }


  const date =
    new Date(
      String(value).length === 10
        ? value + "T00:00:00"
        : value
    );


  if (
    Number.isNaN(
      date.getTime()
    )
  ) {

    return null;

  }


  return {
    year: date.getFullYear(),
    month: date.getMonth() + 1
  };

}


function getFilteredHistoryItems(
  category
) {

  return getHistoryItems(
    category
  )
  .filter(
    function(item) {

      const parts =
        getHistoryDateParts(
          getHistoryItemDate(
            category,
            item
          )
        );


      return (
        parts &&
        parts.year ===
          Number(
            selectedHistoryYear
          ) &&
        parts.month ===
          Number(
            selectedHistoryMonth
          )
      );

    }
  );

}


function getHistorySelectId(
  type,
  category
) {

  return (
    "history" +
    (
      type === "year"
        ? "Year"
        : "Month"
    ) +
    "Select-" +
    category
  );

}


function populateHistoryYearOptions(
  category
) {

  const select =
    document.getElementById(
      getHistorySelectId(
        "year",
        category
      )
    );


  if (!select) {
    return;
  }


  const currentYear =
    new Date().getFullYear();


  let html =
    "";


  for (
    let year = currentYear;
    year >=
      currentYear -
      HISTORY_YEAR_LOOKBACK;
    year--
  ) {

    html +=
      `<option value="${year}">
        ${year}
      </option>`;

  }


  select.innerHTML =
    html;


  if (
    selectedHistoryYear >
      currentYear ||
    selectedHistoryYear <
      currentYear -
      HISTORY_YEAR_LOOKBACK
  ) {

    selectedHistoryYear =
      currentYear;

  }


  select.value =
    String(
      selectedHistoryYear
    );

}


function populateHistoryMonthOptions(
  category
) {

  const select =
    document.getElementById(
      getHistorySelectId(
        "month",
        category
      )
    );


  if (!select) {
    return;
  }


  const today =
    new Date();


  const currentYear =
    today.getFullYear();


  const maxMonth =
    Number(
      selectedHistoryYear
    ) === currentYear
      ? today.getMonth() + 1
      : 12;


  if (
    selectedHistoryMonth < 1 ||
    selectedHistoryMonth > maxMonth
  ) {

    selectedHistoryMonth =
      maxMonth;

  }


  let html =
    "";


  for (
    let month = maxMonth;
    month >= 1;
    month--
  ) {

    html +=
      `<option value="${month}">
        ${HISTORY_MONTH_NAMES[
          month - 1
        ]}
      </option>`;

  }


  select.innerHTML =
    html;


  select.value =
    String(
      selectedHistoryMonth
    );

}


function updateHistoryURL(
  mode
) {

  const url =
    new URL(
      window.location.href
    );


  if (
    mode === "menu" ||
    !activeHistoryCategory
  ) {

    url.searchParams.delete(
      "history"
    );

    url.searchParams.delete(
      "year"
    );

    url.searchParams.delete(
      "month"
    );

    url.searchParams.delete(
      "history_view"
    );

  } else {

    url.searchParams.set(
      "history",
      activeHistoryCategory
    );

    url.searchParams.set(
      "year",
      selectedHistoryYear
    );

    url.searchParams.set(
      "month",
      selectedHistoryMonth
    );

    url.searchParams.set(
      "history_view",
      mode
    );

  }


  window.history.replaceState(
    {},
    "",
    url.pathname +
    url.search
  );

}

function getSortedFullHistoryItems(
  category
) {

  return [
    ...getHistoryItems(
      category
    )
  ]
  .sort(
    function(a,b) {

      const aDate =
        getHistoryItemDate(
          category,
          a
        );

      const bDate =
        getHistoryItemDate(
          category,
          b
        );


      const aTime =
        aDate
          ? new Date(
              String(aDate).length === 10
                ? aDate + "T00:00:00"
                : aDate
            ).getTime()
          : 0;


      const bTime =
        bDate
          ? new Date(
              String(bDate).length === 10
                ? bDate + "T00:00:00"
                : bDate
            ).getTime()
          : 0;


      if (
        bTime !== aTime
      ) {

        return bTime - aTime;

      }


      return (
        Number(
          b.id ||
          0
        ) -
        Number(
          a.id ||
          0
        )
      );

    }
  );

}

function restoreHistoryStateFromURL() {

  const params =
    new URLSearchParams(
      window.location.search
    );


  const category =
    params.get(
      "history"
    );


  const config =
    getHistoryCategoryConfig(
      category
    );


  if (!config) {

    showPatientHistoryMenu();

    return;

  }


  activeHistoryCategory =
    category;


  const today =
    new Date();


  const currentYear =
    today.getFullYear();


  const requestedYear =
    Number(
      params.get(
        "year"
      )
    );


  const minimumYear =
    currentYear -
    HISTORY_YEAR_LOOKBACK;


  selectedHistoryYear =
    (
      Number.isInteger(
        requestedYear
      ) &&
      requestedYear <=
        currentYear &&
      requestedYear >=
        minimumYear
    )
      ? requestedYear
      : currentYear;


  const maxMonth =
    selectedHistoryYear ===
      currentYear
      ? today.getMonth() + 1
      : 12;


  const requestedMonth =
    Number(
      params.get(
        "month"
      )
    );


  selectedHistoryMonth =
    (
      Number.isInteger(
        requestedMonth
      ) &&
      requestedMonth >= 1 &&
      requestedMonth <= maxMonth
    )
      ? requestedMonth
      : (
          selectedHistoryYear ===
            currentYear
            ? today.getMonth() + 1
            : maxMonth
        );


  const requestedMode =
    params.get(
      "history_view"
    );


  historyDisplayMode =
    requestedMode === "records"
      ? "records"
      : (
          requestedMode === "full"
            ? "full"
            : "selector"
        );


  hideAllHistorySections();


  const menu =
    document.getElementById(
      "historyMenu"
    );


  const actions =
    document.getElementById(
      "historyMainActions"
    );


  if (menu) {

    menu.classList.add(
      "hidden"
    );

  }


  if (actions) {

    actions.classList.add(
      "hidden"
    );

  }


  document
    .getElementById(
      config.sectionId
    )
    .classList.add(

/* =========================================================
   DOWNLOAD PRESCRIPTION
   ========================================================= */

async function downloadPrescription(
  encodedURL,
  number
) {

  const url =
    decodeURIComponent(
      encodedURL
    );


  try {

    const response =
      await fetch(
        url
      );


    const blob =
      await response.blob();


    const blobURL =
      URL.createObjectURL(
        blob
      );


    const link =
      document.createElement(
        "a"
      );


    link.href =
      blobURL;


    link.download =
      "Prescription-" +
      number +
      ".jpg";


    document.body.appendChild(
      link
    );


    link.click();


    link.remove();


    setTimeout(
      function() {

        URL.revokeObjectURL(
          blobURL
        );

      },
      1000
    );


  } catch (error) {

    window.open(
      url,
      "_blank"
    );

  }

}


/* =========================================================
   DELETE PRESCRIPTION
   ========================================================= */

function getPrescriptionPath(
  imageURL
) {

  try {

    const url =
      new URL(
        imageURL
      );


    const marker =
      "/storage/v1/object/public/prescriptions/";


    const index =
      url.pathname.indexOf(
        marker
      );


    if (
      index === -1
    ) {

      return null;

    }


    return decodeURIComponent(
      url.pathname.substring(
        index +
        marker.length
      )
    );


  } catch {

    return null;

  }

}


async function deletePrescription(
  imageId,
  encodedURL,
  consultationId,
  legacy
) {

  if (
    !confirm(
      "Delete this prescription image permanently?"
    )
  ) {

    return;

  }


  const imageURL =
    decodeURIComponent(
      encodedURL
    );


  if (
    imageId !== null
  ) {

    const {
      error
    } =
      await supabaseClient
        .from(
          "consultation_images"
        )
        .delete()
        .eq(
          "id",
          imageId
        );


    if (error) {

      alert(
        error.message
      );

      return;

    }

  }


  const {
    data:
      consultation
  } =
    await supabaseClient
      .from(
        "consultations"
      )
      .select(
        "prescription_image_url"
      )
      .eq(
        "id",
        consultationId
      )
      .single();


  if (
    legacy ||
    (
      consultation &&
      consultation.prescription_image_url ===
      imageURL
    )
  ) {

    const {
      data:
        remaining
    } =
      await supabaseClient
        .from(
          "consultation_images"
        )
        .select("image_url")
        .eq(
          "consultation_id",
          consultationId
        )
        .order(
          "id",
          {
            ascending: true
          }
        );


    const nextURL =
      remaining &&
      remaining.length
        ? remaining[0].image_url
        : null;


    await supabaseClient
      .from(
        "consultations"
      )
      .update({

        prescription_image_url:
          nextURL

      })
      .eq(
        "id",
        consultationId
      );

  }


  const path =
    getPrescriptionPath(
      imageURL
    );


  if (path) {

    await supabaseClient
      .storage
      .from(
        "prescriptions"
      )
      .remove([
        path
      ]);

  }


  await refreshHistoryData();

}

/* =========================================================
   EDIT CONSULTATION
   ========================================================= */

function parseVitals(
  value
) {

  const result = {

    bp: "",
    pulse: "",
    spo2: "",
    temperature: "",
    weight: "",
    height: ""

  };


  if (!value) {
    return result;
  }


  const text =
    String(value);


  const bp =
    text.match(
      /BP:\s*([^|]+)/i
    );


  const pulse =
    text.match(
      /Pulse:\s*([^|]+)/i
    );


  const spo2 =
    text.match(
      /SpO[₂2]?:\s*([^|%]+)/i
    );


  const temperature =
    text.match(
      /Temperature:\s*([^|°]+)/i
    );


  const weight =
    text.match(
      /Weight:\s*([^|a-zA-Z]+)/i
    );


  const height =
    text.match(
      /Height:\s*([^|a-zA-Z]+)/i
    );


  if (bp) {
    result.bp =
      bp[1].trim();
  }

  if (pulse) {
    result.pulse =
      pulse[1].trim();
  }

  if (spo2) {
    result.spo2 =
      spo2[1].trim();
  }

  if (temperature) {
    result.temperature =
      temperature[1].trim();
  }

  if (weight) {
    result.weight =
      weight[1].trim();
  }

  if (height) {
    result.height =
      height[1].trim();
  }


  return result;

}

        "editPrescription",

        <h3>

      <div class="form-section">

        <h3>
          🧪 Lab Reports
        </h3>

        ${
          renderLabFiles(
            reports
          )
        }

      </div>


      ${editTextSection(
        "📝 Advice",
        "editAdvice",
        consultation.advice
      )}


      <div class="form-section">

        <h3>
          📅 Follow-up
        </h3>

        <div class="form-group">

          <input
            type="date"
            id="editFollowUp"

              consultation.follow_up_date ||

            )}">

        </div>

      <div class="action-row">

}

function buildEditedVitals() {

  const values = [

    [
      "BP",
      document
        .getElementById(
          "editBP"
        )
        .value
        .trim()
    ],

    [
      "Pulse",
      document
        .getElementById(
          "editPulse"
        )
        .value
        .trim()
    ],

    [
      "SpO₂",
      document
        .getElementById(
          "editSpO2"
        )
        .value
        .trim()
    ],

    [
      "Temperature",
      document
        .getElementById(
          "editTemperature"
        )
        .value
        .trim()
    ],

    [
      "Weight",
      document
        .getElementById(
          "editWeight"
        )
        .value
        .trim()
    ],

    [
      "Height",
      document
        .getElementById(
          "editHeight"
        )
        .value
        .trim()
    ]

  ];


  return values
    .filter(
      function(item) {

        return Boolean(
          item[1]
        );

      }
    )
    .map(
      function(item) {

        let suffix =
          "";


        if (
          item[0] ===
          "SpO₂"
        ) {
          suffix = "%";
        }


        if (
          item[0] ===
          "Temperature"
        ) {
          suffix = " °F";
        }


        if (
          item[0] ===
          "Weight"
        ) {
          suffix = " kg";
        }


        if (
          item[0] ===
          "Height"
        ) {
          suffix = " cm";
        }


        return (
          item[0] +
          ": " +
          item[1] +
          suffix
        );

      }
    )
    .join(
      " | "
    );

}


async function saveEditedConsultation(
  consultationId
) {

  const update = {

    chief_complaints:
      document
        .getElementById(
          "editChiefComplaints"
        )
        .value
        .trim(),

    vitals:
      buildEditedVitals(),

    examination:
      document
        .getElementById(
          "editExamination"
        )
        .value
        .trim(),

    diagnosis:
      document
        .getElementById(
          "editDiagnosis"
        )
        .value
        .trim(),

    investigations:
      document
        .getElementById(
          "editInvestigations"
        )
        .value
        .trim(),

    prescription:
      document
        .getElementById(
          "editPrescription"
        )
        .value
        .trim(),

    advice:
      document
        .getElementById(
          "editAdvice"
        )
        .value
        .trim(),

    follow_up_date:
      document
        .getElementById(
          "editFollowUp"
        )
        .value ||
      null

  };


  const {
    error
  } =
    await supabaseClient
      .from(
        "consultations"
      )
      .update(
        update
      )
      .eq(
        "id",
        consultationId
      );


  if (error) {

    alert(
      "Unable to update consultation:\n\n" +
      error.message
    );

    return;

  }


  alert(
    "Consultation updated successfully."
  );


  await refreshHistoryData();


  returnToHistory();

}


function returnToHistory() {

  showView(
    "historyView"
  );


  if (
    activeHistoryCategory ===
      "consultation" &&
    historyDisplayMode ===
      "records"
  ) {

    hideAllHistorySections();


    const menu =
      document.getElementById(
        "historyMenu"
      );


    const actions =
      document.getElementById(
        "historyMainActions"
      );


    if (menu) {

      menu.classList.add(
        "hidden"
      );

    }


    if (actions) {

      actions.classList.add(
        "hidden"
      );

    }


    document
      .getElementById(
        "consultationHistorySection"
      )
      .classList.add(
        "open"
      );


    renderActiveHistoryRecords();


    updateHistoryURL(
      "records"
    );


    return;

  }


  openHistorySection(
    "consultation"
  );

}

function closeFileModal() {

    .getElementById(

    );

    .getElementById(
      "fileModalContent"
    )

   ========================================================= */

async function refreshHistoryData() {

  await Promise.all([

    loadConsultations(),

    loadPrescriptionImages(),

    loadLabReports(),

    loadBills()

  ]);


  updateCounts();


  if (
    historyDisplayMode ===
      "records" &&
    activeHistoryCategory
  ) {

    renderActiveHistoryRecords();

  } else if (
    historyDisplayMode ===
      "selector" &&
    activeHistoryCategory
  ) {

    renderHistorySelector(
      activeHistoryCategory
    );

  }

}

   ========================================================= */

(async function initializePage() {

  const loggedIn =
    await checkDoctorLogin();


  if (!loggedIn) {
    return;
  }


  /*
     IMPORTANT:
     Read return URL before rendering.
  */

  readHistoryReturnURL();


  currentPatientId =
    getPatientIdFromURL();


  if (!currentPatientId) {

    alert(
      "Patient ID is missing."
    );


    window.location.href =
      "doctor-patients.html";


    return;

  }


  const patientLoaded =
    await loadPatient();


  if (!patientLoaded) {
    return;
  }


  await refreshHistoryData();


  showView(
    "historyView"
  );


  restoreHistoryStateFromURL();

})();
