<style>

/* =========================================================
   GENERAL
   ========================================================= */

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #f5f7fb;
  color: #172033;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",

    sans-serif;
}

button,
input,
textarea,
select {
  font-family: inherit;
}

.doctor-dashboard {
  min-height: 100vh;
  padding: 16px 10px 45px;
}

.history-page {
  width: 100%;

  margin: 0 auto;
}


/* =========================================================
   HEADER
   ========================================================= */

.portal-header {
  text-align: center;
  margin-bottom: 18px;
}

.section-label {

  font-size: 12px;
  font-weight: 850;

}

.portal-header h1 {
  margin: 4px 0;

}

.portal-subtitle {
  margin: 5px 0 0;
  color: #697386;
  font-size: 14px;
}


/* =========================================================
   VIEWS
   ========================================================= */

.portal-view {
  display: none;
}

.portal-view.active {
  display: block;
}


/* =========================================================
   CARD
   ========================================================= */

.portal-card {
  margin-bottom: 14px;
  padding: 18px;
  background: #ffffff;
  border: 1px solid #e3e8ef;
  border-radius: 18px;
  box-shadow:

}

.portal-card h2,

}


/* =========================================================
   PATIENT HEADER
   ========================================================= */

.patient-header {

  margin-bottom: 14px;

      #eef6ff,

    );
  border: 1px solid #d4e5fb;
  border-radius: 16px;
}

.patient-name {
  font-size: 22px;

}

.patient-meta {
  margin-top: 6px;
  color: #596579;

}


/* =========================================================
   BUTTONS
   ========================================================= */

.portal-button {

  padding: 10px 14px;

  align-items: center;
  justify-content: center;
  border: none;

}

.primary-button {

}

.warning-button {

}

.danger-button {

}

.success-button {

}

.purple-button {

.secondary-button {

.light-button {

.small-button {

.action-row {

  gap: 8px;

}


/* =========================================================
   MAIN HISTORY BUTTONS
   ========================================================= */

.history-menu {

/* =========================================================

.pdf-frame {

/* =========================================================

</style>

<script>

/* =========================================================
   SUPABASE
   ========================================================= */

const SUPABASE_URL =
  "https://twdmvdqqckcpwoccvtkj.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
  "sb_publishable_qDvT0t7pC5l5kbKl9QirMg_JbBrvUyI";

const supabaseClient =
  supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
  );


/* =========================================================
   STATE
   ========================================================= */

let currentPatient =
  null;

let currentPatientId =
  null;

let currentConsultationId =
  null;

let allConsultations =
  [];

let allPrescriptionImages =
  [];

let allLabReports =
  [];


/* =========================================================
   HELPERS
   ========================================================= */

function escapeHTML(value) {

  if (
    value === null ||
    value === undefined
  ) {
    return "";
  }

  return String(value)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


function showView(viewId) {

  document
    .querySelectorAll(
      ".portal-view"
    )
    .forEach(
      function(view) {

        view.classList.remove(
          "active"
        );

      }
    );


  const view =
    document.getElementById(
      viewId
    );


  if (view) {
    view.classList.add(
      "active"
    );
  }


  window.scrollTo({
    top: 0,
    behavior: "smooth"
  });

}


function formatDate(value) {

  if (!value) {
    return "-";
  }


  const date =
    new Date(
      String(value).length === 10
        ? value + "T00:00:00"
        : value
    );


  if (
    Number.isNaN(
      date.getTime()
    )
  ) {
    return value;
  }


  return date.toLocaleDateString(
    "en-IN",
    {
      day: "2-digit",
      month: "short",
      year: "numeric"
    }
  );

}


function formatDateTime(value) {

  if (!value) {
    return "-";
  }


  const date =
    new Date(value);


  if (
    Number.isNaN(
      date.getTime()
    )
  ) {
    return "-";
  }


  return date.toLocaleString(
    "en-IN",
    {
      day: "2-digit",
      month: "short",
      year: "numeric",
      hour: "numeric",
      minute: "2-digit"
    }
  );

}


function getTodayString() {

  const date =
    new Date();


  return (
    date.getFullYear() +
    "-" +
    String(
      date.getMonth() + 1
    ).padStart(
      2,
      "0"
    ) +
    "-" +
    String(
      date.getDate()
    ).padStart(
      2,
      "0"
    )
  );

}


function calculateAge(patient) {

  if (
    patient.age !== null &&
    patient.age !== undefined &&
    patient.age !== ""
  ) {

    return patient.age;

  }


  if (!patient.date_of_birth) {
    return "-";
  }


  const dob =
    new Date(
      patient.date_of_birth +
      "T00:00:00"
    );


  const today =
    new Date();


  let age =
    today.getFullYear() -
    dob.getFullYear();


  const difference =
    today.getMonth() -
    dob.getMonth();


  if (
    difference < 0 ||
    (
      difference === 0 &&
      today.getDate() <
      dob.getDate()
    )
  ) {

    age--;

  }


  return age;

}


/* =========================================================
   LOGIN
   ========================================================= */

async function checkDoctorLogin() {

  const {
    data: {
      session
    }
  } =
    await supabaseClient
      .auth
      .getSession();


  if (!session) {

    window.location.href =
      "doctor-login.html";

    return false;

  }


  return true;

}


async function logoutDoctor() {

  await supabaseClient
    .auth
    .signOut();


  window.location.href =
    "doctor-login.html";

}


/* =========================================================
   URL
   ========================================================= */

function getPatientIdFromURL() {

  const params =
    new URLSearchParams(
      window.location.search
    );


  const patientId =
    params.get(
      "patient_id"
    );


  if (!patientId) {
    return null;
  }


  return Number(
    patientId
  );

}


/* =========================================================
   BACK
   ========================================================= */

function backToPatientSearch() {

  window.location.href =
    "doctor-patients.html";

}


/* =========================================================
   LOAD PATIENT
   ========================================================= */

async function loadPatient() {

  const {
    data,
    error
  } =
    await supabaseClient
      .from("patients")
      .select("*")
      .eq(
        "id",
        currentPatientId
      )
      .single();


  if (
    error ||
    !data
  ) {

    document
      .getElementById(
        "patientHeader"
      )
      .innerHTML = `

        <div class="portal-message">
          Unable to load patient.
        </div>

      `;


    return false;

  }


  currentPatient =
    data;


  document
    .getElementById(
      "patientHeader"
    )
    .innerHTML = `

      <div class="patient-name">

        👤
        ${escapeHTML(
          data.patient_name ||
          "-"
        )}

      </div>


      <div class="patient-meta">

        🆔 Patient ID:
        ${escapeHTML(
          data.id
        )}

        <br>

        🎂 Age:
        ${escapeHTML(
          calculateAge(
            data
          )
        )}

        ${
          data.gender
            ? `

              &nbsp; • &nbsp;
              ${escapeHTML(
                data.gender
              )}

            `
            : ""
        }

        <br>

        📞
        ${escapeHTML(
          data.patient_phone ||
          "-"
        )}

      </div>

    `;


  return true;

}


/* =========================================================
   LOAD CONSULTATIONS
   ========================================================= */

async function loadConsultations() {

  const {
    data,
    error
  } =
    await supabaseClient
      .from("consultations")
      .select("*")
      .eq(
        "patient_id",
        currentPatientId
      )
      .order(
        "created_at",
        {
          ascending: false
        }
      );


  if (error) {

    console.error(
      error
    );

    allConsultations =
      [];

    return;

  }


  allConsultations =
    (
      data ||
      []
    )
    .filter(
      function(consultation) {

        return (
          consultation.chief_complaints !==
          "__DIRECT_PRESCRIPTION_UPLOAD__"
        );

      }
    );

}


/* =========================================================
   LOAD PRESCRIPTION IMAGES
   ========================================================= */

async function loadPrescriptionImages() {

  const {
    data:
      consultations
  } =
    await supabaseClient
      .from("consultations")
      .select(
        "id,created_at,prescription_image_url,chief_complaints"
      )
      .eq(
        "patient_id",
        currentPatientId
      )
      .order(
        "created_at",
        {
          ascending: false
        }
      );


  const allPatientConsultations =
    consultations ||
    [];


  const consultationIds =
    allPatientConsultations
      .map(
        function(item) {

          return item.id;

        }
      );


  let imageRows =
    [];


  if (
    consultationIds.length > 0
  ) {

    const {
      data
    } =
      await supabaseClient
        .from(
          "consultation_images"
        )
        .select("*")
        .in(
          "consultation_id",
          consultationIds
        );


    imageRows =
      data ||
      [];

  }


  const images =
    [];


  allPatientConsultations
    .forEach(
      function(consultation) {

        const matching =
          imageRows
            .filter(
              function(image) {

                return (
                  String(
                    image.consultation_id
                  ) ===
                  String(
                    consultation.id
                  )
                );

              }
            );


        matching
          .forEach(
            function(image) {

              images.push({

                id:
                  image.id,

                consultation_id:
                  consultation.id,

                image_url:
                  image.image_url,

                created_at:
                  consultation.created_at,

                legacy:
                  false

              });

            }
          );


        const legacy =
          consultation
            .prescription_image_url;


        if (
          legacy &&
          !matching.some(
            function(image) {

              return (
                image.image_url ===
                legacy
              );

            }
          )
        ) {

          images.push({

            id:
              null,

            consultation_id:
              consultation.id,

            image_url:
              legacy,

            created_at:
              consultation.created_at,

            legacy:
              true

          });

        }

      }
    );


  images.sort(
    function(a,b) {

      return (
        new Date(
          b.created_at
        ) -
        new Date(
          a.created_at
        )
      );

    }
  );


  allPrescriptionImages =
    images;

}

/* =========================================================
   PRESCRIPTION DOWNLOAD
   ========================================================= */

async function downloadPrescription(
  encodedURL,
  number
) {

  const url =
    decodeURIComponent(
      encodedURL
    );


  try {

    const response =
      await fetch(
        url
      );


    if (!response.ok) {
      throw new Error();
    }


    const blob =
      await response.blob();


    const blobURL =
      URL.createObjectURL(
        blob
      );


    const link =
      document.createElement(
        "a"
      );


    link.href =
      blobURL;


    link.download =
      "Prescription-" +
      number +
      ".jpg";


    document.body.appendChild(
      link
    );


    link.click();


    link.remove();


    setTimeout(
      function() {

        URL.revokeObjectURL(
          blobURL
        );

      },
      1000
    );


  } catch (error) {

    alert(
      "Unable to download prescription."
    );

  }

}


/* =========================================================
   PRESCRIPTION STORAGE PATH
   ========================================================= */

function getPrescriptionPath(
  imageURL
) {

  try {

    const url =
      new URL(
        imageURL
      );


    const marker =
      "/storage/v1/object/public/prescriptions/";


    const index =
      url.pathname.indexOf(
        marker
      );


    if (
      index === -1
    ) {
      return null;
    }


    return decodeURIComponent(
      url.pathname.substring(
        index +
        marker.length
      )
    );


  } catch (error) {

    return null;

  }

}


/* =========================================================
   DELETE PRESCRIPTION
   ========================================================= */

async function deletePrescription(
  imageId,
  encodedURL,
  consultationId,
  legacy
) {

  if (
    !confirm(
      "Delete this prescription image permanently?"
    )
  ) {
    return;
  }


  const imageURL =
    decodeURIComponent(
      encodedURL
    );


  if (
    imageId !== null &&
    imageId !== undefined
  ) {

    const {
      error
    } =
      await supabaseClient
        .from(
          "consultation_images"
        )
        .delete()
        .eq(
          "id",
          imageId
        );


    if (error) {

      alert(
        "Unable to delete prescription image."
      );

      return;

    }

  }


  const {
    data:
      consultation
  } =
    await supabaseClient
      .from(
        "consultations"
      )
      .select(
        "prescription_image_url"
      )
      .eq(
        "id",
        consultationId
      )
      .single();


  if (
    legacy ||
    (
      consultation &&
      consultation.prescription_image_url ===
      imageURL
    )
  ) {

    const {
      data:
        remaining
    } =
      await supabaseClient
        .from(
          "consultation_images"
        )
        .select("*")
        .eq(
          "consultation_id",
          consultationId
        )
        .order(
          "id",
          {
            ascending: true
          }
        );


    const nextImage =
      remaining &&
      remaining.length > 0
        ? remaining[0]
            .image_url
        : null;


    await supabaseClient
      .from(
        "consultations"
      )
      .update({

        prescription_image_url:
          nextImage

      })
      .eq(
        "id",
        consultationId
      );

  }


  const path =
    getPrescriptionPath(
      imageURL
    );


  if (path) {

    await supabaseClient
      .storage
      .from(
        "prescriptions"
      )
      .remove([
        path
      ]);

  }


  alert(
    "Prescription image deleted."
  );


  await refreshHistoryData();

}

  `;

}

async function saveEditedConsultation(

) {

  const update = {

    chief_complaints:
      document
        .getElementById(
          "editChiefComplaints"
        )
        .value
        .trim(),

    vitals:
      document
        .getElementById(
          "editVitals"
        )
        .value
        .trim(),

    examination:
      document
        .getElementById(
          "editExamination"
        )
        .value
        .trim(),

    diagnosis:
      document
        .getElementById(
          "editDiagnosis"
        )
        .value
        .trim(),

    investigations:
      document
        .getElementById(
          "editInvestigations"
        )
        .value
        .trim(),

    prescription:
      document
        .getElementById(
          "editPrescription"
        )
        .value
        .trim(),

    advice:
      document
        .getElementById(
          "editAdvice"
        )
        .value
        .trim(),

    follow_up_date:
      document
        .getElementById(
          "editFollowUp"
        )
        .value ||
      null

  };


  const {
    error
  } =
    await supabaseClient
      .from(
        "consultations"
      )
      .update(
        update
      )
      .eq(
        "id",
        consultationId
      );


  if (error) {

    alert(
      "Unable to update consultation:\n\n" +
      error.message
    );

    return;

  }


  alert(
    "Consultation updated successfully."
  );


  await refreshHistoryData();


  returnToHistory();

}


/* =========================================================
   ADD PRESCRIPTION
   ========================================================= */

function addPrescriptionImages(
  consultationId
) {

  const input =
    document.createElement(
      "input"
    );


  input.type =
    "file";


  input.accept =
    "image/jpeg,image/png,image/webp";


  input.multiple =
    true;


  input.onchange =
    async function() {

      const files =
        Array.from(
          input.files ||
          []
        );


      if (
        files.length === 0
      ) {
        return;
      }


      try {

        for (
          let i = 0;
          i < files.length;
          i++
        ) {

          const file =
            files[i];


          const safeName =
            file.name.replace(
              /[^a-zA-Z0-9._-]/g,
              "_"
            );


          const path =
            "patient-" +
            currentPatientId +
            "/" +
            consultationId +
            "/" +
            Date.now() +
            "-" +
            i +
            "-" +
            safeName;


          const {
            error:
              uploadError
          } =
            await supabaseClient
              .storage
              .from(
                "prescriptions"
              )
              .upload(
                path,
                file,
                {
                  upsert:
                    false,

                  contentType:
                    file.type
                }
              );


          if (uploadError) {
            throw uploadError;
          }


          const {
            data:
              publicData
          } =
            supabaseClient
              .storage
              .from(
                "prescriptions"
              )
              .getPublicUrl(
                path
              );


          const {
            error:
              insertError
          } =
            await supabaseClient
              .from(
                "consultation_images"
              )
              .insert({

                consultation_id:
                  consultationId,

                image_url:
                  publicData.publicUrl

              });


          if (insertError) {
            throw insertError;
          }

        }


        alert(
          "Prescription image uploaded successfully."
        );


        await refreshHistoryData();


        openEditConsultation(
          consultationId
        );


      } catch (error) {

        console.error(
          error
        );


        alert(
          "Unable to upload prescription."
        );

      }

    };


  input.click();

}


/* =========================================================
   ADD LAB
   ========================================================= */

function addLabReports(
  consultationId
) {

  const reportType =
    prompt(
      "Enter report type:",
      "Laboratory Report"
    );


  if (!reportType) {
    return;
  }


  const input =
    document.createElement(
      "input"
    );


  input.type =
    "file";


  input.accept =
    "image/jpeg,image/png,image/webp,application/pdf";


  input.multiple =
    true;


  input.onchange =
    async function() {

      const files =
        Array.from(
          input.files ||
          []
        );


      if (
        files.length === 0
      ) {
        return;
      }


      try {

        for (
          let i = 0;
          i < files.length;
          i++
        ) {

          const file =
            files[i];


          const safeName =
            file.name.replace(
              /[^a-zA-Z0-9._-]/g,
              "_"
            );


          const path =
            "patient-" +
            currentPatientId +
            "/" +
            getTodayString() +
            "/" +
            consultationId +
            "-" +
            Date.now() +
            "-" +
            i +
            "-" +
            safeName;


          const {
            error:
              uploadError
          } =
            await supabaseClient
              .storage
              .from(
                "investigation-reports"
              )
              .upload(
                path,
                file,
                {
                  upsert:
                    false,

                  contentType:
                    file.type
                }
              );


          if (uploadError) {
            throw uploadError;
          }


          const {
            error:
              insertError
          } =
            await supabaseClient
              .from(
                "investigation_reports"
              )
              .insert({

                patient_id:
                  currentPatientId,

                consultation_id:
                  consultationId,

                report_date:
                  getTodayString(),

                report_type:
                  reportType,

                file_name:
                  file.name,

                file_path:
                  path,

                file_type:
                  file.type,

                file_size:
                  file.size

              });


          if (insertError) {

            await supabaseClient
              .storage
              .from(
                "investigation-reports"
              )
              .remove([
                path
              ]);


            throw insertError;

          }

        }


        alert(
          "Lab report uploaded successfully."
        );


        await refreshHistoryData();


        openEditConsultation(
          consultationId
        );


      } catch (error) {

        console.error(
          error
        );


        alert(
          "Unable to upload lab report."
        );

      }

    };


  input.click();

}

/* =========================================================
   MODAL
   ========================================================= */

function openImageModal(
  url,
  title
) {

  document
    .getElementById(
      "fileModalTitle"
    )
    .textContent =
      title ||
      "Image";


  document
    .getElementById(
      "fileModalContent"
    )
    .innerHTML = `

      <img
        src="${escapeHTML(
          url
        )}"
        alt="${escapeHTML(
          title ||
          "Image"
        )}">

    `;


  document
    .getElementById(
      "fileModal"
    )
    .classList.add(
      "active"
    );

}


function openPDFModal(
  url,
  title
) {

  document
    .getElementById(
      "fileModalTitle"
    )
    .textContent =
      title ||
      "PDF";


  document
    .getElementById(
      "fileModalContent"
    )
    .innerHTML = `

      <iframe
        class="pdf-frame"
        src="${escapeHTML(
          url
        )}">
      </iframe>

    `;


  document
    .getElementById(
      "fileModal"
    )
    .classList.add(
      "active"
    );

}


function closeFileModal() {

  document
    .getElementById(
      "fileModal"
    )
    .classList.remove(
      "active"
    );


  document
    .getElementById(
      "fileModalContent"
    )
    .innerHTML =
      "";

}

async function refreshHistoryData() {

  await Promise.all([

    loadConsultations(),

    loadPrescriptionImages(),

    loadLabReports()

  ]);


  updateCounts();

  renderConsultationHistory();

  renderPrescriptionHistory();

  renderLabHistory();

}

(async function initializePage() {

  const loggedIn =
    await checkDoctorLogin();


  if (!loggedIn) {
    return;
  }


  currentPatientId =
    getPatientIdFromURL();


  if (!currentPatientId) {

    alert(
      "Patient ID is missing."
    );


    window.location.href =
      "doctor-patients.html";


    return;

  }


  const patientLoaded =
    await loadPatient();


  if (!patientLoaded) {
    return;
  }


  await refreshHistoryData();


  showView(
    "historyView"
  );

})();
