<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

  <title>Appointments | General & Diabetes Care</title>

  <link rel="stylesheet" href="styles.css">

</head>

<body>

  <section class="doctor-dashboard">

    <div class="dashboard-card">

      <p class="section-label">
        GENERAL &amp; DIABETES CARE
      </p>

      <h1>Appointments</h1>

      <p class="dashboard-welcome">
        Doctor appointment management
      </p>
<div class="appointment-form">

  <h2>Add Appointment</h2>

  <input
    type="text"
    id="patientName"
    placeholder="Patient Name"
    required>

  <input
    type="tel"
    id="patientPhone"
    placeholder="Patient Phone Number"
    required>

  <input
    type="date"
    id="appointmentDate"
    required>

  <select
  id="appointmentTime"
  required>

  <option value="">Select time</option>

  <option value="18:00">6:00–6:30 PM</option>
<option value="18:30">6:30–7:00 PM</option>
  <option value="19:00">7:00–7:30 PM</option>
<option value="19:30">7:30–8:00 PM</option>
  <option value="20:00">8:00–8:30 PM</option>
<option value="20:30">8:30–9:00 PM</option>

  </select>

  <select id="appointmentType">

    <option value="">
      Select Appointment Type
    </option>

    <option value="New Consultation">
      New Consultation
    </option>

    <option value="Follow-up">
      Follow-up
    </option>

    <option value="Diabetes Review">
      Diabetes Review
    </option>

    <option value="General Consultation">
      General Consultation
    </option>

  </select>

  <textarea
    id="appointmentNotes"
    placeholder="Notes (optional)">
  </textarea>

  <button
    type="button"
    class="doctor-login-button"
    id="saveAppointment">

    💾 Save Appointment

  </button>

</div>
<div class="appointments-list">

  <h2>Upcoming Appointments</h2>

  <div id="appointmentsContainer">

    <p>
      Login required to view appointments.
    </p>

  </div>
<!-- Patient Profile Modal -->

<div id="patientModal" class="patient-modal">

  <div class="patient-modal-content">

    <button
      type="button"
      id="closePatientModal"
      class="patient-modal-close">

      ✖

    </button>

    <h2>👤 Patient Profile</h2>

    <div id="patientProfileContent">

      Loading patient details...

    </div>
<div class="patient-profile-actions">

  <button
    type="button"
    id="editPatientButton"
    class="doctor-login-button">

    ✏️ Edit Patient

  </button>

</div>
  </div>

</div>
</div>
      <div class="dashboard-item">

        📅

        <strong>
          Appointment Management
        </strong>

        <span>
          Appointment management will be added here.
        </span>

      </div>


      <br>


      <a
        href="doctor-dashboard.html"
        class="doctor-login-button">

        ← Back to Dashboard

      </a>
      <button
  type="button"
  class="doctor-login-button"
  id="appointmentsLogoutButton">

  🔒 Logout

      </button>

    </div>

  </section>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL = "https://twdmvdqqckcpwoccvtkj.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
  "sb_publishable_qDvT0t7pC5l5kbKl9QirMg_JbBrvUyI";

const supabaseClient = supabase.createClient(
  SUPABASE_URL,
  SUPABASE_PUBLISHABLE_KEY
);


async function checkDoctorLogin() {

  const { data: { session } } =
    await supabaseClient.auth.getSession();

  if (!session) {

    window.location.href =
      "doctor-login.html";

  }

}


checkDoctorLogin();
document
  .getElementById("saveAppointment")
  .addEventListener("click", async function () {

    const patientName =
      document.getElementById("patientName").value.trim();

    const patientPhone =
      document.getElementById("patientPhone").value.trim();

    const appointmentDate =
      document.getElementById("appointmentDate").value;

    const appointmentTime =
      document.getElementById("appointmentTime").value;

    const appointmentType =
      document.getElementById("appointmentType").value;

    const notes =
      document.getElementById("appointmentNotes").value.trim();


    if (
      !patientName ||
      !patientPhone ||
      !appointmentDate ||
      !appointmentTime ||
      !appointmentType
    ) {

      alert("Please fill in all required fields.");

      return;
    }

const { count, error: countError } =
  await supabaseClient
    .from("appointments")
    .select("*", { count: "exact", head: true })
    .eq("appointment_date", appointmentDate)
    .eq("appointment_time", appointmentTime);

if (countError) {
  alert("Unable to check slot availability.");
  return;
}

if (count >= 5) {
  alert("This appointment slot is full. Please choose another time.");
  return;
}
    const { error } =
      await supabaseClient
        .from("appointments")
        .insert([
          {
            patient_name: patientName,
            patient_phone: patientPhone,
            appointment_date: appointmentDate,
            appointment_time: appointmentTime,
            appointment_type: appointmentType,
            notes: notes
          }
        ]);


    if (error) {

      console.error(error);

      alert("Unable to save appointment.");

      return;
    }


    alert("Appointment saved successfully.");

});
  async function loadAppointments() {

  const container =
    document.getElementById("appointmentsContainer");

  const { data, error } =
    await supabaseClient
      .from("appointments")
      .select("*")
      .order("appointment_date", {
        ascending: true
      })
      .order("appointment_time", {
        ascending: true
      });


  if (error) {

    console.error(error);

    container.innerHTML =
      "<p>Unable to load appointments.</p>";

    return;
  }


  if (!data || data.length === 0) {

    container.innerHTML =
      "<p>No appointments found.</p>";

    return;
  }

container.innerHTML = "";

data.forEach(function (appointment) {

  const appointmentCard =
    document.createElement("div");

  appointmentCard.className =
    "appointment-card";

  appointmentCard.innerHTML = `

    <strong>
      ${appointment.patient_name}
    </strong>

    <span>
      📞 ${appointment.patient_phone}
    </span>

    <span>
      📅 ${appointment.appointment_date}
    </span>

    <span>
      🕐 ${appointment.appointment_time}
    </span>

    <span>
      🩺 ${appointment.appointment_type}
    </span>

    ${
      appointment.notes
        ? `<span>📝 ${appointment.notes}</span>`
        : ""
    }

    <span>
      📌 Status: ${appointment.status}
    </span>

    `;
// View Patient button
const viewPatientButton =
  document.createElement("button");

viewPatientButton.textContent =
  "👤 View Patient";

viewPatientButton.onclick = function () {

  if (!appointment.patient_id) {
    alert("Patient record is not linked to this appointment.");
    return;
  }

  viewPatient(appointment.patient_id);

};

appointmentCard.appendChild(
  viewPatientButton
);
  // Add action buttons only for Pending appointments
if (appointment.status === "Pending") {

  // Create Complete button
  const completeButton =
    document.createElement("button");

  completeButton.textContent =
    "✅ Complete";

  completeButton.onclick = async function () {

    const { error } =
      await supabaseClient
        .from("appointments")
        .update({
          status: "Completed"
        })
        .eq("id", appointment.id);

    if (error) {
      alert("Unable to complete appointment");
      console.error(error);
      return;
    }

    loadAppointments();

  };


  // Create Cancel button
  const cancelButton =
    document.createElement("button");

  cancelButton.textContent =
    "❌ Cancel";

  cancelButton.onclick = async function () {

    const confirmCancel =
      confirm(
        "Are you sure you want to cancel this appointment?"
      );

    if (!confirmCancel) {
      return;
    }

    const { error } =
      await supabaseClient
        .from("appointments")
        .update({
          status: "Cancelled"
        })
        .eq("id", appointment.id);

    if (error) {
      alert("Unable to cancel appointment");
      console.error(error);
      return;
    }

    loadAppointments();

  };


  // Add buttons to appointment card
  appointmentCard.appendChild(
    completeButton
  );

  appointmentCard.appendChild(
    cancelButton
  );

}


  container.appendChild(appointmentCard);

});
  
}

async function viewPatient(patientId) {

  const { data: patient, error } =
    await supabaseClient
      .from("patients")
      .select("*")
      .eq("id", patientId)
      .single();

  if (error) {

    console.error(
      "Error loading patient:",
      error
    );

    alert("Unable to load patient details.");

    return;
  }

  const content =
    document.getElementById(
      "patientProfileContent"
    );

  content.innerHTML = `

    <div class="patient-profile-section">

      <h3>👤 Personal Information</h3>

      <p>
        <strong>Name:</strong>
        ${patient.patient_name || "-"}
      </p>

      <p>
        <strong>📞 Phone:</strong>
        ${patient.patient_phone || "-"}
      </p>

      <p>
        <strong>🎂 Date of Birth:</strong>
        ${patient.date_of_birth || "-"}
      </p>

      <p>
        <strong>Gender:</strong>
        ${patient.gender || "-"}
      </p>

      <p>
        <strong>🩸 Blood Group:</strong>
        ${patient.blood_group || "-"}
      </p>

    </div>

    <hr>

    <div class="patient-profile-section">

      <h3>🩺 Clinical History</h3>

      <p>
        <strong>Chief Complaints:</strong><br>
        ${patient.chief_complaints || "-"}
      </p>

      <p>
        <strong>Medical History:</strong><br>
        ${patient.medical_history || "-"}
      </p>

      <p>
        <strong>Surgical History:</strong><br>
        ${patient.surgical_history || "-"}
      </p>

      <p>
        <strong>⚠️ Allergies:</strong><br>
        ${patient.allergies || "-"}
      </p>

      <p>
        <strong>💊 Current Medications:</strong><br>
        ${patient.current_medications || "-"}
      </p>

      <p>
        <strong>📝 Notes:</strong><br>
        ${patient.notes || "-"}
      </p>

    </div>

  `;


  document.getElementById(
    "editPatientButton"
  ).onclick = function () {

    editPatient(patient);

  };


  document.getElementById(
    "patientModal"
  ).style.display = "flex";

}function editPatient(patient) {
document.getElementById(
  "editPatientButton"
).style.display = "none";
  const content =
    document.getElementById(
      "patientProfileContent"
    );

  content.innerHTML = `

    <div class="patient-profile-section">

      <h3>👤 Personal Information</h3>

      <label>Name</label>

      <input
        type="text"
        id="editPatientName"
        value="${patient.patient_name || ""}">

      <label>Phone</label>

      <input
        type="tel"
        id="editPatientPhone"
        value="${patient.patient_phone || ""}">

      <label>Date of Birth</label>

      <input
        type="date"
        id="editPatientDOB"
        value="${patient.date_of_birth || ""}">

      <label>Gender</label>

      <select id="editPatientGender">

        <option value="">
          Select gender
        </option>

        <option value="Male"
          ${patient.gender === "Male" ? "selected" : ""}>
          Male
        </option>

        <option value="Female"
          ${patient.gender === "Female" ? "selected" : ""}>
          Female
        </option>

        <option value="Other"
          ${patient.gender === "Other" ? "selected" : ""}>
          Other
        </option>

      </select>

      <label>Blood Group</label>

      <input
        type="text"
        id="editBloodGroup"
        value="${patient.blood_group || ""}">

    </div>


    <hr>


    <div class="patient-profile-section">

      <h3>🩺 Clinical History</h3>

      <label>Chief Complaints</label>

      <textarea
        id="editChiefComplaints">${patient.chief_complaints || ""}</textarea>

      <label>Medical History</label>

      <textarea
        id="editMedicalHistory">${patient.medical_history || ""}</textarea>

      <label>Surgical History</label>

      <textarea
        id="editSurgicalHistory">${patient.surgical_history || ""}</textarea>

      <label>Allergies</label>

      <textarea
        id="editAllergies">${patient.allergies || ""}</textarea>

      <label>Current Medications</label>

      <textarea
        id="editMedications">${patient.current_medications || ""}</textarea>

      <label>Notes</label>

      <textarea
        id="editPatientNotes">${patient.notes || ""}</textarea>

    </div>


    <button
      type="button"
      class="doctor-login-button"
      id="savePatientButton">

      💾 Save Changes

    </button>

    <button
      type="button"
      class="doctor-login-button"
      id="cancelEditButton">

      ↩️ Cancel

    </button>

  `;

document
  .getElementById("cancelEditButton")
  .onclick = function () {

    document.getElementById(
      "editPatientButton"
    ).style.display = "block";

    viewPatient(patient.id);

  };
  
document
  .getElementById("savePatientButton")
  .onclick = function () {

    savePatientChanges(patient.id);

  };

  

}async function savePatientChanges(patientId) {

  const updatedPatient = {

    patient_name:
      document.getElementById("editPatientName").value.trim(),

    patient_phone:
      document.getElementById("editPatientPhone").value.trim(),

    date_of_birth:
      document.getElementById("editPatientDOB").value || null,

    gender:
      document.getElementById("editPatientGender").value || null,

    blood_group:
      document.getElementById("editBloodGroup").value.trim(),

    chief_complaints:
      document.getElementById("editChiefComplaints").value.trim(),

    medical_history:
      document.getElementById("editMedicalHistory").value.trim(),

    surgical_history:
      document.getElementById("editSurgicalHistory").value.trim(),

    allergies:
      document.getElementById("editAllergies").value.trim(),

    current_medications:
      document.getElementById("editMedications").value.trim(),

    notes:
      document.getElementById("editPatientNotes").value.trim()

  };


  if (!updatedPatient.patient_name) {

    alert("Patient name is required.");

    return;

  }


  const { error } =
    await supabaseClient
      .from("patients")
      .update(updatedPatient)
      .eq("id", patientId);


  if (error) {

    console.error(
      "Error updating patient:",
      error
    );

    alert(
      "Unable to save patient details."
    );

    return;
  }


  alert(
    "Patient details updated successfully."
  );

document.getElementById(
  "editPatientButton"
).style.display = "block";
  viewPatient(patientId);

}
  document
  .getElementById("closePatientModal")
  .onclick = function () {

    document.getElementById(
      "patientModal"
    ).style.display = "none";

  };
  
loadAppointments();
  async function protectAppointments() {

  const { data: { session } } =
    await supabaseClient.auth.getSession();

  if (!session) {

    window.location.href = "doctor-login.html";

  }

} 

protectAppointments();
  document
  .getElementById("appointmentsLogoutButton")
  .addEventListener("click", async function () {

    await supabaseClient.auth.signOut();

    window.location.href = "doctor-login.html";

  });
 const appointmentDate =
  document.getElementById("appointmentDate");

const today =
  new Date();

const todayString =
  today.toISOString().split("T")[0];

appointmentDate.min =
  todayString; 
  const appointmentTime =
  document.getElementById("appointmentTime");
 appointmentDate.addEventListener(
  "change",
  function () {

    const selectedDate =
      new Date(this.value + "T00:00:00");

    const day =
      selectedDate.getDay();

    if (day === 0) {

      alert(
        "Appointments are not available on Sundays."
      );
      this.value = "";

    }

  }
); 
      appointmentDate.addEventListener(
  "change",
  async function () {

    const selectedDate =
      this.value;

    if (!selectedDate) {
      return;
    }

    const { data, error } =
      await supabaseClient
        .from("appointments")
        .select("appointment_time")
        .eq("appointment_date", selectedDate);

    if (error) {

      console.error(error);

      return;
    }

    const slotCounts = {};

data.forEach(function (appointment) {

  const time =
    appointment.appointment_time.substring(0, 5);

  slotCounts[time] =
    (slotCounts[time] || 0) + 1;

});    Array.from(
      appointmentTime.options
    ).forEach(function (option) {

      if (option.value === "") {
        return;
      }

      const count =
        slotCounts[option.value] || 0;

      option.disabled =
        count >= 5;

      const timeLabels = {
        "18:00": "6:00–6:30 PM",
        "18:30": "6:30–7:00 PM",
        "19:00": "7:00–7:30 PM",
        "19:30": "7:30–8:00 PM",
        "20:00": "8:00–8:30 PM",
        "20:30": "8:30–9:00 PM"
      };

      option.textContent =
        timeLabels[option.value] +
        " — " +
        count +
        "/5";

    });

  }
);

      
</script>
</body>
