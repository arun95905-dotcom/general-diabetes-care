<script>

/* =========================================================
   CONFIG
   ========================================================= */

const SUPABASE_URL =
  "https://twdmvdqqckcpwoccvtkj.supabase.co";


const SUPABASE_PUBLISHABLE_KEY =
  "sb_publishable_qDvT0t7pC5l5kbKl9QirMg_JbBrvUyI";


const supabaseClient =
  supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
  );


/* =========================================================
   STATE
   ========================================================= */

let currentPatient =
  null;


let currentConsultationId =
  null;


let selectedPrescriptionFiles =
  [];


let selectedLabFiles =
  [];


/* =========================================================
   HELPERS
   ========================================================= */

function escapeHTML(value) {

  if (
    value === null ||
    value === undefined
  ) {
    return "";
  }


  return String(value)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


function showView(viewId) {

  document
    .querySelectorAll(
      ".portal-view"
    )
    .forEach(
      function(view) {

        view.classList.remove(
          "active"
        );

      }
    );


  const target =
    document.getElementById(
      viewId
    );


  if (target) {

    target.classList.add(
      "active"
    );

  }


  window.scrollTo({
    top: 0,
    behavior: "smooth"
  });

}


function formatDate(value) {

  if (!value) {
    return "-";
  }


  const date =
    new Date(
      String(value).length === 10
        ? value + "T00:00:00"
        : value
    );


  if (
    Number.isNaN(
      date.getTime()
    )
  ) {

    return value;

  }


  return date.toLocaleDateString(
    "en-IN",
    {
      day: "2-digit",
      month: "short",
      year: "numeric"
    }
  );

}


function formatTime(value) {

  if (!value) {
    return "-";
  }


  const date =
    new Date(value);


  if (
    Number.isNaN(
      date.getTime()
    )
  ) {

    return "-";

  }


  return date.toLocaleTimeString(
    "en-IN",
    {
      hour: "numeric",
      minute: "2-digit"
    }
  );

}


function getTodayString() {

  const date =
    new Date();


  return (
    date.getFullYear() +
    "-" +
    String(
      date.getMonth() + 1
    ).padStart(
      2,
      "0"
    ) +
    "-" +
    String(
      date.getDate()
    ).padStart(
      2,
      "0"
    )
  );

}


function calculateAge(
  patient
) {

  if (
    patient.age !== null &&
    patient.age !== undefined &&
    patient.age !== ""
  ) {

    return patient.age;

  }


  if (!patient.date_of_birth) {
    return "-";
  }


  const dob =
    new Date(
      patient.date_of_birth +
      "T00:00:00"
    );


  const today =
    new Date();


  let age =
    today.getFullYear() -
    dob.getFullYear();


  const difference =
    today.getMonth() -
    dob.getMonth();


  if (
    difference < 0 ||
    (
      difference === 0 &&
      today.getDate() <
      dob.getDate()
    )
  ) {

    age--;

  }


  return age;

}


/* =========================================================
   LOGIN
   ========================================================= */

async function checkDoctorLogin() {

  const {
    data: {
      session
    }
  } =
    await supabaseClient
      .auth
      .getSession();


  if (!session) {

    window.location.href =
      "doctor-login.html";

    return false;

  }


  return true;

}


async function logoutDoctor() {

  await supabaseClient
    .auth
    .signOut();


  window.location.href =
    "doctor-login.html";

}


/* =========================================================
   PATIENT
   ========================================================= */

async function getPatient(
  patientId
) {

  const {
    data,
    error
  } =
    await supabaseClient
      .from("patients")
      .select("*")
      .eq(
        "id",
        patientId
      )
      .single();


  if (
    error ||
    !data
  ) {

    alert(
      "Unable to load patient."
    );

    return null;

  }


  return data;

}


/* =========================================================
   SEARCH
   ========================================================= */

async function searchPatients() {

  const search =
    document
      .getElementById(
        "patientSearch"
      )
      .value
      .trim();


  const container =
    document.getElementById(
      "patientSearchResults"
    );


  if (!search) {

    container.innerHTML = `

      <div class="portal-message">
        Enter Patient ID, name or phone number.
      </div>

    `;

    return;

  }


  container.innerHTML = `

    <div class="portal-message">
      🔎 Searching...
    </div>

  `;


  let query =
    supabaseClient
      .from("patients")
      .select("*");


  if (
    /^\d+$/.test(
      search
    )
  ) {

    query =
      query.or(
        "id.eq." +
        search +
        ",patient_phone.ilike.%" +
        search +
        "%,patient_name.ilike.%" +
        search +
        "%"
      );

  } else {

    query =
      query.or(
        "patient_name.ilike.%" +
        search +
        "%,patient_phone.ilike.%" +
        search +
        "%"
      );

  }


  const {
    data,
    error
  } =
    await query
      .order(
        "patient_name",
        {
          ascending: true
        }
      );


  if (error) {

    container.innerHTML = `

      <div class="portal-message">
        Unable to search patients.
      </div>

    `;

    return;

  }


  if (
    !data ||
    data.length === 0
  ) {

    container.innerHTML = `

      <div class="portal-message">
        No patients found.
      </div>

    `;

    return;

  }


  container.innerHTML =
    data.map(
      function(patient) {

        return `

          <div class="patient-result">

            <div class="patient-result-name">

              👤
              ${escapeHTML(
                patient.patient_name
              )}

            </div>


            <div class="patient-result-meta">

              🆔 ID:
              ${escapeHTML(
                patient.id
              )}

              <br>

              🎂 Age:
              ${escapeHTML(
                calculateAge(
                  patient
                )
              )}

              &nbsp; • &nbsp;

              ⚧
              ${escapeHTML(
                patient.gender || "-"
              )}

              <br>

              📞
              ${escapeHTML(
                patient.patient_phone || "-"
              )}

            </div>


            <div class="action-row">

              <button
                type="button"
                class="portal-button primary-button small-button"
                onclick="openPatientHistory(
                  ${Number(
                    patient.id
                  )}
                )">

                🩺 Consultation History

              </button>

            </div>

          </div>

        `;

      }
    ).join("");

}


/* =========================================================
   OPEN PATIENT HISTORY
   ========================================================= */

async function openPatientHistory(
  patientId
) {

  const patient =
    await getPatient(
      patientId
    );


  if (!patient) {
    return;
  }


  currentPatient =
    patient;


  const container =
    document.getElementById(
      "historyContent"
    );


  container.innerHTML = `

    <div class="portal-message">
      Loading consultation history...
    </div>

  `;


  showView(
    "historyView"
  );


  const {
    data:
      consultations,
    error
  } =
    await supabaseClient
      .from("consultations")
      .select("*")
      .eq(
        "patient_id",
        patientId
      )
      .order(
        "created_at",
        {
          ascending: false
        }
      );


  if (error) {

    container.innerHTML = `

      <div class="portal-message">
        Unable to load consultation history.
      </div>

    `;

    return;

  }


  const normalConsultations =
    (
      consultations || []
    )
    .filter(
      function(consultation) {

        return (
          consultation.chief_complaints !==
          "__DIRECT_PRESCRIPTION_UPLOAD__"
        );

      }
    );


  let consultationHTML = `

    <div class="portal-message">
      No previous consultations found.
    </div>

  `;


  if (
    normalConsultations.length > 0
  ) {

    consultationHTML =
      normalConsultations
        .map(
          function(consultation) {

            return renderConsultationCard(
              consultation
            );

          }
        )
        .join("");

  }


  const urlParams =
    new URLSearchParams(
      window.location.search
    );


  const directPatient =
    urlParams.get(
      "patient_id"
    );


  container.innerHTML = `

    <div class="view-header">

      <h2>
        🩺 Consultation History
      </h2>


      <button
        type="button"
        class="portal-button light-button"
        onclick="${
          directPatient
            ? "window.location.href='doctor-patients.html'"
            : "showView('searchView')"
        }">

        ← Back

      </button>

    </div>


    <div class="patient-header">

      <div class="patient-name">

        👤
        ${escapeHTML(
          patient.patient_name
        )}

      </div>


      <div class="patient-meta">

        Patient ID:
        <strong>
          ${escapeHTML(
            patient.id
          )}
        </strong>

        &nbsp; • &nbsp;

        Age:
        <strong>
          ${escapeHTML(

function viewPrescription(
  encodedURL
) {

  const url =
    decodeURIComponent(
      encodedURL
    );


  openImageModal(
    url,
    "Prescription"
  );

}


async function downloadPrescription(
  encodedURL,
  number
) {

  const url =
    decodeURIComponent(
      encodedURL
    );


  try {

    const response =
      await fetch(
        url
      );


    if (!response.ok) {

      throw new Error(
        "Unable to download."
      );

    }


    const blob =
      await response.blob();


    const blobURL =
      URL.createObjectURL(
        blob
      );


    const link =
      document.createElement(
        "a"
      );


    link.href =
      blobURL;


    link.download =
      "Prescription-" +
      number +
      ".jpg";


    document.body.appendChild(
      link
    );


    link.click();


    link.remove();


    setTimeout(
      function() {

        URL.revokeObjectURL(
          blobURL
        );

      },
      1000
    );


  } catch (error) {

    alert(
      "Unable to download prescription."
    );

  }

}


function getPrescriptionPath(
  imageURL
) {

  try {

    const url =
      new URL(
        imageURL
      );


    const marker =
      "/storage/v1/object/public/prescriptions/";


    const index =
      url.pathname.indexOf(
        marker
      );


    if (
      index === -1
    ) {
      return null;
    }


    return decodeURIComponent(
      url.pathname.substring(
        index +
        marker.length
      )
    );


  } catch (error) {

    return null;

  }

}


async function deletePrescription(
  imageId,
  encodedURL,
  consultationId
) {

  if (
    !confirm(
      "Delete this prescription image permanently?"
    )
  ) {

    return;

  }


  const imageURL =
    decodeURIComponent(
      encodedURL
    );


  const {
    error
  } =
    await supabaseClient
      .from(
        "consultation_images"
      )
      .delete()
      .eq(
        "id",
        imageId
      );


  if (error) {

    alert(
      "Unable to delete prescription."
    );

    return;

  }


  const path =
    getPrescriptionPath(
      imageURL
    );


  if (path) {

    await supabaseClient
      .storage
      .from(
        "prescriptions"
      )
      .remove([
        path
      ]);

  }


  alert(
    "Prescription deleted."
  );


  await loadFullConsultation(
    consultationId
  );

}

async function getLabReport(

      )
      .select("*")

  if (

  ) {

  }

}


async function getLabSignedURL(
  report
) {

  const {
    data,
    error
  } =
    await supabaseClient
      .storage
      .from(
        "investigation-reports"
      )
      .createSignedUrl(
        report.file_path,
        60 * 60
      );


  if (
    error ||
    !data
  ) {

    return null;

  }


  return data.signedUrl;

}


async function viewLabReport(
  reportId
) {

  const report =
    await getLabReport(
      reportId
    );


  if (!report) {

    alert(
      "Unable to load report."
    );

    return;

  }


  const signedURL =
    await getLabSignedURL(
      report
    );


  if (!signedURL) {

    alert(
      "Unable to open report."
    );

    return;

  }


  const isPDF =
    report.file_type ===
    "application/pdf" ||
    (
      report.file_name || ""
    )
    .toLowerCase()
    .endsWith(
      ".pdf"
    );


  if (isPDF) {

    openPDFModal(
      signedURL,
      report.report_type ||
      "Lab Report"
    );

  } else {

    openImageModal(
      signedURL,
      report.report_type ||
      "Lab Report"
    );

  }

}


async function downloadLabReport(
  reportId
) {

  const report =
    await getLabReport(
      reportId
    );


  if (!report) {
    return;
  }


  const signedURL =
    await getLabSignedURL(
      report
    );


  if (!signedURL) {
    return;
  }


  try {

    const response =
      await fetch(
        signedURL
      );


    if (!response.ok) {

      throw new Error();

    }


    const blob =
      await response.blob();


    const blobURL =
      URL.createObjectURL(
        blob
      );


    const link =
      document.createElement(
        "a"
      );


    link.href =
      blobURL;


    link.download =
      report.file_name ||
      "lab-report";


    document.body.appendChild(
      link
    );


    link.click();


    link.remove();


    setTimeout(
      function() {

        URL.revokeObjectURL(
          blobURL
        );

      },
      1000
    );


  } catch (error) {

    alert(
      "Unable to download report."
    );

  }

}


async function deleteLabReport(
  reportId,
  consultationId
) {

  if (
    !confirm(
      "Delete this lab report permanently?"
    )
  ) {

    return;

  }


  const report =
    await getLabReport(
      reportId
    );


  if (!report) {
    return;
  }


  await supabaseClient
    .storage
    .from(
      "investigation-reports"
    )
    .remove([
      report.file_path
    ]);


  const {
    error
  } =
    await supabaseClient
      .from(
        "investigation_reports"
      )
      .delete()
      .eq(
        "id",
        reportId
      );


  if (error) {

    alert(
      "Unable to delete report."
    );

    return;

  }


  alert(
    "Lab report deleted."
  );


  await loadFullConsultation(
    consultationId
  );

}

  const vitals = [];

  const pulse =
    document

        "newPulse"

      .trim();


  const temperature =

        "newTemperature"

        "newWeight"
      )

      .trim();


  const height =

  if (bp) {

  }

  if (spo2) {

      spo2 +

  }

  if (temperature) {
    vitals.push(
      "Temperature: " +
      temperature +
      " °F"
    );
  }

  if (weight) {
    vitals.push(
      "Weight: " +
      weight +
      " kg"
    );
  }

  if (height) {
    vitals.push(
      "Height: " +
      height +

    );
  }


  const consultation = {

    patient_id:
      patientId,

    chief_complaints:
      document
        .getElementById(
          "newChiefComplaints"
        )
        .value
        .trim(),

    vitals:
      vitals.join(
        " | "

      document
        .getElementById(
          "newExamination"
        )
        .value
        .trim(),

    diagnosis:
      document
        .getElementById(
          "newDiagnosis"
        )
        .value
        .trim(),

    investigations:
      document
        .getElementById(
          "newInvestigations"
        )
        .value
        .trim(),

    prescription:
      document
        .getElementById(
          "newPrescription"
        )
        .value
        .trim(),

    advice:
      document
        .getElementById(
          "newAdvice"
        )
        .value
        .trim(),

    follow_up_date:
      document
        .getElementById(
          "newFollowUp"
        )
        .value ||

  };


  const {
    data,
    error
  } =
    await supabaseClient
      .from("consultations")
      .insert(
        consultation
      )
      .select()
      .single();


  if (error) {

    button.disabled =
      false;


    button.textContent =
      "💾 Save Consultation";


    alert(

      error.message

    return;

  const prescriptionFiles =
    Array.from(

        .getElementById(
          "newPrescriptionFiles"

    );


  const labFiles =
    Array.from(

        .getElementById(

        .files ||
      []

  try {

    await uploadPrescriptionFiles(
      patientId,

    await uploadLabFiles(
      patientId,
      data.id,
      labFiles,
      document
        .getElementById(

        .value
    );


  } catch (uploadError) {

    alert(
      "Consultation saved, but one or more files could not be uploaded:\n\n" +
      uploadError.message
    );

  }


  button.disabled =
    false;


  button.textContent =
    "💾 Save Consultation";


  await showSavedConsultation(
    patientId,
    data.id
  );

}


/* =========================================================
   PRESCRIPTION UPLOAD
   ========================================================= */

async function uploadPrescriptionFiles(
  patientId,
  consultationId,
  files
) {

  for (
    let index = 0;
    index < files.length;
    index++
  ) {

    const file =
      files[index];


    if (
      !file.type.startsWith(
        "image/"
      )
    ) {

      continue;

    }


    const safeName =
      file.name.replace(
        /[^a-zA-Z0-9._-]/g,
        "_"
      );


    const path =
      "patient-" +
      patientId +
      "/" +
      consultationId +
      "/" +
      Date.now() +
      "-" +
      index +
      "-" +
      safeName;


    const {
      error:
        uploadError
    } =
      await supabaseClient
        .storage
        .from(
          "prescriptions"
        )
        .upload(
          path,
          file,
          {
            upsert: false,
            contentType:
              file.type
          }
        );


    if (uploadError) {

      throw uploadError;

    }


    const {
      data:
        publicData
    } =
      supabaseClient
        .storage
        .from(
          "prescriptions"
        )
        .getPublicUrl(
          path
        );


    const {
      error:
        insertError
    } =
      await supabaseClient
        .from(
          "consultation_images"
        )
        .insert({

          consultation_id:
            consultationId,

          image_url:
            publicData.publicUrl

        });


    if (insertError) {

      throw insertError;

    }

  }

}


/* =========================================================
   LAB UPLOAD
   ========================================================= */

async function uploadLabFiles(
  patientId,
  consultationId,
  files,
  reportType
) {

  for (
    let index = 0;
    index < files.length;
    index++
  ) {

    const file =
      files[index];


    const allowed = [

      "image/jpeg",
      "image/png",
      "image/webp",
      "application/pdf"

    ];


    if (
      !allowed.includes(
        file.type
      )
    ) {

      continue;

    }


    const safeName =
      file.name.replace(
        /[^a-zA-Z0-9._-]/g,
        "_"
      );


    const path =
      "patient-" +
      patientId +
      "/" +
      getTodayString() +
      "/" +
      consultationId +
      "-" +
      Date.now() +
      "-" +
      index +
      "-" +
      safeName;


    const {
      error:
        uploadError
    } =
      await supabaseClient
        .storage
        .from(
          "investigation-reports"
        )
        .upload(
          path,
          file,
          {
            upsert: false,
            contentType:
              file.type
          }
        );


    if (uploadError) {

      throw uploadError;

    }


    const {
      error:
        insertError
    } =
      await supabaseClient
        .from(
          "investigation_reports"
        )
        .insert({

          patient_id:
            patientId,

          consultation_id:
            consultationId,

          report_date:
            getTodayString(),

          report_type:
            reportType,

          file_name:
            file.name,

          file_path:
            path,

          file_type:
            file.type,

          file_size:
            file.size

        });


    if (insertError) {

      await supabaseClient
        .storage
        .from(
          "investigation-reports"
        )
        .remove([
          path
        ]);


      throw insertError;

    }

  }

}

      patientId

async function loadPatientFromURL() {

  const params =
    new URLSearchParams(
      window.location.search

  const patientId =
    params.get(
      "patient_id"
    );


  if (!patientId) {

    return false;

  }


  await openPatientHistory(
    Number(
      patientId
    )
  );


  return true;

}
