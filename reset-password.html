<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

  <title>Reset Password | General & Diabetes Care</title>

  <link rel="stylesheet" href="styles.css">

</head>

<body>

  <section class="doctor-dashboard">

    <div class="dashboard-card">

      <h1>Reset Doctor Password</h1>

      <p class="dashboard-welcome">
        Create a new password for the Doctor Portal.
      </p>

      <input
        type="password"
        id="newPassword"
        placeholder="New Password"
        minlength="8"
        required>

      <br><br>

      <input
        type="password"
        id="confirmPassword"
        placeholder="Confirm New Password"
        minlength="8"
        required>

      <br><br>

      <button
        type="button"
        class="doctor-login-button"
        id="updatePasswordButton">

        🔐 Update Password

      </button>

      <p id="resetMessage"></p>

    </div>

  </section>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>

    const SUPABASE_URL =
      "https://twdmvdqqckcpwoccvtkj.supabase.co";

    const SUPABASE_PUBLISHABLE_KEY =
      "sb_publishable_qDvT0t7pC5l5kbKl9QirMg_JbBrvUyI";

    const supabaseClient =
      supabase.createClient(
        SUPABASE_URL,
        SUPABASE_PUBLISHABLE_KEY
      );


    document
      .getElementById("updatePasswordButton")
      .addEventListener("click", async function () {

        const password =
          document
            .getElementById("newPassword")
            .value;

        const confirmPassword =
          document
            .getElementById("confirmPassword")
            .value;

        const message =
          document
            .getElementById("resetMessage");


        if (password.length < 8) {

          message.textContent =
            "Password must contain at least 8 characters.";

          return;

        }


        if (password !== confirmPassword) {

          message.textContent =
            "Passwords do not match.";

          return;

        }


        const { error } =
          await supabaseClient.auth.updateUser({
            password: password
          });


        if (error) {

          console.error(error);

          message.textContent =
            "Unable to update password.";

          return;

        }


        message.textContent =
          "Password updated successfully. Redirecting...";


        setTimeout(function () {

          window.location.href =
            "doctor-login.html";

        }, 1500);

      });

  </script>

</body>

</html>
