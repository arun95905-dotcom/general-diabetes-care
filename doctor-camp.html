<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>Medical Camp | General & Diabetes Care</title>
<link rel="stylesheet" href="styles.css">
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f7fb;color:#172033;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}.page{max-width:1050px;margin:auto;padding:18px 10px 45px}.head{margin-bottom:18px}.label{margin:0;color:#2563eb;font-size:12px;font-weight:850;letter-spacing:1.3px}.head h1{margin:4px 0}.sub{margin:0;color:#697386;font-size:14px}.view{display:none}.view.active{display:block}.card{margin-bottom:14px;padding:18px;background:#fff;border:1px solid #e4e9f0;border-radius:18px;box-shadow:0 5px 20px rgba(20,31,56,.06)}.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.menu{min-height:150px;padding:20px;text-align:left;background:linear-gradient(145deg,#fff,#f8fafc);border:1px solid #dfe6ef;border-radius:17px;cursor:pointer}.menu:hover{transform:translateY(-2px);box-shadow:0 8px 22px rgba(20,31,56,.08)}.icon{display:block;font-size:31px;margin-bottom:8px}.title{display:block;font-size:17px;font-weight:850}.desc{display:block;margin-top:5px;color:#6b7280;font-size:13px}.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}.btn{min-height:42px;padding:10px 14px;border:0;border-radius:11px;cursor:pointer;font-size:14px;font-weight:750;text-decoration:none;display:inline-flex;align-items:center;justify-content:center}.primary{background:#2563eb;color:#fff}.success{background:#15803d;color:#fff}.secondary{background:#64748b;color:#fff}.light{background:#f1f5f9;color:#172033;border:1px solid #dce3ec}.danger{background:#dc3545;color:#fff}.purple{background:#7447d8;color:#fff}.section{margin:13px 0;padding:15px;background:#f8fafc;border:1px solid #e4e9ef;border-radius:14px}.section h3{margin:0 0 14px}.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}.fg{display:flex;flex-direction:column}.full{grid-column:1/-1}.fg label{margin-bottom:6px;font-size:13px;font-weight:750}.fg input,.fg select,.fg textarea{width:100%;padding:11px 12px;background:#fff;border:1px solid #cbd5e1;border-radius:10px;font:inherit}.fg textarea{min-height:85px;resize:vertical}.radio-row{display:flex;gap:16px;flex-wrap:wrap;align-items:center}.hidden{display:none!important}.headerrow{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:14px}.headerrow h2{margin:0}.message{padding:18px;text-align:center;color:#697386;background:#f8fafc;border-radius:12px}.result{padding:14px;margin-top:10px;border:1px solid #e2e8f0;border-radius:14px;background:#fff}.result strong{font-size:17px}.meta{margin-top:5px;color:#657084;font-size:13px;line-height:1.7}.statgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}.stat{padding:14px;border:1px solid #e2e8f0;border-radius:13px;background:#fff}.stat b{display:block;font-size:24px}.stat span{font-size:12px;color:#64748b}.analytics-table{width:100%;border-collapse:collapse}.analytics-table th,.analytics-table td{text-align:left;padding:9px;border-bottom:1px solid #e5e7eb}.test-row{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;margin-top:8px}.camp-banner{padding:14px;background:#eef6ff;border:1px solid #d8e7fa;border-radius:14px;margin-bottom:14px}.camp-banner strong{font-size:18px}.small{font-size:12px;color:#64748b}.loading{position:fixed;inset:0;background:rgba(245,247,251,.97);display:flex;align-items:center;justify-content:center;z-index:9999;font-weight:750}.screen-row{display:grid;grid-template-columns:1fr 1fr;gap:13px}.screen-box{padding:12px;background:#fff;border:1px solid #e2e8f0;border-radius:12px}.screen-box h4{margin:0 0 9px}.list-toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}.list-toolbar input{flex:1;min-width:200px;padding:11px;border:1px solid #cbd5e1;border-radius:10px}@media(max-width:750px){.grid3,.formgrid,.statgrid,.screen-row{grid-template-columns:1fr}.full{grid-column:auto}.test-row{grid-template-columns:1fr}.menu{min-height:120px}}
</style>
</head>
<body>
<div id="loading" class="loading">Securing Medical Camp Portal...</div>
<section class="page">
<div class="head"><p class="label">GENERAL &amp; DIABETES CARE</p><h1>🏕️ Medical Camp</h1><p class="sub">Manage medical camps, patient registrations and camp analytics</p></div>

<div id="homeView" class="view active"><div class="card"><div class="grid3">
<button class="menu" onclick="showView('createView')"><span class="icon">➕</span><span class="title">Create Camp</span><span class="desc">Create and configure a new camp</span></button>
<button class="menu" onclick="showView('searchView')"><span class="icon">🔍</span><span class="title">Search Camp</span><span class="desc">Search for a camp by date</span></button>
<button class="menu" onclick="openAllCamps()"><span class="icon">📋</span><span class="title">All Camps</span><span class="desc">View all registered camps</span></button>
</div></div><div class="actions"><a class="btn light" href="doctor-dashboard.html">← Back to Dashboard</a><button class="btn secondary" onclick="logout()">🔒 Logout</button></div></div>

<div id="createView" class="view"><div class="card"><div class="headerrow"><h2>➕ Create New Camp</h2><button class="btn light" onclick="showView('homeView')">← Back</button></div>
<div class="section"><h3>Camp Details</h3><div class="formgrid"><div class="fg"><label>Camp Name *</label><input id="campName"></div><div class="fg"><label>Camp Date *</label><input id="campDate" type="date"></div><div class="fg full"><label>Venue *</label><input id="campVenue" value="General & Diabetes Care"></div><div class="fg full"><label>Notes</label><textarea id="campNotes"></textarea></div></div></div>
<div class="section"><h3>🧪 Special Blood Test Package</h3><div class="fg"><label>Package available for this camp?</label><select id="packageAvailable" onchange="togglePackageFields()"><option value="false">No</option><option value="true">Yes</option></select></div><div id="packageFields" class="formgrid hidden" style="margin-top:13px"><div class="fg"><label>Package Name *</label><input id="packageName" value="Special Blood Test Package"></div><div class="fg"><label>Package Price *</label><input id="packagePrice" type="number" min="0" step="0.01"></div><div class="fg full"><label>Tests Included * (manual entry)</label><textarea id="packageTests" placeholder="Hb, FBS, PPBS, Free T4, TSH, Vitamin D & Urine Microalbumin"></textarea></div></div></div>
<div class="actions"><button class="btn primary" onclick="createCamp()">Create Camp</button><button class="btn light" onclick="showView('homeView')">Cancel</button></div></div></div>

<div id="searchView" class="view"><div class="card"><div class="headerrow"><h2>🔍 Search Camp</h2><button class="btn light" onclick="showView('homeView')">← Back</button></div><div class="formgrid"><div class="fg"><label>Camp Date</label><input type="date" id="searchCampDate"></div></div><div class="actions"><button class="btn primary" onclick="searchCamp()">Search</button></div><div id="searchCampResults" style="margin-top:14px"><div class="message">Select a camp date.</div></div></div></div>

<div id="allView" class="view"><div class="card"><div class="headerrow"><h2>📋 All Camps</h2><button class="btn light" onclick="showView('homeView')">← Back</button></div><div id="allCampResults"><div class="message">Loading...</div></div></div></div>

<div id="campView" class="view"><div id="campDashboard"></div></div>
<div id="registerView" class="view"><div id="registerContent"></div></div>
<div id="patientsView" class="view"><div id="patientsContent"></div></div>
<div id="analyticsView" class="view"><div id="analyticsContent"></div></div>
</section>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL="https://twdmvdqqckcpwoccvtkj.supabase.co";
const SUPABASE_PUBLISHABLE_KEY="sb_publishable_qDvT0t7pC5l5kbKl9QirMg_JbBrvUyI";
const supabaseClient=supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);
let currentCamp=null, additionalTestCounter=0, selectedExistingPatient=null;
const esc=v=>String(v??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#039;");
const fmt=d=>d?new Date(d+"T00:00:00").toLocaleDateString("en-IN",{day:"2-digit",month:"short",year:"numeric"}):"-";
function showView(id){document.querySelectorAll('.view').forEach(x=>x.classList.remove('active'));document.getElementById(id).classList.add('active');window.scrollTo({top:0,behavior:'smooth'});}
function togglePackageFields(){document.getElementById('packageFields').classList.toggle('hidden',document.getElementById('packageAvailable').value!=="true");}
async function createCamp(){const name=campName.value.trim(),date=campDate.value,venue=campVenue.value.trim(),available=packageAvailable.value==="true";if(!name||!date||!venue)return alert('Camp name, date and venue are required.');if(available&&(!packageName.value.trim()||!packageTests.value.trim()||!packagePrice.value))return alert('Enter package name, tests included and price.');const {data,error}=await supabaseClient.from('medical_camps').insert({camp_name:name,camp_date:date,venue,notes:campNotes.value.trim(),blood_package_available:available,blood_package_name:available?packageName.value.trim():null,blood_package_tests:available?packageTests.value.trim():null,blood_package_price:available?Number(packagePrice.value):null}).select().single();if(error)return alert('Unable to create camp:\n'+error.message);openCamp(data.id);}
function campCard(c){return `<div class="result"><strong>${esc(c.camp_name)}</strong><div class="meta">📅 ${fmt(c.camp_date)}<br>📍 ${esc(c.venue||'-')}</div><div class="actions"><button class="btn primary" onclick="openCamp(${c.id})">Open Camp</button></div></div>`}
async function searchCamp(){if(!searchCampDate.value)return alert('Select a camp date.');const {data,error}=await supabaseClient.from('medical_camps').select('*').eq('camp_date',searchCampDate.value).order('id',{ascending:false});searchCampResults.innerHTML=error?`<div class="message">${esc(error.message)}</div>`:data.length?data.map(campCard).join(''):'<div class="message">No camp found on this date.</div>';}
async function openAllCamps(){showView('allView');const {data,error}=await supabaseClient.from('medical_camps').select('*').order('camp_date',{ascending:false});allCampResults.innerHTML=error?`<div class="message">${esc(error.message)}</div>`:data.length?data.map(campCard).join(''):'<div class="message">No camps created yet.</div>';}
async function openCamp(id){const {data,error}=await supabaseClient.from('medical_camps').select('*').eq('id',id).single();if(error)return alert(error.message);currentCamp=data;const {count}=await supabaseClient.from('camp_patients').select('id',{count:'exact',head:true}).eq('camp_id',id);campDashboard.innerHTML=`<div class="card"><div class="headerrow"><h2>🏕️ ${esc(data.camp_name)}</h2><button class="btn light" onclick="showView('homeView')">← Medical Camp</button></div><div class="camp-banner"><strong>${fmt(data.camp_date)}</strong><div class="meta">📍 ${esc(data.venue||'-')}<br>Total Registered Patients: <b>${count||0}</b></div></div><div class="grid3"><button class="menu" onclick="openRegistration()"><span class="icon">➕</span><span class="title">Register Camp Patient</span></button><button class="menu" onclick="openCampPatients()"><span class="icon">👥</span><span class="title">Camp Patients</span><span class="desc">Search and view all patients</span></button><button class="menu" onclick="openAnalytics()"><span class="icon">📊</span><span class="title">Camp Analytics</span></button></div></div>`;showView('campView');}
function patientTypeChanged(){const existing=patientType.value==='Existing Clinic Patient';existingSearchBox.classList.toggle('hidden',!existing);if(!existing){selectedExistingPatient=null;existingPatientResult.innerHTML='';}}
async function searchExistingPatient(){const q=existingPatientSearch.value.trim();if(!q)return;let query=supabaseClient.from('patients').select('id,patient_name,patient_phone,age,gender,blood_group,address').limit(10);if(/^\d+$/.test(q))query=query.or(`id.eq.${q},patient_phone.ilike.%${q}%`);else query=query.ilike('patient_name',`%${q}%`);const {data,error}=await query;if(error)return alert(error.message);existingPatientResult.innerHTML=data?.length?data.map(p=>`<div class="result"><b>${esc(p.patient_name)}</b><div class="meta">ID ${p.id} · ${esc(p.patient_phone||'-')}</div><button class="btn primary" onclick='selectExistingPatient(${JSON.stringify(p).replace(/'/g,"&#39;")})'>Select</button></div>`).join(''):'<div class="message">No patient found.</div>';}
function selectExistingPatient(p){selectedExistingPatient=p;patientName.value=p.patient_name||'';patientPhone.value=p.patient_phone||'';patientAge.value=p.age??'';patientGender.value=p.gender||'';patientBloodGroup.value=p.blood_group||'';patientAddress.value=p.address||'';existingPatientResult.innerHTML=`<div class="message">Selected: <b>${esc(p.patient_name)}</b> · Patient ID ${p.id}</div>`;}
function addTestRow(name='',value=''){additionalTestCounter++;additionalTests.insertAdjacentHTML('beforeend',`<div class="test-row" id="testRow${additionalTestCounter}"><input class="test-name" placeholder="Test Name" value="${esc(name)}"><input class="test-value" placeholder="Result / Value" value="${esc(value)}"><button type="button" class="btn danger" onclick="document.getElementById('testRow${additionalTestCounter}').remove()">Remove</button></div>`);}
function openRegistration(){selectedExistingPatient=null;additionalTestCounter=0;registerContent.innerHTML=`<div class="card"><div class="headerrow"><h2>➕ Register Camp Patient</h2><button class="btn light" onclick="openCamp(${currentCamp.id})">← Back</button></div><div class="camp-banner"><strong>${esc(currentCamp.camp_name)}</strong><div class="meta">${fmt(currentCamp.camp_date)}</div></div>
<div class="section"><h3>👤 Patient Details</h3><div class="formgrid"><div class="fg"><label>Patient Type *</label><select id="patientType" onchange="patientTypeChanged()"><option>New Patient</option><option>Existing Clinic Patient</option></select></div><div class="fg"><label>Registration Date *</label><input id="registrationDate" type="date" value="${currentCamp.camp_date}"></div><div id="existingSearchBox" class="fg full hidden"><label>Search Existing Clinic Patient</label><div class="actions" style="margin:0"><input id="existingPatientSearch" placeholder="Patient ID / Name / Phone" style="flex:1;padding:11px;border:1px solid #cbd5e1;border-radius:10px"><button class="btn primary" onclick="searchExistingPatient()">Search</button></div><div id="existingPatientResult"></div></div><div class="fg"><label>Patient Name *</label><input id="patientName"></div><div class="fg"><label>Phone Number</label><input id="patientPhone"></div><div class="fg"><label>Age *</label><input id="patientAge" type="number" min="0" max="120"></div><div class="fg"><label>Gender *</label><select id="patientGender"><option value="">Select</option><option>Male</option><option>Female</option><option>Other</option></select></div><div class="fg"><label>Blood Group</label><input id="patientBloodGroup"></div><div class="fg full"><label>Full Address</label><textarea id="patientAddress"></textarea></div><div class="fg full"><label>Area / Locality *</label><input id="patientArea"></div></div></div>
<div class="section"><h3>📢 How did the patient know about this camp?</h3><div class="fg"><select id="campSource" onchange="sourceChanged()"><option value="">Select</option><option>Newspaper Advertisement</option><option>Direct Pamphlet Distribution</option><option>Referral by Clinic Patient</option><option>WhatsApp Group</option><option>Other</option></select></div><div id="referralBox" class="fg hidden" style="margin-top:10px"><label>Referring Patient Name / ID</label><input id="referringPatient"></div><div id="otherSourceBox" class="fg hidden" style="margin-top:10px"><label>Please Specify</label><input id="sourceOther"></div></div>
${currentCamp.blood_package_available?`<div class="section"><h3>🧪 ${esc(currentCamp.blood_package_name||'Special Blood Test Package')}</h3><div class="meta"><b>Tests Included:</b><br>${esc(currentCamp.blood_package_tests||'')}<br><br><b>Package Price:</b> ₹${Number(currentCamp.blood_package_price||0).toFixed(0)}</div><div class="fg" style="margin-top:12px"><label>Patient opted for package? *</label><select id="packageOpted"><option value="">Select</option><option value="true">Yes</option><option value="false">No</option></select></div></div>`:''}
<div class="section"><h3>🩺 Basic Screening</h3><div class="formgrid"><div class="fg"><label>Height (cm)</label><input id="height" type="number" step="0.1" oninput="calcBMI()"></div><div class="fg"><label>Weight (kg)</label><input id="weight" type="number" step="0.1" oninput="calcBMI()"></div><div class="fg"><label>BMI</label><input id="bmi" readonly></div><div class="fg"><label>Systolic BP (mmHg)</label><input id="sbp" type="number"></div><div class="fg"><label>Diastolic BP (mmHg)</label><input id="dbp" type="number"></div><div class="fg"><label>Pulse (/min)</label><input id="pulse" type="number"></div><div class="fg"><label>SpO₂ (%)</label><input id="spo2" type="number" step="0.1"></div></div></div>
<div class="section"><h3>🩸 Diabetes Screening</h3><div class="formgrid"><div class="fg"><label>Random Blood Sugar (mg/dL)</label><input id="rbs" type="number" step="0.1"></div><div class="fg"><label>HbA1c (%)</label><input id="hba1c" type="number" step="0.1"></div><div class="fg"><label>Known Diabetes?</label><select id="knownDiabetes"><option value="">Select</option><option value="true">Yes</option><option value="false">No</option></select></div><div class="fg"><label>Duration of Diabetes</label><input id="diabetesDuration"></div><div class="fg full"><label>Current Diabetes Treatment</label><textarea id="diabetesTreatment"></textarea></div></div></div>
<div class="section"><h3>🔬 Other Screening</h3><div class="screen-row"><div class="screen-box"><h4>Neuropathy Screening</h4><select id="neuropathy"><option value="">Select</option><option>Normal</option><option>Abnormal</option><option>Not Done</option></select><div class="fg" style="margin-top:8px"><label>Value / Notes</label><input id="neuropathyNotes"></div></div><div class="screen-box"><h4>Retinopathy Screening</h4><select id="retinopathy"><option value="">Select</option><option>Normal</option><option>Abnormal</option><option>Not Done</option></select><div class="fg" style="margin-top:8px"><label>Value / Notes</label><input id="retinopathyNotes"></div></div><div class="screen-box"><h4>BMD Screening</h4><select id="bmd"><option value="">Select</option><option>Normal</option><option>Osteopenia</option><option>Osteoporosis</option><option>Not Done</option></select><div class="fg" style="margin-top:8px"><label>Value / Notes</label><input id="bmdNotes"></div></div></div><h4 style="margin-bottom:5px">Additional Tests</h4><div id="additionalTests"></div><button type="button" class="btn light" style="margin-top:8px" onclick="addTestRow()">＋ Add Another Test</button></div>
<div class="section"><h3>👨‍⚕️ Doctor Assessment</h3><div class="formgrid"><div class="fg full"><label>Diagnosis / Clinical Impression</label><textarea id="diagnosis"></textarea></div><div class="fg full"><label>Advice</label><textarea id="advice"></textarea></div><div class="fg full"><label>Medicines Given</label><textarea id="medicines"></textarea></div><div class="fg"><label>Referral Required?</label><select id="referralRequired"><option value="false">No</option><option value="true">Yes</option></select></div><div class="fg"><label>Referral Details</label><input id="referralDetails"></div><div class="fg"><label>Follow-up Required?</label><select id="followupRequired"><option value="false">No</option><option value="true">Yes</option></select></div><div class="fg"><label>Follow-up Date</label><input id="followupDate" type="date"></div></div></div><div class="actions"><button class="btn primary" onclick="saveCampPatient(false)">💾 Save Patient</button><button class="btn success" onclick="saveCampPatient(true)">💾 Save & Register Next Patient</button><button class="btn light" onclick="openCamp(${currentCamp.id})">Cancel</button></div></div>`;showView('registerView');}
function sourceChanged(){referralBox.classList.toggle('hidden',campSource.value!=='Referral by Clinic Patient');otherSourceBox.classList.toggle('hidden',campSource.value!=='Other');}
function calcBMI(){const h=Number(height.value),w=Number(weight.value);bmi.value=h&&w?(w/((h/100)**2)).toFixed(1):'';}
const val=id=>document.getElementById(id)?.value?.trim()||'';const num=id=>val(id)?Number(val(id)):null;
async function saveCampPatient(next){if(!val('patientName')||!val('patientAge')||!val('patientGender')||!val('patientArea')||!val('registrationDate'))return alert('Patient name, age, gender, area/locality and registration date are required.');if(patientType.value==='Existing Clinic Patient'&&!selectedExistingPatient)return alert('Please search and select the existing clinic patient.');if(currentCamp.blood_package_available&&!val('packageOpted'))return alert('Select whether the patient opted for the blood test package.');const tests=[...document.querySelectorAll('.test-row')].map(r=>({name:r.querySelector('.test-name').value.trim(),value:r.querySelector('.test-value').value.trim()})).filter(x=>x.name||x.value);const {count}=await supabaseClient.from('camp_patients').select('id',{count:'exact',head:true}).eq('camp_id',currentCamp.id);const campNo=`C${String((count||0)+1).padStart(3,'0')}`;const obj={camp_id:currentCamp.id,camp_patient_number:campNo,registration_date:val('registrationDate'),patient_type:patientType.value,existing_patient_id:selectedExistingPatient?.id||null,regular_patient_id:selectedExistingPatient?.id||null,patient_name:val('patientName'),phone:val('patientPhone'),age:num('patientAge'),gender:val('patientGender'),blood_group:val('patientBloodGroup'),address:val('patientAddress'),area_locality:val('patientArea'),camp_source:val('campSource'),referring_patient:val('referringPatient'),source_other:val('sourceOther'),blood_package_opted:currentCamp.blood_package_available?(val('packageOpted')==='true'):null,height_cm:num('height'),weight_kg:num('weight'),bmi:num('bmi'),systolic_bp:num('sbp'),diastolic_bp:num('dbp'),pulse:num('pulse'),spo2:num('spo2'),rbs:num('rbs'),hba1c:num('hba1c'),known_diabetes:val('knownDiabetes')?val('knownDiabetes')==='true':null,diabetes_duration:val('diabetesDuration'),diabetes_treatment:val('diabetesTreatment'),neuropathy_result:val('neuropathy'),neuropathy_notes:val('neuropathyNotes'),retinopathy_result:val('retinopathy'),retinopathy_notes:val('retinopathyNotes'),bmd_result:val('bmd'),bmd_notes:val('bmdNotes'),additional_tests:tests,diagnosis:val('diagnosis'),advice:val('advice'),medicines_given:val('medicines'),referral_required:val('referralRequired')==='true',referral_details:val('referralDetails'),followup_required:val('followupRequired')==='true',followup_date:val('followupDate')||null};const {error}=await supabaseClient.from('camp_patients').insert(obj);if(error)return alert('Unable to save camp patient:\n'+error.message);alert(`Camp patient ${campNo} saved.`);next?openRegistration():openCamp(currentCamp.id);}
async function openCampPatients(){const {data,error}=await supabaseClient.from('camp_patients').select('*').eq('camp_id',currentCamp.id).order('id',{ascending:true});if(error)return alert(error.message);patientsContent.innerHTML=`<div class="card"><div class="headerrow"><h2>👥 Camp Patients</h2><button class="btn light" onclick="openCamp(${currentCamp.id})">← Back</button></div><div class="camp-banner"><strong>${esc(currentCamp.camp_name)}</strong><div class="meta">${fmt(currentCamp.camp_date)} · Total ${data.length}</div></div><div class="list-toolbar"><input id="campPatientFilter" placeholder="Search Camp ID / Name / Phone / Area" oninput="filterCampPatients()"></div><div id="campPatientList">${renderPatients(data)}</div></div>`;window._campPatients=data;showView('patientsView');}
function renderPatients(data){return data.length?data.map(p=>`<div class="result camp-patient-item" data-search="${esc([p.camp_patient_number,p.patient_name,p.phone,p.area_locality].join(' ').toLowerCase())}"><strong>${esc(p.camp_patient_number||p.id)} · ${esc(p.patient_name)}</strong><div class="meta">${esc(p.age??'-')} / ${esc(p.gender||'-')} · ${esc(p.phone||'-')}<br>📍 ${esc(p.area_locality||'-')} · Package: ${p.blood_package_opted===true?'Yes':p.blood_package_opted===false?'No':'-'}</div><details style="margin-top:9px"><summary>View Full Details</summary><div class="meta" style="margin-top:9px"><b>Address:</b> ${esc(p.address||'-')}<br><b>Camp Source:</b> ${esc(p.camp_source||'-')} ${p.source_other?'('+esc(p.source_other)+')':''}<br><b>BP:</b> ${esc(p.systolic_bp??'-')}/${esc(p.diastolic_bp??'-')} · <b>BMI:</b> ${esc(p.bmi??'-')}<br><b>RBS:</b> ${esc(p.rbs??'-')} · <b>HbA1c:</b> ${esc(p.hba1c??'-')}<br><b>Neuropathy:</b> ${esc(p.neuropathy_result||'-')} ${p.neuropathy_notes?'— '+esc(p.neuropathy_notes):''}<br><b>Retinopathy:</b> ${esc(p.retinopathy_result||'-')} ${p.retinopathy_notes?'— '+esc(p.retinopathy_notes):''}<br><b>BMD:</b> ${esc(p.bmd_result||'-')} ${p.bmd_notes?'— '+esc(p.bmd_notes):''}<br><b>Additional Tests:</b> ${esc((p.additional_tests||[]).map(x=>`${x.name}: ${x.value}`).join('; ')||'-')}<br><b>Diagnosis:</b> ${esc(p.diagnosis||'-')}<br><b>Advice:</b> ${esc(p.advice||'-')}<br><b>Medicines:</b> ${esc(p.medicines_given||'-')}</div></details></div>`).join(''):'<div class="message">No camp patients registered.</div>';}
function filterCampPatients(){const q=campPatientFilter.value.trim().toLowerCase();document.querySelectorAll('.camp-patient-item').forEach(x=>x.style.display=x.dataset.search.includes(q)?'block':'none');}
function group(data,key){const m={};data.forEach(p=>{let v=(p[key]||'Not Entered').trim?.()||p[key]||'Not Entered';m[v]=(m[v]||0)+1});return m;}function groupTable(title,obj,total){return `<div class="section"><h3>${title}</h3><table class="analytics-table"><tr><th>Category</th><th>Patients</th><th>%</th></tr>${Object.entries(obj).sort((a,b)=>b[1]-a[1]).map(([k,n])=>`<tr><td>${esc(k)}</td><td>${n}</td><td>${total?((n/total)*100).toFixed(1):'0.0'}%</td></tr>`).join('')}</table></div>`;}
async function openAnalytics(){const {data,error}=await supabaseClient.from('camp_patients').select('*').eq('camp_id',currentCamp.id);if(error)return alert(error.message);const total=data.length,male=data.filter(x=>x.gender==='Male').length,female=data.filter(x=>x.gender==='Female').length,ages=data.map(x=>Number(x.age)).filter(Number.isFinite),avg=ages.length?(ages.reduce((a,b)=>a+b,0)/ages.length).toFixed(1):'-';const opted=data.filter(x=>x.blood_package_opted===true).length,notOpted=data.filter(x=>x.blood_package_opted===false).length,newPatients=data.filter(x=>x.patient_type==='New Patient'),converted=newPatients.filter(x=>x.regular_patient_id).length;const screen=(key,opts)=>Object.fromEntries(opts.map(o=>[o,data.filter(x=>x[key]===o).length]));analyticsContent.innerHTML=`<div class="card"><div class="headerrow"><h2>📊 Camp Analytics</h2><button class="btn light" onclick="openCamp(${currentCamp.id})">← Back</button></div><div class="camp-banner"><strong>${esc(currentCamp.camp_name)}</strong><div class="meta">${fmt(currentCamp.camp_date)}</div></div><div class="section"><h3>👥 Patient Overview</h3><div class="statgrid"><div class="stat"><b>${total}</b><span>Total Patients</span></div><div class="stat"><b>${male}</b><span>Male</span></div><div class="stat"><b>${female}</b><span>Female</span></div><div class="stat"><b>${avg}</b><span>Average Age</span></div></div></div>${groupTable('📍 Patient Area / Locality',group(data,'area_locality'),total)}${groupTable('📢 How Patients Knew About Camp',group(data,'camp_source'),total)}${currentCamp.blood_package_available?`<div class="section"><h3>🧪 Special Blood Test Package</h3><table class="analytics-table"><tr><td>Total Camp Patients</td><td><b>${total}</b></td></tr><tr><td>Opted for Package</td><td><b>${opted}</b></td></tr><tr><td>Not Opted</td><td><b>${notOpted}</b></td></tr><tr><td>Package Uptake</td><td><b>${total?((opted/total)*100).toFixed(1):'0.0'}%</b></td></tr></table></div>`:''}<div class="section"><h3>👥 Camp → Regular Patient Conversion</h3><table class="analytics-table"><tr><td>New Patients Attended Camp</td><td><b>${newPatients.length}</b></td></tr><tr><td>Converted to Regular Patients</td><td><b>${converted}</b></td></tr><tr><td>Not Yet Converted</td><td><b>${newPatients.length-converted}</b></td></tr><tr><td>Conversion Rate</td><td><b>${newPatients.length?((converted/newPatients.length)*100).toFixed(1):'0.0'}%</b></td></tr></table></div>${groupTable('🦶 Neuropathy Screening',screen('neuropathy_result',['Normal','Abnormal','Not Done']),total)}${groupTable('👁️ Retinopathy Screening',screen('retinopathy_result',['Normal','Abnormal','Not Done']),total)}${groupTable('🦴 BMD Screening',screen('bmd_result',['Normal','Osteopenia','Osteoporosis','Not Done']),total)}<div class="actions"><button class="btn primary" onclick="window.print()">🖨 Print Report</button></div></div>`;showView('analyticsView');}
async function logout(){await supabaseClient.auth.signOut();location.href='doctor-login.html';}
async function init(){const {data:{session}}=await supabaseClient.auth.getSession();if(!session){location.href='doctor-login.html';return;}loading.style.display='none';}
init();
