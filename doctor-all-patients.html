<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0">

<title>
All Clinic Patients | General & Diabetes Care
</title>

<link
  rel="stylesheet"
  href="styles.css">

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #f5f7fb;
  color: #172033;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    Arial,
    sans-serif;
}

button,
input {
  font-family: inherit;
}

.doctor-dashboard {
  min-height: 100vh;
  padding: 16px 10px 45px;
}

.page-wrap {
  width: 100%;
  max-width: 900px;
  margin: 0 auto;
}


/* HEADER */

.portal-header {
  margin-bottom: 17px;
}

.section-label {
  margin: 0;
  color: #2563eb;
  font-size: 12px;
  font-weight: 850;
  letter-spacing: 1.3px;
}

.portal-header h1 {
  margin: 4px 0;
  font-size: 28px;
}

.portal-subtitle {
  margin: 0;
  color: #697386;
  font-size: 14px;
}


/* BUTTONS */

.portal-button {
  min-height: 43px;
  padding: 10px 14px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  border: none;
  border-radius: 11px;
  cursor: pointer;
  text-decoration: none;
  font-size: 14px;
  font-weight: 750;
}

.primary-button {
  background: #2563eb;
  color: #fff;
}

.secondary-button {
  background: #64748b;
  color: #fff;
}

.light-button {
  background: #f1f5f9;
  color: #172033;
  border: 1px solid #dce3ec;
}

.top-actions {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  margin-bottom: 14px;
}


/* CARD */

.portal-card {
  margin-bottom: 14px;
  padding: 18px;
  background: #fff;
  border: 1px solid #e4e9f0;
  border-radius: 18px;
  box-shadow:
    0 5px 20px rgba(20,31,56,.06);
}


/* SEARCH */

.search-title {
  margin: 0 0 12px;
  font-size: 17px;
  font-weight: 850;
}

.search-row {
  display: grid;
  grid-template-columns:
    minmax(0,1fr) 105px;
  gap: 8px;
}

.search-wrap {
  position: relative;
}

.search-input {
  width: 100%;
  height: 48px;
  padding: 0 42px 0 13px;
  border: 1px solid #cbd5e1;
  border-radius: 11px;
  background: #fff;
  font-size: 15px;
  outline: none;
}

.search-input:focus {
  border-color: #2563eb;
  box-shadow:
    0 0 0 3px rgba(37,99,235,.08);
}

.clear-button {
  position: absolute;
  right: 8px;
  top: 50%;
  transform: translateY(-50%);
  width: 29px;
  height: 29px;
  display: none;
  align-items: center;
  justify-content: center;
  padding: 0;
  border: none;
  border-radius: 50%;
  background: #eef2f7;
  color: #64748b;
  cursor: pointer;
}


/* TOTAL PATIENT CARD */

.total-patients-card {
  width: 100%;
  padding: 18px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 14px;
  text-align: left;
  background:
    linear-gradient(
      135deg,
      #eef6ff,
      #ffffff
    );
  border: 1px solid #d4e5fb;
  border-radius: 17px;
  cursor: pointer;
  transition:
    transform .15s ease,
    box-shadow .15s ease;
}

.total-patients-card:hover {
  transform: translateY(-2px);
  box-shadow:
    0 8px 22px rgba(37,99,235,.08);
}

.total-left {
  display: flex;
  align-items: center;
  gap: 13px;
}

.total-icon {
  width: 52px;
  height: 52px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #dbeafe;
  border-radius: 15px;
  font-size: 27px;
}

.total-title {
  font-size: 17px;
  font-weight: 850;
}

.total-description {
  margin-top: 3px;
  color: #64748b;
  font-size: 12px;
}

.total-right {
  text-align: right;
}

.total-number {
  color: #2563eb;
  font-size: 27px;
  font-weight: 900;
}

.total-arrow {
  margin-top: 2px;
  color: #64748b;
  font-size: 20px;
}


/* SEARCH RESULTS */

.results-title {
  margin: 0 0 10px;
  font-size: 15px;
  font-weight: 850;
}

.patient-result {
  width: 100%;
  margin-top: 8px;
  padding: 14px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  text-align: left;
  background: #fff;
  border: 1px solid #e2e8f0;
  border-radius: 13px;
  cursor: pointer;
}

.patient-result:hover {
  background: #f8fafc;
}

.patient-name {
  color: #172033;
  font-size: 15px;
  font-weight: 850;
}

.patient-meta {
  margin-top: 4px;
  color: #667085;
  font-size: 12px;
  line-height: 1.6;
}

.patient-arrow {
  color: #94a3b8;
  font-size: 23px;
}

.portal-message {
  padding: 18px;
  text-align: center;
  color: #697386;
  background: #f8fafc;
  border-radius: 12px;
}


/* LOADING */

.loading-spinner {
  width: 27px;
  height: 27px;
  margin: 0 auto 9px;
  border: 3px solid #e2e8f0;
  border-top-color: #2563eb;
  border-radius: 50%;
  animation: spin .7s linear infinite;
}

@keyframes spin {
  to {
    transform: rotate(360deg);
  }
}


/* MOBILE */

@media(max-width:600px) {

  .doctor-dashboard {
    padding: 12px 8px 40px;
  }

  .portal-card {
    padding: 14px;
  }

  .portal-header h1 {
    font-size: 25px;
  }

}

@media(max-width:420px) {

  .search-row {
    grid-template-columns:
      minmax(0,1fr) 90px;
  }

  .total-patients-card {
    padding: 15px;
  }

  .total-icon {
    width: 46px;
    height: 46px;
    font-size: 24px;
  }

  .total-number {
    font-size: 23px;
  }

}

</style>

</head>


<body>


<section class="doctor-dashboard">

<div class="page-wrap">


<!-- HEADER -->

<div class="portal-header">

<p class="section-label">
GENERAL &amp; DIABETES CARE
</p>

<h1>
🗂️ All Clinic Patients
</h1>

<p class="portal-subtitle">
Search and manage registered clinic patients
</p>

</div>


<!-- BACK ABOVE SEARCH -->

<div class="top-actions">

<a
  href="doctor-dashboard.html"
  class="portal-button light-button">

← Back to Dashboard

</a>

</div>


<!-- SEARCH -->

<div class="portal-card">

<h2 class="search-title">
🔎 Search Patient
</h2>


<div class="search-row">


<div class="search-wrap">

<input
  type="search"
  id="patientSearch"
  class="search-input"
  placeholder="Patient ID / Name / Phone"
  autocomplete="off">


<button
  type="button"
  id="clearSearchButton"
  class="clear-button"
  aria-label="Clear">

✕

</button>

</div>


<button
  type="button"
  id="searchButton"
  class="portal-button primary-button">

🔎 Search

</button>


</div>


<div
  id="searchResults"
  style="margin-top:14px; display:none;">

</div>


</div>


<!-- TOTAL REGISTERED PATIENTS -->

<div class="portal-card">

<button
  type="button"
  class="total-patients-card"
  id="viewAllPatientsButton">


<div class="total-left">

<div class="total-icon">
👥
</div>


<div>

<div class="total-title">
Total Registered Patients
</div>

<div class="total-description">
Browse registered patients by month and year
</div>

</div>

</div>


<div class="total-right">

<div
  id="totalPatientCount"
  class="total-number">

—

</div>

<div class="total-arrow">
›
</div>

</div>


</button>

</div>


<!-- LOGOUT -->

<div class="top-actions">

<button
  type="button"
  id="logoutButton"
  class="portal-button secondary-button">

🔒 Logout

</button>

</div>


</div>

</section>


<script
  src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2">
</script>


<script>

/* =========================================================
   SUPABASE
   ========================================================= */

const SUPABASE_URL =
  "https://twdmvdqqckcpwoccvtkj.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
  "sb_publishable_qDvT0t7pC5l5kbKl9QirMg_JbBrvUyI";

const supabaseClient =
  supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
  );


/* =========================================================
   STATE
   ========================================================= */

let allPatients =
  [];


/* =========================================================
   HELPERS
   ========================================================= */

function escapeHTML(value) {

  if (
    value === null ||
    value === undefined
  ) {
    return "";
  }

  return String(value)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


function formatDate(value) {

  if (!value) {
    return "-";
  }

  const date =
    new Date(value);

  if (
    Number.isNaN(
      date.getTime()
    )
  ) {
    return "-";
  }

  return date.toLocaleDateString(
    "en-IN",
    {
      day: "2-digit",
      month: "short",
      year: "numeric"
    }
  );

}


/* =========================================================
   AUTH
   ========================================================= */

async function checkDoctorLogin() {

  const {
    data: {
      session
    }
  } =
    await supabaseClient
      .auth
      .getSession();


  if (!session) {

    window.location.href =
      "doctor-login.html";

    return false;

  }

  return true;

}


async function logoutDoctor() {

  await supabaseClient
    .auth
    .signOut();

  window.location.href =
    "doctor-login.html";

}


/* =========================================================
   LOAD PATIENTS
   ========================================================= */

async function loadPatients() {

  const {
    data,
    error
  } =
    await supabaseClient
      .from("patients")
      .select(
        "id,patient_name,patient_phone,created_at"
      )
      .order(
        "created_at",
        {
          ascending: false
        }
      );


  if (error) {

    console.error(
      "Patient loading error:",
      error
    );

    document
      .getElementById(
        "totalPatientCount"
      )
      .textContent =
        "0";

    return;

  }


  allPatients =
    data || [];


  document
    .getElementById(
      "totalPatientCount"
    )
    .textContent =
      allPatients.length;

}


/* =========================================================
   SEARCH
   ========================================================= */

function searchPatients() {

  const input =
    document.getElementById(
      "patientSearch"
    );


  const search =
    input.value
      .trim()
      .toLowerCase();


  const results =
    document.getElementById(
      "searchResults"
    );


  const clearButton =
    document.getElementById(
      "clearSearchButton"
    );


  clearButton.style.display =
    search
      ? "flex"
      : "none";


  if (!search) {

    results.style.display =
      "block";


    results.innerHTML = `

      <div class="portal-message">
        Enter Patient ID, name or phone number.
      </div>

    `;

    return;

  }


  const matches =
    allPatients.filter(
      function(patient) {

        const id =
          String(
            patient.id ||
            ""
          ).toLowerCase();


        const name =
          String(
            patient.patient_name ||
            ""
          ).toLowerCase();


        const phone =
          String(
            patient.patient_phone ||
            ""
          ).toLowerCase();


        return (
          id.includes(search) ||
          name.includes(search) ||
          phone.includes(search)
        );

      }
    );


  results.style.display =
    "block";


  if (
    matches.length === 0
  ) {

    results.innerHTML = `

      <div class="portal-message">
        No patients found.
      </div>

    `;

    return;

  }


  results.innerHTML = `

    <div class="results-title">

      Search Results
      (${matches.length})

    </div>

    ${
      matches
        .map(
          function(patient) {

            return `

              <button
                type="button"
                class="patient-result"
                onclick="openPatientAdmin(
                  ${Number(
                    patient.id
                  )}
                )">


                <div>

                  <div class="patient-name">

                    👤
                    ${escapeHTML(
                      patient.patient_name ||
                      "-"
                    )}

                  </div>


                  <div class="patient-meta">

                    Patient ID:
                    ${escapeHTML(
                      patient.id
                    )}

                    <br>

                    📞
                    ${escapeHTML(
                      patient.patient_phone ||
                      "-"
                    )}

                    &nbsp; • &nbsp;

                    ${formatDate(
                      patient.created_at
                    )}

                  </div>

                </div>


                <div class="patient-arrow">
                  ›
                </div>


              </button>

            `;

          }
        )
        .join("")
    }

  `;

}


/* =========================================================
   CLEAR SEARCH
   ========================================================= */

function clearSearch() {

  const input =
    document.getElementById(
      "patientSearch"
    );


  input.value =
    "";


  document
    .getElementById(
      "clearSearchButton"
    )
    .style.display =
      "none";


  document
    .getElementById(
      "searchResults"
    )
    .style.display =
      "none";


  input.focus();

}


/* =========================================================
   NAVIGATION
   ========================================================= */

function openPatientAdmin(
  patientId
) {

  window.location.href =
    "doctor-patient-admin.html" +
    "?patient_id=" +
    encodeURIComponent(
      patientId
    );

}


function openAllPatientsList() {

  window.location.href =
    "doctor-all-patients-list.html";

}


/* =========================================================
   EVENTS
   ========================================================= */

document
  .getElementById(
    "searchButton"
  )
  .addEventListener(
    "click",
    searchPatients
  );


document
  .getElementById(
    "patientSearch"
  )
  .addEventListener(
    "keydown",
    function(event) {

      if (
        event.key ===
        "Enter"
      ) {

        event.preventDefault();

        searchPatients();

      }

    }
  );


document
  .getElementById(
    "patientSearch"
  )
  .addEventListener(
    "input",
    function() {

      const value =
        this.value.trim();


      document
        .getElementById(
          "clearSearchButton"
        )
        .style.display =
          value
            ? "flex"
            : "none";


      if (!value) {

        document
          .getElementById(
            "searchResults"
          )
          .style.display =
            "none";

      }

    }
  );


document
  .getElementById(
    "clearSearchButton"
  )
  .addEventListener(
    "click",
    clearSearch
  );


document
  .getElementById(
    "viewAllPatientsButton"
  )
  .addEventListener(
    "click",
    openAllPatientsList
  );


document
  .getElementById(
    "logoutButton"
  )
  .addEventListener(
    "click",
    logoutDoctor
  );


/* =========================================================
   GLOBAL
   ========================================================= */

window.openPatientAdmin =
  openPatientAdmin;


/* =========================================================
   START
   ========================================================= */

(async function initializePage() {

  const loggedIn =
    await checkDoctorLogin();


  if (!loggedIn) {
    return;
  }


  await loadPatients();

})();

</script>


</body>

</html>
