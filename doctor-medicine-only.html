<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Medicine Only | General & Diabetes Care</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f5f7fb;color:#172033;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
button,input,select,textarea{font-family:inherit}
.page{width:100%;max-width:1000px;margin:0 auto;padding:16px 10px 45px}
.header{margin-bottom:18px}.brand{margin:0;color:#2563eb;font-size:12px;font-weight:850;letter-spacing:1.3px}.header h1{margin:4px 0;font-size:28px;line-height:1.2}.sub{margin:0;color:#697386;font-size:14px}
.card{margin-bottom:14px;padding:18px;background:#fff;border:1px solid #e4e9f0;border-radius:18px;box-shadow:0 5px 20px rgba(20,31,56,.06)}
.card h2{margin:0;font-size:20px}.topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}.topbar h2{margin:0}
.btn{min-height:42px;padding:10px 14px;display:inline-flex;align-items:center;justify-content:center;border:0;border-radius:11px;cursor:pointer;text-decoration:none;font-size:14px;font-weight:750;white-space:nowrap}.btn:disabled{opacity:.55;cursor:not-allowed}.btn-light{background:#f1f5f9;color:#172033;border:1px solid #dce3ec}.btn-primary{background:#2563eb;color:#fff}.btn-success{background:#15803d;color:#fff}.btn-danger{background:#dc3545;color:#fff}
.search-row{display:grid;grid-template-columns:minmax(0,1fr) 110px;gap:8px;margin-top:12px}.search-row input,.qty-box input{width:100%;height:47px;padding:0 13px;background:#fff;border:1px solid #cbd5e1;border-radius:10px;font-size:15px;outline:none}.search-row input:focus,.qty-box input:focus{border-color:#2563eb;box-shadow:0 0 0 3px rgba(37,99,235,.08)}
.suggestions{margin-top:8px;border:1px solid #dbe3ef;border-radius:10px;overflow:hidden;background:#fff;box-shadow:0 10px 24px rgba(15,23,42,.08)}.suggestion{padding:10px 11px;border-bottom:1px solid #eef2f7;cursor:pointer;line-height:1.45}.suggestion:last-child{border-bottom:0}.suggestion:hover{background:#f0f9ff}.muted{color:#64748b;font-size:12px;line-height:1.5}
.patient-box{margin-top:0;margin-bottom:0;padding:17px;background:linear-gradient(135deg,#eef6ff,#fff);border:1px solid #d8e7fa;border-radius:16px}.patient-name{font-size:21px;font-weight:850}.patient-meta{margin-top:5px;color:#5d697c;font-size:13px;line-height:1.7}
.status{margin-top:10px;padding:11px 12px;border-radius:11px;background:#f8fafc;color:#475569;display:none;font-size:13px;line-height:1.45}.status.show{display:block}.error{background:#fef2f2;color:#b91c1c;border:1px solid #fecaca}.success{background:#f0fdf4;color:#15803d;border:1px solid #bbf7d0}
.batch-list{display:grid;gap:10px;margin-top:12px}.batch-card{border:1px solid #dbe7ef;border-radius:13px;padding:13px;background:#fff;cursor:pointer}.batch-card.selected{border:2px solid #2563eb;background:#eff6ff}.batch-top{display:flex;justify-content:space-between;gap:8px}.batch-name{font-weight:850}.badge{font-size:11px;font-weight:800;padding:5px 8px;border-radius:999px;background:#e0f2fe;color:#0369a1;white-space:nowrap}.batch-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:10px}.batch-stat{background:#f8fafc;border-radius:10px;padding:8px}.batch-stat span{display:block;color:#64748b;font-size:10px}.batch-stat b{display:block;margin-top:2px;font-size:13px}.selected-mark{color:#2563eb;font-weight:800;margin-top:8px}
.quantity-panel{display:none;margin-top:12px;padding:15px;background:linear-gradient(135deg,#f5fbff,#fff);border:1px solid #cfe5f2;border-radius:14px}.quantity-panel.show{display:block}.quantity-title{font-weight:850;font-size:17px}.unit-info{margin-top:5px;color:#475569;font-size:12px}.qty-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:12px}.qty-box label{display:block;margin-bottom:6px;color:#475569;font-size:13px;font-weight:750}.total-box{margin-top:12px;padding:12px;border-radius:12px;background:#fff;border:1px solid #dbe3ef}.total-line{display:flex;justify-content:space-between;gap:10px;margin:5px 0;font-size:13px}.amount{font-size:21px;font-weight:900;color:#166534}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.empty{text-align:center;padding:15px;color:#64748b;font-size:13px}.small-note{font-size:11px;color:#64748b;margin-top:8px}.spinner{padding:15px;text-align:center;color:#64748b;font-size:13px}
@media(max-width:650px){.page{padding:16px 10px 36px}.header h1{font-size:28px}.card{padding:16px}.topbar{align-items:center}.topbar h2{font-size:20px}.search-row{grid-template-columns:minmax(0,1fr) 110px}.search-row .btn{width:110px}.batch-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.qty-grid{grid-template-columns:1fr}.actions .btn{width:auto}.batch-top{align-items:flex-start}.btn{font-size:14px}.patient-name{font-size:20px}}
@media(max-width:430px){.topbar{align-items:flex-start}.topbar .btn{flex:0 0 auto}.search-row{grid-template-columns:minmax(0,1fr) 100px}.search-row .btn{width:100px}.batch-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
</style>
</head>
<body>
<div class="page">
  <div class="header">
    <div class="brand">GENERAL &amp; DIABETES CARE</div>
    <h1>💊 Medicine Only</h1>
    <p class="sub">Dispense medicine without creating a consultation</p>
  </div>

  <div class="card">
    <div class="topbar">
      <h2>👤 Patient</h2>
      <button type="button" class="btn btn-light" id="backButton">← Back to Patient</button>
    </div>
    <div id="patientArea"><div class="spinner">Loading patient...</div></div>
  </div>

  <div class="card">
    <h2 style="margin:0">🔎 Search Medicine</h2>
    <div class="search-row">
      <input id="medicineSearch" type="search" placeholder="Search medicine name, generic name or strength" autocomplete="off">
      <button type="button" class="btn btn-primary" id="searchMedicineButton">Search</button>
    </div>
    <div id="medicineSuggestions" class="suggestions" style="display:none"></div>
    <div id="medicineStatus" class="status"></div>
  </div>

  <div class="card" id="batchSection" style="display:none">
    <h2 id="selectedMedicineTitle" style="margin:0">Available Stock</h2>
    <div class="muted" style="margin-top:5px">Select the exact stock/batch to dispense. Different batches and MRPs are shown separately.</div>
    <div id="batchList" class="batch-list"></div>

    <div id="quantityPanel" class="quantity-panel">
      <div class="quantity-title">Quantity</div>
      <div id="unitInfo" class="unit-info"></div>
      <div id="quantityFields" class="qty-grid"></div>
      <div id="quantityAvailability" class="small-note"></div>
      <div class="total-box">
        <div class="total-line"><span>Total quantity</span><b id="totalQuantity">—</b></div>
        <div class="total-line"><span>MRP</span><b id="mrpDisplay">₹0.00</b></div>
        <div class="total-line"><span>Amount</span><b id="amountDisplay" class="amount">₹0.00</b></div>
      </div>
      <div class="actions">
        <button type="button" class="btn btn-success" id="dispenseButton">💊 Dispense Medicine</button>
      </div>
      <div id="dispenseStatus" class="status"></div>
    </div>
  </div>

  <div id="pageStatus" class="status"></div>
</div>

<script>
const SUPABASE_URL="https://twdmvdqqckcpwoccvtkj.supabase.co";
const SUPABASE_PUBLISHABLE_KEY="sb_publishable_qDvT0t7pC5l5kbKl9QirMg_JbBrvUyI";
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);

const params=new URLSearchParams(window.location.search);
const patientId=Number(params.get("patient_id"));
const returnTo=params.get("return_to")||"doctor-patients.html";
let patient=null, selectedMedicine=null, selectedBatch=null;

function esc(v){return String(v??"").replace(/[&<>'"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","'":"&#39;","\"":"&quot;"}[c]));}
function money(v){return "₹"+Number(v||0).toLocaleString("en-IN",{minimumFractionDigits:2,maximumFractionDigits:2});}
function todayIST(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;}
function monthLabel(v){if(!v)return "-";const d=new Date(v+"T00:00:00");return d.toLocaleDateString("en-IN",{month:"short",year:"numeric"});}
function isTabletOrCapsule(m){const f=String(m?.dosage_form||"").toLowerCase();return /tablet|capsule|caplet|lozenge/.test(f);}
function unitCount(m,b){return Number(b?.units_per_pack||m?.units_per_pack||1)||1;}
function packUnit(m,b){return b?.unit_name||m?.pack_unit||"Pack";}
function baseUnit(m){return m?.base_unit||"Unit";}
function baseStock(b){return Number(b?.quantity_base_units ?? (Number(b?.quantity||0)*unitCount(selectedMedicine||{},b)))||0;}
function displayStock(m,b){const units=unitCount(m,b),base=Number(b?.quantity_base_units ?? Number(b?.quantity||0)*units),packs=Math.floor(base/units),rem=Math.round((base-packs*units)*100)/100;return units>1?`${packs} ${m.pack_unit||b.unit_name||"packs"}${rem?` + ${rem} ${m.base_unit||"units"}`:""}`:`${base} ${m.base_unit||"units"}`;}
function setStatus(el,msg,type=""){el.textContent=msg;el.className="status show"+(type?" "+type:"");}
function clearStatus(el){el.textContent="";el.className="status";}

async function requireSession(){const {data}=await sb.auth.getSession();if(!data?.session){alert("Please log in again.");return false;}return true;}

async function loadPatient(){
  if(!patientId){setStatus(document.getElementById("pageStatus"),"Patient ID is missing.","error");return;}
  const {data,error}=await sb.from("patients").select("*").eq("id",patientId).single();
  if(error||!data){
    const message=error?.message||"Unable to load patient.";
    document.getElementById("patientArea").innerHTML=`<div class="status show error">${esc(message)}</div>`;
    setStatus(document.getElementById("pageStatus"),message,"error");
    return;
  }
  patient=data;
  document.getElementById("patientArea").innerHTML=`<div class="patient-box"><div class="patient-name">👤 ${esc(data.patient_name||"-")}</div><div class="patient-meta">🆔 Patient ID: ${esc(data.id)} &nbsp; • &nbsp; 📞 ${esc(data.patient_phone||"-")}</div></div>`;
}

function goBack(){
  if(returnTo){window.location.href=returnTo;return;}
  history.back();
}

document.getElementById("backButton").addEventListener("click",goBack);

async function searchMedicines(){
  const term=document.getElementById("medicineSearch").value.trim();
  const box=document.getElementById("medicineSuggestions");
  if(term.length<2){box.style.display="none";return;}
  const {data,error}=await sb.from("medicines").select("*").or(`medicine_name.ilike.%${term}%,generic_name.ilike.%${term}%,strength.ilike.%${term}%`).order("medicine_name").limit(15);
  if(error){setStatus(document.getElementById("medicineStatus"),error.message,"error");return;}
  box.innerHTML=(data||[]).map(m=>`<div class="suggestion" data-id="${Number(m.id)}"><b>${esc(m.medicine_name)} ${esc(m.strength||"")}</b><br><span class="muted">${esc(m.dosage_form||"")} · ${esc(m.pack_unit||"Pack")} · 1 ${esc(m.pack_unit||"pack")} = ${Number(m.units_per_pack||1)} ${esc(m.base_unit||"Unit")}</span></div>`).join("")||`<div class="empty">No medicines found.</div>`;
  box.style.display="block";
  box.querySelectorAll(".suggestion[data-id]").forEach(el=>el.addEventListener("click",()=>selectMedicine(Number(el.dataset.id))));
}

document.getElementById("searchMedicineButton").addEventListener("click",searchMedicines);
document.getElementById("medicineSearch").addEventListener("input",()=>{clearStatus(document.getElementById("medicineStatus"));searchMedicines();});
document.getElementById("medicineSearch").addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();searchMedicines();}});

async function selectMedicine(id){
  const {data:m,error}=await sb.from("medicines").select("*").eq("id",id).single();
  if(error||!m){setStatus(document.getElementById("medicineStatus"),error?.message||"Unable to load medicine.","error");return;}
  selectedMedicine=m;selectedBatch=null;
  document.getElementById("medicineSuggestions").style.display="none";
  document.getElementById("medicineSearch").value=`${m.medicine_name}${m.strength?" "+m.strength:""}`.trim();
  document.getElementById("selectedMedicineTitle").textContent=`${m.medicine_name}${m.strength?" "+m.strength:""}`.trim();
  document.getElementById("quantityPanel").classList.remove("show");
  const {data:batches,error:be}=await sb.from("medicine_batches").select("*").eq("medicine_id",id).gt("quantity_base_units",0).order("expiry_date",{ascending:true});
  if(be){setStatus(document.getElementById("medicineStatus"),be.message,"error");return;}
  document.getElementById("batchSection").style.display="block";
  const list=document.getElementById("batchList");
  if(!batches?.length){list.innerHTML=`<div class="empty">No available stock for this medicine.</div>`;return;}
  list.innerHTML=batches.map(b=>`<div class="batch-card" data-batch-id="${Number(b.id)}">
    <div class="batch-top"><div class="batch-name">Batch: ${esc(b.batch_number||"-")}</div><div class="badge">MRP ${money(b.mrp_per_unit)}</div></div>
    <div class="batch-grid">
      <div class="batch-stat"><span>Expiry</span><b>${esc(monthLabel(b.expiry_date))}</b></div>
      <div class="batch-stat"><span>Pack</span><b>1 ${esc(packUnit(m,b))} = ${unitCount(m,b)} ${esc(baseUnit(m))}</b></div>
      <div class="batch-stat"><span>Available</span><b>${esc(displayStock(m,b))}</b></div>
      <div class="batch-stat"><span>Purchase</span><b>${money(b.purchase_price_per_unit)}</b></div>
    </div>
  </div>`).join("");
  list.querySelectorAll(".batch-card").forEach(el=>el.addEventListener("click",()=>selectBatch(batches.find(x=>Number(x.id)===Number(el.dataset.batchId)))));
}

function selectBatch(b){
  if(!b)return;
  selectedBatch=b;
  document.querySelectorAll(".batch-card").forEach(x=>x.classList.toggle("selected",Number(x.dataset.batchId)===Number(b.id)));
  const m=selectedMedicine,units=unitCount(m,b),tabletMode=isTabletOrCapsule(m);
  document.getElementById("unitInfo").innerHTML=`<b>1 ${esc(packUnit(m,b))} = ${units} ${esc(baseUnit(m))}</b> &nbsp; · &nbsp; <b>MRP ${money(b.mrp_per_unit)} / ${esc(packUnit(m,b))}</b>`;
  const fields=document.getElementById("quantityFields");
  if(tabletMode){
    fields.innerHTML=`<div class="qty-box"><label>${esc(packUnit(m,b))}</label><input id="packQty" type="number" min="0" step="1" value="0" inputmode="numeric"></div><div class="qty-box"><label>${esc(baseUnit(m))}</label><input id="baseQty" type="number" min="0" step="1" value="0" inputmode="numeric"></div>`;
  }else{
    fields.innerHTML=`<div class="qty-box"><label>Quantity (${esc(packUnit(m,b))})</label><input id="packQty" type="number" min="0" step="1" value="0" inputmode="numeric"></div>`;
  }
  fields.querySelectorAll("input").forEach(x=>x.addEventListener("input",updateAmount));
  document.getElementById("quantityPanel").classList.add("show");
  updateAmount();
}

function getRequestedBase(){
  if(!selectedMedicine||!selectedBatch)return 0;
  const packs=Number(document.getElementById("packQty")?.value)||0;
  if(isTabletOrCapsule(selectedMedicine)) return packs*unitCount(selectedMedicine,selectedBatch)+(Number(document.getElementById("baseQty")?.value)||0);
  return packs*unitCount(selectedMedicine,selectedBatch);
}
function updateAmount(){
  if(!selectedMedicine||!selectedBatch)return;
  const units=unitCount(selectedMedicine,selectedBatch),base=getRequestedBase(),available=baseStock(selectedBatch),packs=base/units;
  document.getElementById("totalQuantity").textContent=base?`${Number.isInteger(packs)?packs:packs.toFixed(2)} ${packUnit(selectedMedicine,selectedBatch)}${isTabletOrCapsule(selectedMedicine)&&base%units?` + ${Math.round(base%units)} ${baseUnit(selectedMedicine)}`:""}`:`0 ${baseUnit(selectedMedicine)}`;
  document.getElementById("mrpDisplay").textContent=money(selectedBatch.mrp_per_unit);
  document.getElementById("amountDisplay").textContent=money(packs*Number(selectedBatch.mrp_per_unit||0));
  document.getElementById("quantityAvailability").textContent=`Available: ${displayStock(selectedMedicine,selectedBatch)}`;
  clearStatus(document.getElementById("dispenseStatus"));
}

document.getElementById("dispenseButton").addEventListener("click",async()=>{
  if(!(await requireSession()))return;
  if(!patient||!selectedMedicine||!selectedBatch){setStatus(document.getElementById("dispenseStatus"),"Select a patient, medicine and stock batch first.","error");return;}
  const requestedBase=getRequestedBase(),available=baseStock(selectedBatch),units=unitCount(selectedMedicine,selectedBatch);
  if(requestedBase<=0){setStatus(document.getElementById("dispenseStatus"),"Enter a quantity.","error");return;}
  if(requestedBase>available){setStatus(document.getElementById("dispenseStatus"),`Insufficient stock. Available: ${displayStock(selectedMedicine,selectedBatch)}.`,"error");return;}
  const amount=(requestedBase/units)*Number(selectedBatch.mrp_per_unit||0);
  const oldBase=available,newBase=oldBase-requestedBase;
  const txNote=`GDC-MEDICINE-ONLY:PATIENT:${patient.id}:MEDICINE:${selectedMedicine.id} | Patient ID:${patient.id} | Patient:${patient.patient_name||""} | ${selectedMedicine.medicine_name}${selectedMedicine.strength?" "+selectedMedicine.strength:""} | Batch:${selectedBatch.batch_number||""} | Quantity:${requestedBase} ${selectedMedicine.base_unit||"units"} | Amount:${amount.toFixed(2)}`;
  const btn=document.getElementById("dispenseButton");btn.disabled=true;setStatus(document.getElementById("dispenseStatus"),"Recording dispensing...");
  try{
    const {data:updated,error:ue}=await sb.from("medicine_batches").update({quantity:newBase/units,quantity_base_units:newBase,updated_at:new Date().toISOString()}).eq("id",selectedBatch.id).eq("quantity_base_units",oldBase).select().single();
    if(ue||!updated)throw ue||new Error("Stock changed while dispensing. Please refresh and try again.");
    const {error:te}=await sb.from("medicine_stock_transactions").insert({medicine_id:selectedMedicine.id,batch_id:selectedBatch.id,transaction_type:"DISPENSED",quantity:requestedBase/units,quantity_base_units:requestedBase,units_per_pack:units,direction:"OUT",transaction_date:todayIST(),mrp_per_unit:selectedBatch.mrp_per_unit,purchase_price_per_unit:selectedBatch.purchase_price_per_unit,notes:txNote});
    if(te){await sb.from("medicine_batches").update({quantity:selectedBatch.quantity,quantity_base_units:oldBase,updated_at:new Date().toISOString()}).eq("id",selectedBatch.id).eq("quantity_base_units",newBase);throw te;}
    setStatus(document.getElementById("dispenseStatus"),`Medicine dispensed successfully. Amount ${money(amount)}. Stock history updated.`,"success");
    document.getElementById("dispenseButton").disabled=true;
    await selectMedicine(selectedMedicine.id);
  }catch(err){setStatus(document.getElementById("dispenseStatus"),err.message||"Unable to dispense medicine.","error");btn.disabled=false;}
});

(async function init(){
  if(!(await requireSession()))return;
  await loadPatient();
})();
</script>
</body>
</html>
