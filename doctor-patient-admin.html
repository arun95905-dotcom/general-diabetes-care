/* =========================================================

<script>

/* =========================================================

const SUPABASE_URL =

const SUPABASE_PUBLISHABLE_KEY =
  "sb_publishable_qDvT0t7pC5l5kbKl9QirMg_JbBrvUyI";

const supabaseClient =
  supabase.createClient(

/* =========================================================
   HELPERS
   ========================================================= */

function escapeHTML(value) {

  if (
    value === null ||
    value === undefined
  ) {
    return "";
  }


  return String(value)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


function formatDate(value) {

  if (!value) {
    return "-";
  }


  const date =
    new Date(
      String(value).length === 10
        ? value + "T00:00:00"
        : value
    );


  if (
    Number.isNaN(
      date.getTime()
    )
  ) {
    return "-";
  }


  return date.toLocaleDateString(
    "en-IN",
    {
      day: "2-digit",
      month: "short",
      year: "numeric"
    }
  );

}


function calculateAge(patient) {

  if (
    patient.age !== null &&
    patient.age !== undefined &&
    patient.age !== ""
  ) {

    return patient.age;

  }


  if (!patient.date_of_birth) {

    return "-";

  }


  const dob =
    new Date(
      patient.date_of_birth +
      "T00:00:00"
    );


  const today =
    new Date();


  let age =
    today.getFullYear() -
    dob.getFullYear();


  const monthDifference =
    today.getMonth() -
    dob.getMonth();


  if (
    monthDifference < 0 ||
    (
      monthDifference === 0 &&
      today.getDate() <
      dob.getDate()
    )
  ) {

    age--;

  }


  return age;

}


function getPatientIdFromURL() {

  const params =
    new URLSearchParams(
      window.location.search
    );


  const patientId =
    params.get(
      "patient_id"
    );


  if (
    !patientId ||
    !/^\d+$/.test(
      patientId
    )
  ) {

    return null;

  }


  return Number(
    patientId
  );

}


function getPatientAdminReturnURL() {

  const params =
    new URLSearchParams(
      window.location.search
    );

  const returnTo =
    params.get(
      "return_to"
    );

  if (!returnTo) {
    return "doctor-all-patients.html";
  }

  try {

    const decoded =
      decodeURIComponent(
        returnTo
      );

    const target =
      new URL(
        decoded,
        window.location.href
      );

    if (
      target.origin !==
      window.location.origin
    ) {
      return "doctor-all-patients.html";
    }

    return (
      target.pathname.split("/").pop() +
      target.search +
      target.hash
    );

  } catch (error) {

    return "doctor-all-patients.html";

  }

}


function returnFromPatientAdmin() {

  window.location.href =
    patientAdminReturnURL ||
    "doctor-all-patients.html";

}


function chunkArray(
  array,
  size
) {

  const chunks =
    [];


  for (
    let i = 0;
    i < array.length;
    i += size
  ) {

    chunks.push(
      array.slice(
        i,
        i + size
      )
    );

  }


  return chunks;

}


/* =========================================================

async function checkDoctorLogin() {

  const {
    data: {
      session
    }
  } =
    await supabaseClient
      .auth
      .getSession();


  if (!session) {

    window.location.href =
      "doctor-login.html";

    return false;

  }


  return true;

}


async function logoutDoctor() {

  await supabaseClient
    .auth
    .signOut();


  window.location.href =
    "doctor-login.html";

}


/* =========================================================
   LOAD PATIENT
   ========================================================= */

async function loadPatient() {

    );


  const {
    data,
    error
  } =
    await supabaseClient
      .from("patients")
      .select("*")
      .eq(
        "id",
        currentPatientId
      )
      .single();


  if (
    error ||
    !data
  ) {

    console.error(
      "Patient load error:",
      error
    );


    container.innerHTML = `

      <div class="portal-message">

        Patient could not be found.

        <div
          class="action-row"
          style="justify-content:center;">

          <button
            type="button"
            class="portal-button light-button"
            onclick="returnFromPatientAdmin()">

            ← Back

          </button>

        </div>

      </div>

    `;


    return false;

  }


  currentPatient =
    data;


  renderPatient();


  return true;

}

    <!-- BASIC DETAILS -->

              )}

            </div>

          </div>


          <div class="detail-box">

            </span>

            <div class="detail-value">

              ${escapeHTML(
                patient.patient_phone ||

              )}

            </div>

          </div>


          <div class="detail-box">

            <span class="detail-label">

            </span>

            <div class="detail-value">

              ${
                patient.date_of_birth
                  ? formatDate(

                    )

              }

            </div>

          </div>


          <div class="detail-box">

            </span>

            <div class="detail-value">

              ${escapeHTML(
                calculateAge(

                )
              )}

            </div>

          </div>


          <div class="detail-box">

            </span>

            <div class="detail-value">

              ${escapeHTML(

              )}

          </div>


          <div class="detail-box">

          </div>


          <div class="detail-box full">

            </span>

            <div class="detail-value">

              )}

            </div>

          </div>


          <div class="detail-box full">

            <div class="detail-value">

              )}

            </div>

          </div>


          <div class="detail-box full">

            </div>

          </div>


          <div class="detail-box full">

    <!-- DANGER ZONE -->

/* =========================================================
   BASIC DETAILS
   ========================================================= */

function toggleBasicDetails() {

  const details =
    document.getElementById(
      "basicDetails"
    );


  const arrow =
    document.getElementById(
      "basicDetailsArrow"
    );


  if (
    details.classList.contains(
      "open"
    )
  ) {

    details.classList.remove(
      "open"
    );


    arrow.textContent =
      "›";


  } else {

    details.classList.add(
      "open"
    );


    arrow.textContent =
      "⌄";

  }

}


/* =========================================================
   PRESCRIPTION STORAGE PATH
   ========================================================= */

function getPrescriptionStoragePath(
  imageURL
) {

  if (!imageURL) {
    return null;
  }


  try {

    const url =
      new URL(
        imageURL
      );


    const markers = [

      "/storage/v1/object/public/prescriptions/",
      "/storage/v1/object/sign/prescriptions/"

    ];


    for (
      const marker of markers
    ) {

      const index =
        url.pathname.indexOf(
          marker
        );


      if (
        index !== -1
      ) {

        return decodeURIComponent(
          url.pathname.substring(
            index +
            marker.length
          )
        );

      }

    }


  } catch (error) {

    console.warn(
      "Could not determine prescription path:",
      error
    );

  }


  return null;

}


/* =========================================================
   REMOVE STORAGE FILES
   ========================================================= */

async function removeStorageFiles(
  bucketName,
  filePaths
) {

  const uniquePaths =
    [
      ...new Set(
        (
          filePaths ||
          []
        )
        .filter(Boolean)
      )
    ];


  if (
    uniquePaths.length === 0
  ) {
    return;
  }


  /*
     Remove in smaller batches.
  */

  const chunks =
    chunkArray(
      uniquePaths,
      100
    );


  for (
    const paths of chunks
  ) {

    const {
      error
    } =
      await supabaseClient
        .storage
        .from(
          bucketName
        )
        .remove(
          paths
        );


    if (error) {

      console.warn(
        "Storage deletion warning:",
        bucketName,
        error
      );

    }

  }

}


/* =========================================================
   DELETE PATIENT
   ========================================================= */

async function deletePatientPermanently() {

  if (
    !currentPatient ||
    !currentPatientId
  ) {
    return;
  }


  /*
     ONE confirmation only, as requested.
  */

  const confirmed =
    confirm(
      "Permanently delete " +
      (
        currentPatient.patient_name ||
        "this patient"
      ) +
      "?\n\n" +
      "This will delete the patient's registration, consultations, prescription images, lab reports, billing records and linked appointments.\n\n" +
      "This action cannot be undone."
    );


  if (!confirmed) {
    return;
  }


  const button =
    document.getElementById(
      "deletePatientButton"
    );


  button.disabled =
    true;


  button.textContent =
    "⏳ Deleting patient records...";


  try {

    /* =====================================================
       1. LOAD ALL CONSULTATIONS
       ===================================================== */

    const {
      data:
        consultations,
      error:
        consultationLoadError
    } =
      await supabaseClient
        .from(
          "consultations"
        )
        .select(
          "id,prescription_image_url"
        )
        .eq(
          "patient_id",
          currentPatientId
        );


    if (consultationLoadError) {

      throw new Error(
        "Unable to read consultation records: " +
        consultationLoadError.message
      );

    }


    const consultationRows =
      consultations ||
      [];


    const consultationIds =
      consultationRows
        .map(
          function(item) {

            return item.id;

          }
        );


    /* =====================================================
       2. LOAD PRESCRIPTION IMAGE RECORDS
       ===================================================== */

    let prescriptionImageRows =
      [];


    if (
      consultationIds.length > 0
    ) {

      const {
        data,
        error
      } =
        await supabaseClient
          .from(
            "consultation_images"
          )
          .select(
            "id,consultation_id,image_url"
          )
          .in(
            "consultation_id",
            consultationIds
          );


      if (error) {

        throw new Error(
          "Unable to read prescription image records: " +
          error.message
        );

      }


      prescriptionImageRows =
        data ||
        [];

    }


    /* =====================================================
       3. LOAD LAB REPORT RECORDS
       ===================================================== */

    const {
      data:
        labReports,
      error:
        labLoadError
    } =
      await supabaseClient
        .from(
          "investigation_reports"
        )
        .select(
          "id,file_path"
        )
        .eq(
          "patient_id",
          currentPatientId
        );


    if (labLoadError) {

      throw new Error(
        "Unable to read lab report records: " +
        labLoadError.message
      );

    }


    /* =====================================================
       4. DELETE PRESCRIPTION STORAGE FILES
       ===================================================== */

    const prescriptionPaths =
      [];


    prescriptionImageRows
      .forEach(
        function(image) {

          const path =
            getPrescriptionStoragePath(
              image.image_url
            );


          if (path) {

            prescriptionPaths.push(
              path
            );

          }

        }
      );


    /*
       Older prescription images may exist only in
       consultations.prescription_image_url.
    */

    consultationRows
      .forEach(
        function(consultation) {

          const path =
            getPrescriptionStoragePath(
              consultation
                .prescription_image_url
            );


          if (path) {

            prescriptionPaths.push(
              path
            );

          }

        }
      );


    await removeStorageFiles(
      "prescriptions",
      prescriptionPaths
    );


    /* =====================================================
       5. DELETE LAB STORAGE FILES
       ===================================================== */

    const labPaths =
      (
        labReports ||
        []
      )
      .map(
        function(report) {

          return report.file_path;

        }
      )
      .filter(Boolean);


    await removeStorageFiles(
      "investigation-reports",
      labPaths
    );


    /* =====================================================
       6. DELETE CONSULTATION IMAGE DATABASE RECORDS
       ===================================================== */

    if (
      consultationIds.length > 0
    ) {

      const {
        error
      } =
        await supabaseClient
          .from(
            "consultation_images"
          )
          .delete()
          .in(
            "consultation_id",
            consultationIds
          );


      if (error) {

        throw new Error(
          "Unable to delete prescription image records: " +
          error.message
        );

      }

    }


    /* =====================================================
       7. DELETE LAB REPORT DATABASE RECORDS
       ===================================================== */

    const {
      error:
        labDeleteError
    } =
      await supabaseClient
        .from(
          "investigation_reports"
        )
        .delete()
        .eq(
          "patient_id",
          currentPatientId
        );


    if (labDeleteError) {

      throw new Error(
        "Unable to delete lab report records: " +
        labDeleteError.message
      );

    }


    /* =====================================================
       8. DELETE BILLING RECORDS

       Done before consultations because billing may
       reference consultation_id.
       ===================================================== */

    const {
      error:
        billingDeleteError
    } =
      await supabaseClient
        .from(
          "billing"
        )
        .delete()
        .eq(
          "patient_id",
          currentPatientId
        );


    if (billingDeleteError) {

      throw new Error(
        "Unable to delete billing records: " +
        billingDeleteError.message
      );

    }


    /* =====================================================
       9. DELETE CONSULTATIONS

       Done before appointments because consultations
       may reference appointment_id.
       ===================================================== */

    const {
      error:
        consultationDeleteError
    } =
      await supabaseClient
        .from(
          "consultations"
        )
        .delete()
        .eq(
          "patient_id",
          currentPatientId
        );


    if (consultationDeleteError) {

      throw new Error(
        "Unable to delete consultation records: " +
        consultationDeleteError.message
      );

    }


    /* =====================================================
       10. DELETE PATIENT-LINKED APPOINTMENTS
       ===================================================== */

    const {
      error:
        appointmentDeleteError
    } =
      await supabaseClient
        .from(
          "appointments"
        )
        .delete()
        .eq(
          "patient_id",
          currentPatientId
        );


    if (appointmentDeleteError) {

      throw new Error(
        "Unable to delete linked appointments: " +
        appointmentDeleteError.message
      );

    }


    /* =====================================================
       11. DELETE PATIENT RECORD LAST
       ===================================================== */

    const {
      error:
        patientDeleteError
    } =
      await supabaseClient
        .from(
          "patients"
        )
        .delete()
        .eq(
          "id",
          currentPatientId
        );


    if (patientDeleteError) {

      throw new Error(
        "Unable to delete patient record: " +
        patientDeleteError.message
      );

    }


    /* =====================================================
       SUCCESS
       ===================================================== */

    alert(
      "Patient deleted successfully.\n\n" +
      "All linked patient records have been removed."
    );


    window.location.href =
      patientAdminReturnURL ||
      "doctor-all-patients.html";


  } catch (error) {

    console.error(
      "Patient deletion error:",
      error
    );


    button.disabled =
      false;


    button.textContent =
      "🗑 Permanently Delete Patient";


    alert(
      "Patient deletion could not be completed.\n\n" +
      error.message
    );

  }

}


/* =========================================================
   EVENTS
   ========================================================= */

document
  .getElementById(
    "backButton"
  )
  .addEventListener(
    "click",
    returnFromPatientAdmin
  );


document
  .getElementById(
    "logoutButton"
  )
  .addEventListener(
    "click",
    logoutDoctor
  );


/* =========================================================
   GLOBAL
   ========================================================= */

window.returnFromPatientAdmin =
  returnFromPatientAdmin;

window.toggleBasicDetails =
  toggleBasicDetails;

window.deletePatientPermanently =
  deletePatientPermanently;


/* =========================================================
   START
   ========================================================= */

(async function initializePage() {

  const loggedIn =
    await checkDoctorLogin();


  if (!loggedIn) {
    return;
  }


  patientAdminReturnURL =
    getPatientAdminReturnURL();


  currentPatientId =
    getPatientIdFromURL();


  const backButton =
    document.getElementById(
      "backButton"
    );

  if (
    backButton &&
    patientAdminReturnURL !==
      "doctor-all-patients.html"
  ) {
    backButton.textContent =
      "← Back to Patient List";
  }


  if (!currentPatientId) {

    alert(
      "Patient ID is missing."
    );


    window.location.href =
      "doctor-all-patients.html";


    return;
  }


  await loadPatient();

})();

</script>
