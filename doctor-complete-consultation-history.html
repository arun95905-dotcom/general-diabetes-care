<script>

/* =========================================================
   CONFIG
   ========================================================= */

const SUPABASE_URL =
  "https://twdmvdqqckcpwoccvtkj.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
  "sb_publishable_qDvT0t7pC5l5kbKl9QirMg_JbBrvUyI";

const supabaseClient =
  supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
  );


/* =========================================================
   STATE
   ========================================================= */

let currentPatient =
  null;

let currentPatientId =
  null;

let currentConsultationId =
  null;

let currentConsultations =
  [];

let selectedHistoryYear =
  null;

let selectedHistoryMonth =
  null;

let completeHistoryMode =
  true;

/*
   HISTORY PERIOD RANGE
   Show the present year and previous years only.
   No future years or future months are shown.
*/
const HISTORY_YEAR_LOOKBACK =
  20;


/* =========================================================
   HELPERS
   ========================================================= */

function escapeHTML(value) {

  if (
    value === null ||
    value === undefined
  ) {
    return "";
  }

  return String(value)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


function showView(viewId) {

  document
    .querySelectorAll(
      ".portal-view"
    )
    .forEach(
      function(view) {

        view.classList.remove(
          "active"
        );

      }
    );


  const target =
    document.getElementById(
      viewId
    );


  if (target) {

    target.classList.add(
      "active"
    );

  }


  window.scrollTo({
    top: 0,
    behavior: "smooth"
  });

}


function formatDate(value) {

  if (!value) {
    return "-";
  }


  const date =
    new Date(
      String(value).length === 10
        ? value + "T00:00:00"
        : value
    );


  if (
    Number.isNaN(
      date.getTime()
    )
  ) {
    return value;
  }


  return date.toLocaleDateString(
    "en-IN",
    {
      day: "2-digit",
      month: "short",
      year: "numeric"
    }
  );

}


function formatDateTime(value) {

  if (!value) {
    return "-";
  }


  const date =
    new Date(value);


  if (
    Number.isNaN(
      date.getTime()
    )
  ) {
    return "-";
  }


  return date.toLocaleString(
    "en-IN",
    {
      day: "2-digit",
      month: "short",
      year: "numeric",
      hour: "numeric",
      minute: "2-digit"
    }
  );

}


function getTodayString() {

  const date =
    new Date();


  return (
    date.getFullYear() +
    "-" +
    String(
      date.getMonth() + 1
    ).padStart(
      2,
      "0"
    ) +
    "-" +
    String(
      date.getDate()
    ).padStart(
      2,
      "0"
    )
  );

}


function calculateAge(patient) {

  if (
    patient.age !== null &&
    patient.age !== undefined &&
    patient.age !== ""
  ) {
    return patient.age;
  }


  if (!patient.date_of_birth) {
    return "-";
  }


  const dob =
    new Date(
      patient.date_of_birth +
      "T00:00:00"
    );


  const today =
    new Date();


  let age =
    today.getFullYear() -
    dob.getFullYear();


  const difference =
    today.getMonth() -
    dob.getMonth();


  if (
    difference < 0 ||
    (
      difference === 0 &&
      today.getDate() <
      dob.getDate()
    )
  ) {
    age--;
  }


  return age;

}


/* =========================================================
   LOGIN
   ========================================================= */

async function checkDoctorLogin() {

  const {
    data: {
      session
    }
  } =
    await supabaseClient
      .auth
      .getSession();


  if (!session) {

    window.location.href =
      "doctor-login.html";

    return false;

  }


  return true;

}


async function logoutDoctor() {

  await supabaseClient
    .auth
    .signOut();


  window.location.href =
    "doctor-login.html";

}


/* =========================================================
   SEARCH
   ========================================================= */

async function searchPatients() {

  const search =
    document
      .getElementById(
        "patientSearch"
      )
      .value
      .trim();


  const container =
    document.getElementById(
      "patientSearchResults"
    );


  if (!search) {

    container.innerHTML = `

      <div class="portal-message">
        Enter Patient ID, name or phone number.
      </div>

    `;

    return;

  }


  container.innerHTML = `

    <div class="portal-message">
      🔎 Searching...
    </div>

  `;


  let query =
    supabaseClient
      .from("patients")
      .select("*");


  if (
    /^\d+$/.test(
      search
    )
  ) {

    query =
      query.or(
        "id.eq." +
        search +
        ",patient_name.ilike.%" +
        search +
        "%,patient_phone.ilike.%" +
        search +
        "%"
      );

  } else {

    query =
      query.or(
        "patient_name.ilike.%" +
        search +
        "%,patient_phone.ilike.%" +
        search +
        "%"
      );

  }


  const {
    data,
    error
  } =
    await query
      .order(
        "patient_name",
        {
          ascending: true
        }
      );


  if (error) {

    console.error(
      error
    );


    container.innerHTML = `

      <div class="portal-message">
        Unable to search patients.
      </div>

    `;


    return;

  }


  if (
    !data ||
    data.length === 0
  ) {

    container.innerHTML = `

      <div class="portal-message">
        No patients found.
      </div>

    `;


    return;

  }


  container.innerHTML =
    data
      .map(
        function(patient) {

          return `

            <div class="patient-result">

              <div class="patient-result-name">

                👤
                ${escapeHTML(
                  patient.patient_name ||
                  "-"
                )}

              </div>


              <div class="patient-result-meta">

                🆔 Patient ID:
                ${escapeHTML(
                  patient.id
                )}

                <br>

                📞
                ${escapeHTML(
                  patient.patient_phone ||
                  "-"
                )}

                <br>

                🎂 Age:
                ${escapeHTML(

    Number(
      params.get(

      requestedMonth

    requestedMonth >= 1 &&
    requestedMonth <= 12
  ) {

    `;


  showView(

  );


  const {

  } =
    await supabaseClient
      .from("consultations")
      .select("*")
      .eq(
        "patient_id",

  currentConsultations =

    .filter(

function getConsultationPeriod(
  consultation
) {

  if (
    !consultation ||
    !consultation.created_at
  ) {

    return null;

  }


  const date =
    new Date(
      consultation.created_at
    );


  if (
    Number.isNaN(
      date.getTime()
    )
  ) {

    return null;

  }


  return {

    year:
      date.getFullYear(),

    month:
      date.getMonth() + 1

  };

}


function setDefaultHistoryPeriod() {

  const now =
    new Date();


  selectedHistoryYear =
    now.getFullYear();

  selectedHistoryMonth =
    now.getMonth() + 1;

}


function getAvailableHistoryYears() {

  const currentYear =
    new Date().getFullYear();

  const years =
    [];


  for (
    let year = currentYear;
    year >= currentYear - HISTORY_YEAR_LOOKBACK;
    year--
  ) {

    years.push(
      year
    );

  }


  return years;

}


function getAvailableMonthsForYear(
  year
) {

  const now =
    new Date();

  const currentYear =
    now.getFullYear();

  const currentMonth =
    now.getMonth() + 1;

  const selectedYear =
    Number(year);


  if (
    !Number.isInteger(
      selectedYear
    ) ||
    selectedYear > currentYear ||
    selectedYear <
      currentYear - HISTORY_YEAR_LOOKBACK
  ) {

    return [];

  }


  const lastMonth =
    selectedYear === currentYear
      ? currentMonth
      : 12;

  const months =
    [];


  for (
    let month = lastMonth;
    month >= 1;
    month--
  ) {

    months.push(
      month
    );

  }


  return months;

}


function getHistoryMonthName(
  month
) {

  const names = [
    "January",
    "February",
    "March",
    "April",
    "May",
    "June",
    "July",
    "August",
    "September",
    "October",
    "November",
    "December"
  ];


  const index =
    Number(month) - 1;


  return names[index] ||
    "Month";

}


function getConsultationsForPeriod(
  year,
  month
) {

  return currentConsultations
    .filter(
      function(consultation) {

        const period =
          getConsultationPeriod(
            consultation
          );


        return (
          period &&
          period.year ===
            Number(year) &&
          period.month ===
            Number(month)
        );

      }
    )
    .sort(
      function(a,b) {

        return String(
          b.created_at ||
          ""
        ).localeCompare(
          String(
            a.created_at ||
            ""
          )
        );

      }
    );

}

function updateHistoryURL(
  showResults
) {

  if (!currentPatientId) {
    return;

  const url =
    new URL(
      window.location.href
    );


  url.searchParams.set(
    "patient_id",
    currentPatientId
  );


  if (
    selectedHistoryYear &&
    selectedHistoryMonth
  ) {

    url.searchParams.set(
      "year",
      selectedHistoryYear
    );

    url.searchParams.set(
      "month",
      selectedHistoryMonth
    );

  } else {

    url.searchParams.delete(
      "year"
    );

    url.searchParams.delete(
      "month"
    );

  }


  if (showResults) {

    url.searchParams.set(
      "view",
      "consultations"
    );

  } else {

    url.searchParams.delete(
      "view"
    );

  }


  window.history.replaceState(
    {},
    "",
    url.pathname +
    url.search
  );

}

) {

  if (!confirmed) {
    return;
  }


  try {

    /* -----------------------------------------
       DELETE PRESCRIPTION IMAGE RECORDS
       ----------------------------------------- */

    const {
      data: prescriptionImages,
      error: prescriptionFetchError
    } =
      await supabaseClient
        .from("consultation_images")
        .select("*")
        .eq(
          "consultation_id",
          consultationId
        );


    if (prescriptionFetchError) {

      throw prescriptionFetchError;

    }


    /* -----------------------------------------
       DELETE PRESCRIPTION FILES FROM STORAGE
       ----------------------------------------- */

    if (
      prescriptionImages &&
      prescriptionImages.length > 0
    ) {

      const prescriptionPaths =
        prescriptionImages
          .map(
            function(image) {

              return getPrescriptionStoragePath(
                image.image_url
              );

            }
          )
          .filter(
            function(path) {

              return Boolean(path);

            }
          );


      if (
        prescriptionPaths.length > 0
      ) {

        const {
          error: storageDeleteError
        } =
          await supabaseClient
            .storage
            .from("prescriptions")
            .remove(
              prescriptionPaths
            );


        if (storageDeleteError) {

          throw storageDeleteError;

        }

      }


      const {
        error: imageDeleteError
      } =
        await supabaseClient
          .from("consultation_images")
          .delete()
          .eq(
            "consultation_id",
            consultationId
          );


      if (imageDeleteError) {

        throw imageDeleteError;

      }

    }


    /* -----------------------------------------
       GET LAB REPORTS
       ----------------------------------------- */

    const {
      data: labReports,
      error: labFetchError
    } =
      await supabaseClient
        .from("investigation_reports")
        .select("*")
        .eq(
          "consultation_id",
          consultationId
        );


    if (labFetchError) {

      throw labFetchError;

    }


    /* -----------------------------------------
       DELETE LAB FILES FROM STORAGE
       ----------------------------------------- */

    if (
      labReports &&
      labReports.length > 0
    ) {

      const labPaths =
        labReports
          .map(
            function(report) {

              return report.file_path;

            }
          )
          .filter(
            function(path) {

              return Boolean(path);

            }
          );


      if (
        labPaths.length > 0
      ) {

        const {
          error: labStorageError
        } =
          await supabaseClient
            .storage
            .from(
              "investigation-reports"
            )
            .remove(
              labPaths
            );


        if (labStorageError) {

          throw labStorageError;

        }

      }


      const {
        error: labDeleteError
      } =
        await supabaseClient
          .from("investigation_reports")
          .delete()
          .eq(
            "consultation_id",
            consultationId
          );


      if (labDeleteError) {

        throw labDeleteError;

      }

    }


    /* -----------------------------------------
       DELETE CONSULTATION
       ----------------------------------------- */

    const {
      error: consultationDeleteError
    } =
      await supabaseClient
        .from("consultations")
        .delete()
        .eq(
          "id",
          consultationId
        );


    if (consultationDeleteError) {

      throw consultationDeleteError;

    }


    alert(
      "Consultation deleted successfully."
    );


    /* -----------------------------------------
       REFRESH HISTORY
       ----------------------------------------- */

    if (currentPatientId) {

      if (
        completeHistoryMode
      ) {

        await refreshCompleteConsultationHistory();

      } else {

        await openPatientHistory(
          currentPatientId,
          {
            year:
              selectedHistoryYear,
            month:
              selectedHistoryMonth,
            openResults:
              true
          }
        );

      }

    }


  } catch (error) {

    console.error(
      "Delete consultation error:",
      error
    );


    alert(
      "Unable to delete consultation:\n\n" +
      (
        error.message ||
        "Unknown error"
      )
    );

  }

}

/* =========================================================
   ADD PRESCRIPTION FROM HISTORY
   ========================================================= */

function addPrescriptionImagesFromHistory(
  consultationId
) {

  const input =
    document.createElement(
      "input"
    );


  input.type =
    "file";


  input.accept =
    "image/jpeg,image/png,image/webp";


  input.multiple =
    true;


  input.onchange =
    async function() {

      const files =
        Array.from(
          input.files ||
          []
        );


      if (
        files.length === 0
      ) {
        return;
      }


      try {

        for (
          let index = 0;
          index < files.length;
          index++
        ) {

          const file =
            files[index];


          if (
            !file.type.startsWith(
              "image/"
            )
          ) {
            continue;
          }


          const safeName =
            file.name.replace(
              /[^a-zA-Z0-9._-]/g,
              "_"
            );


          const path =
            "patient-" +
            currentPatientId +
            "/" +
            consultationId +
            "/" +
            Date.now() +
            "-" +
            index +
            "-" +
            safeName;


          const {
            error: uploadError
          } =
            await supabaseClient
              .storage
              .from(
                "prescriptions"
              )
              .upload(
                path,
                file,
                {
                  upsert: false,
                  contentType:
                    file.type
                }
              );


          if (uploadError) {

            throw uploadError;

          }


          const {
            data: publicData
          } =
            supabaseClient
              .storage
              .from(
                "prescriptions"
              )
              .getPublicUrl(
                path
              );


          const {
            error: insertError
          } =
            await supabaseClient
              .from(
                "consultation_images"
              )
              .insert({

                consultation_id:
                  consultationId,

                image_url:
                  publicData.publicUrl

              });


          if (insertError) {

            throw insertError;

          }


          /* SET MAIN IMAGE IF EMPTY */

          const {
            data: consultation
          } =
            await supabaseClient
              .from(
                "consultations"
              )
              .select(
                "prescription_image_url"
              )
              .eq(
                "id",
                consultationId
              )
              .single();


          if (
            consultation &&
            !consultation
              .prescription_image_url
          ) {

            await supabaseClient
              .from(
                "consultations"
              )
              .update({

                prescription_image_url:
                  publicData.publicUrl

              })
              .eq(
                "id",
                consultationId
              );

          }

        }


        alert(
          "Prescription image uploaded successfully."
        );


        /* REFRESH PRESCRIPTION PANEL */

        const panel =
          document.getElementById(
            "prescriptionPanel-" +
            consultationId
          );


        if (panel) {

          panel.classList.remove(
            "open"
          );

        }


        await togglePrescriptionHistory(
          consultationId
        );


      } catch (error) {

        console.error(
          "Prescription upload error:",
          error
        );


        alert(
          "Unable to upload prescription image:\n\n" +
          (
            error.message ||
            "Unknown error"
          )
        );

      }

    };


  input.click();

}
  
/* =========================================================
   PRESCRIPTION IMAGES
   INCLUDING LEGACY MAIN IMAGE
   ========================================================= */

async function getPrescriptionImages(
  consultationId
) {

  const [
    imageResult,
    consultationResult
  ] =
    await Promise.all([

      supabaseClient
        .from(
          "consultation_images"
        )
        .select("*")
        .eq(
          "consultation_id",
          consultationId
        )
        .order(
          "id",
          {
            ascending: true
          }
        ),

      supabaseClient
        .from(
          "consultations"
        )
        .select(
          "prescription_image_url"
        )
        .eq(
          "id",
          consultationId
        )
        .single()

    ]);


  const images =
    (
      imageResult.data ||
      []
    )
    .map(
      function(image) {

        return {

          id:
            image.id,

          image_url:
            image.image_url,

          consultation_id:
            consultationId,

          legacy:
            false

        };

      }
    );


  const legacyURL =
    consultationResult.data
      ? consultationResult
          .data
          .prescription_image_url
      : null;


  if (
    legacyURL &&
    !images.some(
      function(image) {

        return (
          image.image_url ===
          legacyURL
        );

      }
    )
  ) {

    images.unshift({

      id:
        null,

      image_url:
        legacyURL,

      consultation_id:
        consultationId,

      legacy:
        true

    });

  }


  return images;

}

/* =========================================================
   PARSE OLD VITALS TEXT
   ========================================================= */

function parseVitals(
  vitalsText
) {

  const vitals = {

    bp: "",
    pulse: "",
    spo2: "",
    temperature: "",
    weight: "",
    height: ""

  };


  if (!vitalsText) {

    return vitals;

  }


  const text =
    String(
      vitalsText
    );


  const bp =
    text.match(
      /BP:\s*([^|]+)/i
    );


  const pulse =
    text.match(
      /Pulse:\s*([^|]+)/i
    );


  const spo2 =
    text.match(
      /SpO[₂2]?:\s*([^|%]+)/i
    );


  const temperature =
    text.match(
      /Temperature:\s*([^|°]+)/i
    );


  const weight =
    text.match(
      /Weight:\s*([^|a-zA-Z]+)/i
    );


  const height =
    text.match(
      /Height:\s*([^|a-zA-Z]+)/i
    );


  if (bp) {

/* =========================================================
   ADD PRESCRIPTION
   ========================================================= */

function addPrescriptionImages(
  consultationId
) {

  const input =
    document.createElement(
      "input"
    );


  input.type =
    "file";


  input.accept =
    "image/jpeg,image/png,image/webp";


  input.multiple =
    true;


  input.onchange =
    async function() {

      const files =
        Array.from(
          input.files ||
          []
        );


      if (
        files.length === 0
      ) {
        return;
      }


      try {

        for (
          let index = 0;
          index < files.length;
          index++
        ) {

          const file =
            files[index];


          if (
            !file.type.startsWith(
              "image/"
            )
          ) {
            continue;
          }


          const safeName =
            file.name.replace(
              /[^a-zA-Z0-9._-]/g,
              "_"
            );


          const path =
            "patient-" +
            currentPatientId +
            "/" +
            consultationId +
            "/" +
            Date.now() +
            "-" +
            index +
            "-" +
            safeName;


          const {
            error:
              uploadError
          } =
            await supabaseClient
              .storage
              .from(
                "prescriptions"
              )
              .upload(
                path,
                file,
                {
                  upsert: false,
                  contentType:
                    file.type
                }
              );


          if (uploadError) {

            throw uploadError;

          }


          const {
            data:
              publicData
          } =
            supabaseClient
              .storage
              .from(
                "prescriptions"
              )
              .getPublicUrl(
                path
              );


          const {
            error:
              insertError
          } =
            await supabaseClient
              .from(
                "consultation_images"
              )
              .insert({

                consultation_id:
                  consultationId,

                image_url:
                  publicData.publicUrl

              });


          if (insertError) {

            throw insertError;

          }


          const {
            data:
              consultation
          } =
            await supabaseClient
              .from(
                "consultations"
              )
              .select(
                "prescription_image_url"
              )
              .eq(
                "id",
                consultationId
              )
              .single();


          if (
            consultation &&
            !consultation
              .prescription_image_url
          ) {

            await supabaseClient
              .from(
                "consultations"
              )
              .update({

                prescription_image_url:
                  publicData.publicUrl

              })
              .eq(
                "id",
                consultationId
              );

          }

        }


        alert(
          "Prescription image uploaded successfully."
        );


        await openEditConsultation(
          consultationId
        );


      } catch (error) {

        console.error(
          error
        );


        alert(
          "Unable to upload prescription image:\n\n" +
          error.message
        );

      }

    };


  input.click();

}

/* =========================================================
   PRESCRIPTION DOWNLOAD
   ========================================================= */

async function downloadPrescription(
  encodedURL,
  imageNumber
) {

  const url =
    decodeURIComponent(
      encodedURL
    );


  try {

    const response =
      await fetch(
        url
      );


    if (!response.ok) {

      throw new Error(
        "Unable to download file."
      );

    }


    const blob =
      await response.blob();


    const blobURL =
      URL.createObjectURL(
        blob
      );


    const link =
      document.createElement(
        "a"
      );


    link.href =
      blobURL;


    link.download =
      "Prescription-" +
      imageNumber +
      ".jpg";


    document.body.appendChild(
      link
    );


    link.click();


    link.remove();


    setTimeout(
      function() {

        URL.revokeObjectURL(
          blobURL
        );

      },
      1000
    );


  } catch (error) {

    window.open(
      url,
      "_blank"
    );

  }

}


/* =========================================================
   PRESCRIPTION STORAGE PATH
   ========================================================= */

function getPrescriptionStoragePath(
  imageURL
) {

  if (!imageURL) {
    return null;
  }


  try {

    const url =
      new URL(
        imageURL
      );


    const markers = [

      "/storage/v1/object/public/prescriptions/",
      "/storage/v1/object/sign/prescriptions/"

    ];


    for (
      const marker of markers
    ) {

      const index =
        url.pathname.indexOf(
          marker
        );


      if (
        index !== -1
      ) {

        return decodeURIComponent(
          url.pathname.substring(
            index +
            marker.length
          )
        );

      }

    }


  } catch (error) {

    console.warn(
      error
    );

  }


  return null;

}


/* =========================================================
   DELETE PRESCRIPTION
   ========================================================= */

async function deletePrescription(
  imageId,
  encodedURL,
  consultationId,
  isLegacy
) {

  const confirmed =
    confirm(
      "Delete this prescription image permanently?"
    );


  if (!confirmed) {
    return;
  }


  const imageURL =
    decodeURIComponent(
      encodedURL
    );


  if (
    imageId !== null &&
    imageId !== undefined
  ) {

    const {
      error
    } =
      await supabaseClient
        .from(
          "consultation_images"
        )
        .delete()
        .eq(
          "id",
          imageId
        );


    if (error) {

      alert(
        "Unable to delete prescription image:\n\n" +
        error.message
      );

      return;

    }

  }


  const {
    data:
      consultation
  } =
    await supabaseClient
      .from(
        "consultations"
      )
      .select(
        "prescription_image_url"
      )
      .eq(
        "id",
        consultationId
      )
      .single();


  if (
    isLegacy ||
    (
      consultation &&
      consultation
        .prescription_image_url ===
      imageURL
    )
  ) {

    const {
      data:
        remaining
    } =
      await supabaseClient
        .from(
          "consultation_images"
        )
        .select("*")
        .eq(
          "consultation_id",
          consultationId
        )
        .order(
          "id",
          {
            ascending: true
          }
        );


    const nextImage =
      remaining &&
      remaining.length > 0
        ? remaining[0]
            .image_url
        : null;


    await supabaseClient
      .from(
        "consultations"
      )
      .update({

        prescription_image_url:
          nextImage

      })
      .eq(
        "id",
        consultationId
      );

  }


  const path =
    getPrescriptionStoragePath(
      imageURL
    );


  if (path) {

    await supabaseClient
      .storage
      .from(
        "prescriptions"
      )
      .remove([
        path
      ]);

  }


  alert(
    "Prescription image deleted."
  );


  await openEditConsultation(
    consultationId
  );

}

      report.file_name ||
      "lab-report";


    document.body.appendChild(
      link
    );


    link.click();


    link.remove();


    setTimeout(
      function() {

        URL.revokeObjectURL(
          blobURL
        );

      },
      1000
    );


  } catch (error) {

    alert(
      "Unable to download lab report."
    );

  }

}


/* =========================================================
   DELETE LAB
   ========================================================= */

async function deleteLabReport(
  reportId
) {

  const confirmed =
    confirm(
      "Delete this lab report permanently?"
    );


  if (!confirmed) {
    return;
  }


  const report =
    await getLabReport(
      reportId
    );


  if (!report) {

    return;

  }


  await supabaseClient
    .storage
    .from(
      "investigation-reports"
    )
    .remove([
      report.file_path
    ]);


  const {
    error
  } =
    await supabaseClient
      .from(
        "investigation_reports"
      )
      .delete()
      .eq(
        "id",
        reportId
      );


  if (error) {

    alert(
      "Unable to delete lab report:\n\n" +
      error.message
    );

    return;

  }


  alert(
    "Lab report deleted."
  );


  if (
    currentConsultationId
  ) {

    await openEditConsultation(
      currentConsultationId
    );

  }

}

/* =========================================================
   TOGGLE BILL HISTORY
   ========================================================= */

async function toggleBillHistory(
  consultationId
) {

  const panel =
    document.getElementById(
      "billPanel-" +
      consultationId
    );


  if (!panel) {
    return;
  }


  /* CLOSE IF ALREADY OPEN */

  if (
    panel.classList.contains(
      "open"
    )
  ) {

    panel.classList.remove(
      "open"
    );

    panel.innerHTML =
      "";

    return;

  }


  /* CLOSE OTHER PANELS */

  const prescriptionPanel =
    document.getElementById(
      "prescriptionPanel-" +
      consultationId
    );


  const labPanel =
    document.getElementById(
      "labPanel-" +
      consultationId
    );


  if (prescriptionPanel) {

    prescriptionPanel.classList.remove(
      "open"
    );

  }


  if (labPanel) {

    labPanel.classList.remove(
      "open"
    );

  }


  /* OPEN BILL PANEL */

  panel.classList.add(
    "open"
  );


  panel.innerHTML = `

    <div class="portal-message">
      Loading bills...
    </div>

  `;


  try {

    const {
      data: bills,
      error
    } =
      await supabaseClient
        .from(
          "billing"
        )
        .select("*")
        .eq(
          "consultation_id",
          consultationId
        )
        .order(
          "bill_date",
          {
            ascending: false
          }
        )
        .order(
          "id",
          {
            ascending: false
          }
        );


    if (error) {

      throw error;

    }


    let billsHTML =
      "";


    if (
      bills &&
      bills.length > 0
    ) {

      billsHTML =
        bills
          .map(
            function(bill) {

              const total =
                Number(
                  bill.total_amount ||
                  0
                );


              return `

                <div class="file-card">

                  <div class="file-name">

                    🧾 Bill
                    ${
                      bill.bill_number
                        ? escapeHTML(
                            bill.bill_number
                          )
                        : "#" +
                          escapeHTML(
                            bill.id
                          )
                    }

                  </div>


                  <div class="file-meta">

                    📅
                    ${formatDate(
                      bill.bill_date
                    )}

                    <br>

                    💰 Total:
                    ₹${total.toFixed(2)}

                    <br>

                    Payment:
                    ${escapeHTML(
                      bill.payment_status ||
                      "-"
                    )}

                  </div>


                  <div class="file-actions">

                    <button
                      type="button"
                      class="portal-button primary-button small-button"
                      onclick="openBillInBillingPage(
                        ${Number(
                          bill.id
                        )},
                        ${Number(
                          consultationId
                        )}
                      )">

                      👁 View Bill

                    </button>

                  </div>

                </div>

              `;

            }
          )
          .join("");

    } else {

      billsHTML = `

        <div class="portal-message">
          No bill created for this consultation.
        </div>

      `;

    }


    panel.innerHTML = `

      <div class="detail-box">

        <h4>
          💰 Bills
        </h4>


        ${billsHTML}


        <div class="action-row">

          <button
            type="button"
            class="portal-button success-button small-button"
            onclick="createBillForConsultation(
              ${Number(
                consultationId
              )}
            )">

            ➕ Create Bill

          </button>

        </div>

      </div>

    `;


  } catch (error) {

    console.error(
      "Bill history error:",
      error
    );


    panel.innerHTML = `

      <div class="portal-message">
        Unable to load bills.
      </div>

    `;

  }

}

/* =========================================================
   DIRECT PATIENT FROM URL
   ========================================================= */

async function handleURLPatient() {

  const params =
    new URLSearchParams(
      window.location.search
    );


  const patientId =
    params.get(
      "patient_id"
    );


  if (!patientId) {

    return false;

  }


  const year =
    params.get(
      "year"
    );


  const month =
    params.get(
      "month"
    );


  const view =
    params.get(
      "view"
    );


  await openPatientHistory(
    Number(
      patientId
    ),
    {
      year:
        year !== null
          ? Number(year)
          : undefined,
      month:
        month !== null
          ? Number(month)
          : undefined,
      openResults:
        view ===
        "consultations"
    }
  );


  return true;

}
